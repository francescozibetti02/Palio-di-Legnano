function fPropoiAlCapitano(i){
  const c=F.mktF.cavalli[i];
  const val=(2+F.intesa/10+F.esperienza*2)*rf(0.8,1.2);
  const soglia=c.valore/100;
  const el=R('FMKT_ESITO_'+i);
  if(val>=soglia){
    F.stallaContrada.push({...c});
    F.mktF.cavalli.splice(i,1);
    fAddLog('Capitano accetta '+c.nome+' in stalla!','grn');
    showToast('✦ Il Capitano accetta! '+c.nome+' entra in stalla.','grn');
    fSalva();fRenderMercato();
  } else {
    if(el)el.innerHTML=`<div class="evbox red" style="margin-top:6px">Il Capitano rifiuta. Prova con un altro cavallo o migliora l'intesa.</div>`;
    fAddLog('Capitano rifiuta '+c.nome,'red');
  }
}
function fAcquistaCav(i){
  const c=F.mktF.cavalli[i];
  if(F.oro<c.valore){showToast('Oro insufficiente!','red');return;}
  F.oro-=c.valore;
  const cavAcq={...c,annoAcquisto:F.anno,valoreAcquisto:c.valore};
  F.stallaPersonale.push(cavAcq);
  F.mktF.cavalli.splice(i,1);
  fAddLog('Acquistato '+c.nome+' per '+c.valore+' oro (personale)','inf');
  showToast('✦ '+c.nome+' nella tua stalla personale!','grn');
  fSalva();fRenderMercato();
}

// ── CORSA ADDESTRAMENTO ──
function fCorsaAddestramento(){
  if(F.corsaUsata){showToast('Corsa già effettuata questo mese!','red');return;}
  if(F._imprevistoPista){showToast('Pista impraticabile! Nessuna corsa questo mese.','red');return;}
  // 4 contrade casuali
  const tutte=Object.keys(CDB);
  const partecipanti=sample(tutte,4);
  // se la contrada del fantino non c'è, sostituisci uno
  if(!partecipanti.includes(F.contrada)){partecipanti[0]=F.contrada;}
  // sorteggio semplice su cavalli
  const cavDisp=[...F.stallaContrada,...F.stallaPersonale].filter(cv=>!cv._infortunato);
  if(!cavDisp.length){showToast('Serve almeno un cavallo!','red');return;}
  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:28px">🏋️</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:4px">Corsa di Addestramento</div>
      <div style="font-size:12px;color:rgba(201,168,76,.5)">Partecipanti: ${partecipanti.join(' · ')}</div>
    </div>
    <div class="card">
      <div class="ct">Scegli il cavallo</div>
      ${cavDisp.map((c,i)=>`<button class="btn w" onclick="fRunAddestramento(${i})" style="text-align:left;margin-bottom:6px;padding:10px">
        <span style="font-weight:700">${c.nome}</span>
        <span style="font-size:11px;color:rgba(201,168,76,.5);margin-left:8px">Vel:${c.vel} Acc:${c.acc} Ten:${c.ten}</span>
      </button>`).join('')}
    </div>
    <button class="btn w" onclick="fBuildDOM();fGoTo('mese')" style="margin-top:4px">← Annulla</button>
    <div id="FADDR_DATA" style="display:none" data-part="${JSON.stringify(partecipanti).replace(/"/g,'&quot;')}"></div>
  </div>`);
  F._addestramentoCav=[...cavDisp];
}

function fRunAddestramento(cavIdx){
  const cavList=F._addestramentoCav||[];
  const cavSel=cavList[cavIdx];
  if(cavSel&&(cavSel.stanchezza||0)>=3){showToast('Cavallo troppo stanco per correre!','red');return;}
  const el=R('FADDR_DATA');
  const partecipanti=el?JSON.parse(el.dataset.part.replace(/&quot;/g,'"')):Object.keys(CDB).slice(0,4);
  const cav=F._addestramentoCav[cavIdx];

  // Mostra minigioco mossa per addestramento
  F._addestramentoOnComplete=()=>{
    // simula batteria da 4
    const sc={};
    partecipanti.forEach(n=>{sc[n]=0;});
    const gpg=[];
    for(let g=1;g<=4;g++){
      partecipanti.forEach(n=>{
        const isP=(n===F.contrada);
        const c2=isP?cav:newIACav();
        let f2;
        if(isP){f2={bravura:F.bravura,esp:F.esperienza,mossa:F.mossa,emp:F.empatia};}
        else{const rivalEntry=Object.entries(F.rivali).find(([,info])=>info.contrada===n);if(rivalEntry){const[,info]=rivalEntry;f2={bravura:info.bravura||rnd(2,4),esp:info.esp||rnd(2,4),mossa:info.mossa||rnd(2,4),emp:info.emp||rnd(2,4)};}else{f2=newIAFan();}}
        const fatica=Math.max(0,(g-1)*(6-c2.res)*.2);
        const base=(c2.vel+c2.acc+c2.ten)-fatica+(f2.bravura*.5+(f2.emp||f2.empatia||1)*.2);
        sc[n]+=base*((g===1&&isP)?Mos.mult:1)+rf(0,3);
      });
      gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));
    }
    const finale=gpg[gpg.length-1];
    const pos=finale.indexOf(F.contrada)+1;
    const vinto=pos===1;
    if(vinto){F.bravura=clamp(F.bravura+1,1,5);fAddLog('Corsa addestramento vinta! +1 Bravura','grn');}
    else{fAddLog('Corsa addestramento: '+pos+'° posto.','inf');}
    const cavScelto=F._addestramentoCav[cavIdx];
    cavScelto.stanchezza=Math.min(3,(cavScelto.stanchezza||0)+1);
    cavScelto.intesaFant=Math.min(3,(cavScelto.intesaFant||0)+1);
    const tuttoCav=[...F.stallaContrada,...F.stallaPersonale];
    tuttoCav.forEach(cv=>{if(cv!==cavScelto)cv.stanchezza=Math.max(0,(cv.stanchezza||0)-1);});
    F.corsaUsata=true;fSalva();
    // Show interactive race screen
    fShowRaceInterattivaAdd(partecipanti, gpg, pos, vinto, cavIdx);
  };
  fShowMossaFantino('addestramento');
}

function fShowMossaFantino(fase){
  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:30px">🏁</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Il Canapo è Tirato!</div>
      <div style="font-size:12px;color:rgba(201,168,76,.5)">${fase==='finale'?'Finale':'Batteria'} · Ferma il cursore nella zona verde</div>
    </div>
    <div class="card"><div class="ct">Fase di mossa</div>
      <div class="mbar" id="MBAR" onclick="fFermaMossa('${fase}')">
        <div class="mz" id="MZ"></div><div class="mt2" id="MT2"></div><div class="mcu" id="MCU"></div></div>
      <div style="font-size:11px;color:rgba(201,168,76,.5)">Clicca per scattare</div>
    </div>
    <div id="MOS_RIS" style="display:none" class="card">
      <div id="MOS_T" style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px"></div>
      <div id="MOS_B" style="font-size:11px;color:rgba(201,168,76,.5);margin-bottom:10px"></div>
      <button class="btn gold w" id="MOS_BTN">Continua →</button>
    </div>
  </div>`);
  const vel=Math.max(.5,1+(1*.4)-(F.bravura*.1));
  const amp=Math.max(3,5+(F.mossa*2));
  // Amicizia fantini in batteria rende la zona più ampia
  const avgAmi=Object.values(F.rivali).reduce((s,r)=>s+r.amicizia,0)/Object.keys(F.rivali).length;
  const bonusAmi=avgAmi>=70?3:avgAmi>=50?1:0;
  Mos={tacca:rnd(30,80),amp:Math.max(3,amp+bonusAmi),vel,t:0,pos:50,active:true,mult:1};
  if(MosInt)clearInterval(MosInt);
  MosInt=setInterval(()=>{
    if(!Mos.active)return;Mos.t+=.04;Mos.pos=clamp((Math.sin(Mos.t*Mos.vel*2)+1)*50,0,100);
    const bar=R('MBAR');if(!bar){clearInterval(MosInt);return;}
    const w=bar.offsetWidth;
    const ce=R('MCU'),te=R('MT2'),ze=R('MZ');
    if(ce)ce.style.left=(Mos.pos/100*w-3)+'px';
    if(te)te.style.left=(Mos.tacca/100*w-1)+'px';
    if(ze){const a=Mos.amp/100*w;ze.style.left=(Mos.tacca/100*w-a/2)+'px';ze.style.width=a+'px';}
  },40);
}

function fFermaMossa(fase){
  if(!Mos.active)return;Mos.active=false;clearInterval(MosInt);MosInt=null;
  const d=Math.abs(Mos.pos-Mos.tacca);let esito,mult,msg;
  if(d<=Mos.amp/2){esito='OTTIMALE';mult=1.15;msg='⚡ PARTENZA A FIONDA!';F.mossa=clamp(F.mossa+1,1,5);}
  else if(Mos.pos>Mos.tacca+Mos.amp/2){esito='FALSA';mult=.1;msg='✗ PARTENZA FALSA!';F.mossa=clamp(F.mossa-1,1,5);}
  else{esito='LENTA';mult=.5;msg='⚠ PARTENZA LENTA';F.mossa=clamp(F.mossa-1,1,5);}
  Mos.mult=mult;
  R('MOS_RIS').style.display='block';
  const t=R('MOS_T');t.textContent=msg;
  t.style.color=esito==='OTTIMALE'?'#5DBB63':esito==='FALSA'?'#E05555':'var(--gold)';
  R('MOS_B').textContent=`Dist: ${Math.round(d)} · ×${mult} · Gestione mossa: ${F.mossa}/5`;
  fAddLog('Mossa ('+fase+'): '+esito,'inf');
  const btn=R('MOS_BTN');
  if(btn){
    if(fase==='addestramento'&&F._addestramentoOnComplete){
      btn.onclick=F._addestramentoOnComplete;
    } else if(fase==='batteria'){
      btn.onclick=()=>fShowAccordiPreGara('batteria');
    } else {
      btn.onclick=()=>fShowAccordiPreGara('finale');
    }
  }
  fSalva();
}

// ── SCELTA DEL CAPITANO: chi corre il Palio ──
// Per ogni contrada avversaria, assegna 2 fantini dal DB e sceglie quello con media stats maggiore.
// Il fantino "scartato" da ogni contrada finisce nella pool della Provaccia.
function fCalcolaAssegnazioniContrade(){
  const altreContrade=Object.keys(CDB).filter(k=>k!==F.contrada);
  // Pool di fantini dal DB (escluso il compagno e il giocatore stesso)
  const nomeComp=F.nomeCompagno||null;
  const tuttiRivali=Object.keys(F.rivali);
  // Costruisce la lista di tutti i fantini DB disponibili con stats
  const fanDB=[...FANTINI_DB];
  // Mappa ogni contrada avversaria: assegna 2 fantini e sceglie il migliore
  const sceltePalio={}; // contrada → {scelto, scartato}
  const fantinoPerContrada={}; // contrada → nome fantino prescelto per il Palio
  const fantinoProvaccia=[]; // fantini scartati → possono correre la Provaccia
  // Usa i rivali già assegnati come base; trova 1 aggiuntivo per ogni contrada
  // Lista globale dei fantini fan1 già assegnati alle contrade (da F.rivali)
  const fan1GiàUsati=altreContrade.map(c=>{
    const e=Object.entries(F.rivali).find(([,i])=>i.contrada===c);
    return e?e[0]:null;
  }).filter(Boolean);
  // Lista globale dei fan2 già estratti (aggiornata ad ogni iterazione per evitare duplicati)
  const fan2GiàUsati=[];
  altreContrade.forEach(k=>{
    // Fantino già assegnato (dal DB)
    const rivalEntry=Object.entries(F.rivali).find(([,info])=>info.contrada===k);
    const fan1Nome=rivalEntry?rivalEntry[0]:null;
    const fan1Stats=fan1Nome?(FANTINI_MAP[fan1Nome]||{bravura:2,esp:2,mossa:2,emp:2}):{bravura:2,esp:2,mossa:2,emp:2};
    const media1=fan1Nome?((fan1Stats.bravura+fan1Stats.esp+fan1Stats.mossa+fan1Stats.emp)/4):0;
    // Costruisce lista globale di tutti i fantini già usati (fan1+fan2 di tutte le contrade + compagno)
    const tuttiUsati=[...fan1GiàUsati,...fan2GiàUsati,nomeComp].filter(Boolean);
    // Trova un secondo fantino casuale dal DB non già usato da nessuna contrada
    const disponibili=fanDB.filter(f=>f.nome!==fan1Nome&&!tuttiUsati.includes(f.nome));
    const fan2=disponibili.length?disponibili[Math.floor(Math.random()*disponibili.length)]:null;
    if(fan2)fan2GiàUsati.push(fan2.nome); // segna subito come usato per le prossime iterazioni
    const media2=fan2?((fan2.bravura+fan2.esp+fan2.mossa+fan2.emp)/4):0;
    // Il capitano sceglie quello con media più alta
    let sceltoNome, sceltoMedia, scartatoNome;
    if(!fan2||media1>=media2){
      sceltoNome=fan1Nome;sceltoMedia=media1;scartatoNome=fan2?fan2.nome:null;
    } else {
      sceltoNome=fan2.nome;sceltoMedia=media2;scartatoNome=fan1Nome;
    }
    fantinoPerContrada[k]={scelto:sceltoNome,sceltoMedia,scartato:scartatoNome,fan2:fan2?fan2.nome:null};
    if(scartatoNome)fantinoProvaccia.push({nome:scartatoNome,contrada:k});
  });
  F._fantinoPerContradaPalio=fantinoPerContrada;
  F._fantinoProvaccia=fantinoProvaccia;
  return {fantinoPerContrada,fantinoProvaccia};
}

// ── PROVACCIA (se il giocatore non viene scelto per il Palio) ──
// La Provaccia si svolge come il Palio ma con i fantini scartati dalle altre contrade.
// Pool: i fantini non scelti dai rispettivi capitani delle altre contrade.
// Il giocatore corre con la sua contrada nella Provaccia.
function fShowProvaccia(){
  if(!F)return;
  F._inProvaccia=true;
  // Recupera i fantini scartati (pool Provaccia)
  const fantinoPool=F._fantinoProvaccia||[];

  // (max 8 contrade − 1 (la propria) = 7 scartati + il giocatore = 8 partecipanti totali)

  // Mostra introduzione Provaccia
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px';

  const partHtml=fantinoPool.slice(0,7).map(f=>`<div style="font-size:12px;color:rgba(201,168,76,.7);padding:4px 0;border-bottom:1px solid rgba(201,168,76,.07)">🎽 ${f.nome} <span style="color:rgba(201,168,76,.4)">(${f.contrada})</span></div>`).join('');
  overlay.innerHTML=`
    <div style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 0 40px rgba(201,168,76,.2);max-height:90vh;overflow-y:auto">

        <div style="font-size:11px;color:rgba(201,168,76,.5);text-transform:uppercase;letter-spacing:2px;margin-top:3px">Anno ${F.anno} — Gara degli emergenti</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-bottom:12px"></div>
      <div style="padding:12px;background:rgba(0,0,0,.2);border-radius:10px;border-left:3px solid var(--gold);margin-bottom:12px">
        <div style="font-size:13px;color:var(--parch2);line-height:1.7">Non sei stato scelto per il Palio, ma puoi riscattarti nella <strong>Provaccia</strong>: la gara dei fantini emergenti. Batterie + Finale, stesse regole del Palio. Se vinci: <strong style="color:#5DBB63">+1 Esperienza · +100 oro</strong></div>
      </div>

          <div style="font-size:12px;color:var(--gold);font-weight:700;padding:4px 0;border-bottom:1px solid rgba(201,168,76,.1)">▶ ${F.nome} (tu) — ${F.contrada}</div>

    </div>`;

  const tutti=[...F.stallaContrada,...F.stallaPersonale].filter(cv=>(cv.stanchezza||0)<3&&!cv._infortunato);

  F._meteo=sorteggiMeteo();

    </div>
    ${meteoHTML(F._meteo)}
    ${tutti.map((c,i)=>`<div class="card" style="cursor:pointer" onclick="fScegliCavProvaccia(${i},${!!(prefCap&&c.nome===prefCap.nome)})">

    </div>`).join('')}

}

function fScegliCavProvaccia(idx,isPrefCap){
  F.cavScelta=F._sceltaCavList[idx];
  applicaMeteoACav(F.cavScelta,F._meteo);
  if(isPrefCap){F.intesa=clamp(F.intesa+25,0,100);fAddLog('Provaccia: scelto il cavallo del capitano. Intesa +25','grn');}
  else{F.intesa=clamp(F.intesa-10,0,100);fAddLog('Provaccia: scelto cavallo diverso da quello del capitano. Intesa −10','red');}
  fSalva();
  fShowSorteggioBatterieProvaccia();
}

function fShowSorteggioBatterieProvaccia(){
  // Costruisce le batterie della Provaccia usando i fantini scartati come contrade
  const fanPool=F._fantinoProvaccia||[];
  // Crea lista di "contrade" per la Provaccia: la propria + quelle dei fantini scartati
  const contPartic=[F.contrada,...fanPool.map(f=>f.contrada)];
  // Assicura max 8 partecipanti e niente duplicati
  const unicoP=[...new Set(contPartic)].slice(0,8);
  // Shuffle e dividi in 2 batterie da 4
  const shuffled=[...unicoP].sort(()=>Math.random()-.5);
  let bP,bIA;
  if(shuffled.slice(0,4).includes(F.contrada)){bP=shuffled.slice(0,4);bIA=shuffled.slice(4);}
  else{bIA=shuffled.slice(0,4);bP=shuffled.slice(4);}
  // Se bP ha meno di 4, completa con contrade rimanenti
  while(bP.length<4&&bIA.length>2){bP.push(bIA.shift());}
  while(bIA.length<4&&bP.length>2){bIA.push(bP.shift());}
  F._fprovP=bP;F._fprovIA=bIA;

  const ob=fCalcObiettivoCapitanoProvaccia('batteria');
  F._obiettivoCapBatteria=ob;
  fSalva();

  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:30px">🎲</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Sorteggio Batterie — Provaccia</div>
    </div>
    <div class="card"><div class="ct">Batteria A — la tua batteria</div>
      <div class="batt-box">${bP.map(n=>`<div class="batt-nome ${n===F.contrada?'tu':''}">${n===F.contrada?'▶ '+n+' (tu)':n}</div>`).join('')}</div>
      <div style="font-size:11px;color:rgba(201,168,76,.5)">Le prime 2 si qualificano per la finale.</div>
    </div>
    <div class="card"><div class="ct">Batteria B</div>
      <div class="batt-box">${bIA.map(n=>`<div class="batt-nome">${n}</div>`).join('')}</div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,rgba(61,0,0,.3),rgba(26,14,8,.8));border-color:rgba(201,168,76,.4)">
      <div class="ct">💬 L'Obiettivo del Capitano</div>
      <div style="text-align:center;font-size:28px;margin-bottom:8px">${ob.icona}</div>
      <div style="font-size:13px;color:var(--parch2);line-height:1.7;padding:10px;background:rgba(0,0,0,.2);border-radius:8px;border-left:3px solid ${ob.colore}">${ob.testo}</div>
      <div style="font-size:11px;color:rgba(201,168,76,.4);margin-top:8px;text-align:center">Successo: Intesa +20 · Fallimento: Intesa −20</div>
    </div>
    <button class="btn gold w" onclick="fShowMossaFantinoProvaccia('batteria')">⚔ Il canapo è tirato! →</button>
  </div>`);
}

function fCalcObiettivoCapitanoProvaccia(fase){
  const media=(F.bravura+F.esperienza+F.mossa+F.empatia)/4;
  if(media<=3){
    return {tipo:'qualificati', testo:'Il Capitano ti guarda: "Qualificati per la finale della Provaccia!"', icona:'🎯', colore:'var(--gold)'};
  } else {
    return {tipo:'vinci', testo:'Il Capitano ti sprona: "Vinci la Provaccia e dimostra il tuo valore!"', icona:'🏆', colore:'#5DBB63'};
  }
}

function fShowMossaFantinoProvaccia(fase){
  // Uguale al minigioco mossa standard ma con redirect alla Provaccia
  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:30px">🏁</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Il Canapo è Tirato!</div>

    </div>
    <div class="card"><div class="ct">Fase di mossa</div>

        <div class="mz" id="MZ"></div><div class="mt2" id="MT2"></div><div class="mcu" id="MCU"></div></div>
      <div style="font-size:11px;color:rgba(201,168,76,.5)">Clicca per scattare</div>
    </div>
    <div id="MOS_RIS" style="display:none" class="card">
      <div id="MOS_T" style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px"></div>
      <div id="MOS_B" style="font-size:11px;color:rgba(201,168,76,.5);margin-bottom:10px"></div>
      <button class="btn gold w" id="MOS_BTN">Continua →</button>
    </div>
  </div>`);
  const vel=Math.max(.5,1+(1*.4)-(F.bravura*.1));
  const amp=Math.max(3,5+(F.mossa*2));
  const avgAmi=Object.values(F.rivali).reduce((s,r)=>s+r.amicizia,0)/Object.keys(F.rivali).length;
  const bonusAmi=avgAmi>=70?3:avgAmi>=50?1:0;
  Mos={tacca:rnd(30,80),amp:Math.max(3,amp+bonusAmi),vel,t:0,pos:50,active:true,mult:1};
  if(MosInt)clearInterval(MosInt);
  MosInt=setInterval(()=>{
    if(!Mos.active)return;Mos.t+=.04;Mos.pos=clamp((Math.sin(Mos.t*Mos.vel*2)+1)*50,0,100);
    const bar=R('MBAR');if(!bar){clearInterval(MosInt);return;}
    const w=bar.offsetWidth;
    const ce=R('MCU'),te=R('MT2'),ze=R('MZ');
    if(ce)ce.style.left=(Mos.pos/100*w-3)+'px';
    if(te)te.style.left=(Mos.tacca/100*w-1)+'px';
    if(ze){const a=Mos.amp/100*w;ze.style.left=(Mos.tacca/100*w-a/2)+'px';ze.style.width=a+'px';}
  },40);
}

function fFermaMossaProvaccia(fase){
  if(!Mos.active)return;Mos.active=false;clearInterval(MosInt);MosInt=null;
  const d=Math.abs(Mos.pos-Mos.tacca);let esito,mult,msg;
  if(d<=Mos.amp/2){esito='OTTIMALE';mult=1.15;msg='⚡ PARTENZA A FIONDA!';F.mossa=clamp(F.mossa+1,1,5);}
  else if(Mos.pos>Mos.tacca+Mos.amp/2){esito='FALSA';mult=.1;msg='✗ PARTENZA FALSA!';F.mossa=clamp(F.mossa-1,1,5);}
  else{esito='LENTA';mult=.5;msg='⚠ PARTENZA LENTA';F.mossa=clamp(F.mossa-1,1,5);}
  Mos.mult=mult;
  R('MOS_RIS').style.display='block';
  const t=R('MOS_T');t.textContent=msg;
  t.style.color=esito==='OTTIMALE'?'#5DBB63':esito==='FALSA'?'#E05555':'var(--gold)';
  R('MOS_B').textContent=`Dist: ${Math.round(d)} · ×${mult} · Gestione mossa: ${F.mossa}/5`;
  fAddLog('Mossa Provaccia ('+fase+'): '+esito,'inf');
  const btn=R('MOS_BTN');
  if(btn){
    if(fase==='batteria'){
      btn.onclick=()=>fShowAccordiProvaccia('batteria');
    } else {
      btn.onclick=()=>fShowAccordiProvaccia('finale');
    }
  }
  fSalva();
}

          <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:2px">−300 oro · ${ami}% probabilità accettazione</div>

function fEseguiCorsaProvaccia(){
  const fase=F._fasePalio;
  const giri=fase==='finale'?5:4;
  const bP=F._fprovP;
  const cav=F.cavScelta||F.stallaContrada[0]||F.stallaPersonale[0];
  fSyncEmpatia();fSalva();

  const partecipanti=fase==='batteria'?bP:[...(F._fprovQP||[]),...(F._fprovQIA||[])];
  const sc={};partecipanti.forEach(n=>sc[n]=0);const gpg=[];
  const accordo=F._accordoPatto||null;

  for(let g=1;g<=giri;g++){
    partecipanti.forEach(n=>{
      const isP=n===F.contrada;
      const c2=isP?cav:newIACav();
      let f2;
      if(isP){
        f2={bravura:F.bravura,esp:F.esperienza,mossa:F.mossa,emp:F.empatia};
      } else {
        // Usa le stats del fantino scartato assegnato a questa contrada nella Provaccia
        const fanProv=(F._fantinoProvaccia||[]).find(fp=>fp.contrada===n);
        if(fanProv){
          const dbSt=FANTINI_MAP[fanProv.nome]||{bravura:rnd(2,4),esp:rnd(2,4),mossa:rnd(2,4),emp:rnd(2,4)};
          f2={bravura:dbSt.bravura,esp:dbSt.esp,mossa:dbSt.mossa,emp:dbSt.emp};
        } else {
          f2=newIAFan();
        }
      }
      const pen=isP&&c2._meteoPen?c2._meteoPen:{ten:0,res:0};
      const resEff=Math.max(1,c2.res-(pen.res||0));
      const tenEff=Math.max(1,c2.ten-(pen.ten||0));
      const fatica=Math.max(0,(g-1)*(6-resEff)*.2);
      if(isP){const st=fStatCorsaEffettiva(c2);c2._bonTen=st.ten-c2.ten;c2._bonNer=st.ner-c2.ner;}
      const bonTen=isP?(c2._bonTen||0):0;
      let base=(c2.vel+c2.acc+tenEff+bonTen)-fatica+(f2.bravura*.5+(f2.emp||1)*.2);
      if(accordo&&g===giri){
        const rivalInfo=F.rivali[accordo];
        if(rivalInfo&&rivalInfo.contrada===n) base*=0.5;
      }
      sc[n]+=base*((g===1&&isP)?Mos.mult:1)+rf(0,3);
    });
    gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));
  }
  const classFinale=gpg[gpg.length-1];
  const pos=classFinale.indexOf(F.contrada)+1;
  const qP=classFinale.slice(0,2);

  if(fase==='batteria'){
    F._fprovQP=qP;
    const gpgIA=[];const scIA={};(F._fprovIA||[]).forEach(n=>scIA[n]=0);
    for(let g=1;g<=4;g++){(F._fprovIA||[]).forEach(n=>{scIA[n]+=(rnd(2,5)+rnd(2,5)+rnd(1,5))+rf(0,3);});gpgIA.push([...Object.entries(scIA)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));}
    F._fprovQIA=gpgIA[gpgIA.length-1].slice(0,2);
    fSalva();
  }

  const playerIn=fase==='finale'?true:qP.includes(F.contrada);
  const vinto=fase==='finale'&&pos===1;

  // Valuta obiettivo capitano
  if(fase==='batteria'){
    const ob=F._obiettivoCapBatteria;
    if(ob){
      const succ=ob.tipo==='qualificati'?playerIn:vinto;
      if(succ){F.intesa=clamp(F.intesa+20,0,100);fAddLog('Obiettivo Provaccia (batteria) raggiunto! Intesa +20','grn');}
      else{F.intesa=clamp(F.intesa-20,0,100);fAddLog('Obiettivo Provaccia (batteria) fallito. Intesa −20','red');}
    }
  }

  if(vinto){
    F.esperienza=clamp(F.esperienza+1,1,5);
    F.oro+=100;
    F.premi=F.premi||[];
    F.premi.push({anno:F.anno,contrada:F.contrada,isProvaccia:true});
    F._vintoProvacciaQuestAnno=true; // flag per offerta a fine anno
    fAddLog('🏆 HAI VINTO LA PROVACCIA '+F.anno+'! +1 Esperienza, +100 oro','grn');
  }
  if(F.cavScelta)ripristinaMeteo(F.cavScelta);
  fSyncEmpatia();fSalva();

  // Mostra gara interattiva Provaccia
  fShowRaceInterattivaProvaccia(partecipanti, gpg, giri, vinto, playerIn, pos, fase, qP);
}

// ── PALIO AUTOMATICO (il giocatore non è stato scelto — usato DOPO la Provaccia) ──
function fPalioAutomatico(nomeCompagno){
  // Simula il palio: batterie + finale completamente automatiche
  const tutte=Object.keys(CDB);
  const shuffled=[...tutte].sort(()=>Math.random()-.5);
  let bP,bIA;
  if(shuffled.slice(0,4).includes(F.contrada)){bP=shuffled.slice(0,4);bIA=shuffled.slice(4);}
  else{bIA=shuffled.slice(0,4);bP=shuffled.slice(4);}

  // Simula batterie automatiche
  const scP={};bP.forEach(n=>scP[n]=0);
  for(let g=1;g<=4;g++){bP.forEach(n=>{scP[n]+=(rnd(2,5)+rnd(2,5)+rnd(1,5))+rf(0,3);});}
  const classP=Object.entries(scP).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const qP=classP.slice(0,2);

  const scIA={};bIA.forEach(n=>scIA[n]=0);
  for(let g=1;g<=4;g++){bIA.forEach(n=>{scIA[n]+=(rnd(2,5)+rnd(2,5)+rnd(1,5))+rf(0,3);});}
  const classIA=Object.entries(scIA).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const qIA=classIA.slice(0,2);

  // Simula finale automatica
  const finalisti=[...qP,...qIA];
  const scF={};finalisti.forEach(n=>scF[n]=0);
  for(let g=1;g<=5;g++){finalisti.forEach(n=>{scF[n]+=(rnd(2,5)+rnd(2,5)+rnd(1,5))+rf(0,3);});}
  const classF=Object.entries(scF).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const vincitore=classF[0];
  const contraddaVince=vincitore;
  const vince_mia_contrada=(vincitore===F.contrada);

  // Aggiorna stato (anno perso, nessun premio, effetti su intesa/sostegno) — solo se non già fatto dalla Provaccia
  if(!F._inProvaccia){
    F.esperienza=clamp(F.esperienza-1,1,5);
    F.intesa=clamp(F.intesa-10,0,100);
    F.sostegno=clamp(F.sostegno-20,0,100);
    fSyncEmpatia();
  }
  // Registra nell'album storico se presente
  if(!F.log)F.log=[];
  fAddLog('Palio '+F.anno+': non scelto dal capitano. Vince '+vincitore,'red');
  fSalva();

  // Mostra schermata risultato palio automatico
  fMostraRisultatoPalioAuto(vincitore, vince_mia_contrada);
}

function fShowSceltaCavallo(){
  const tutti=[...F.stallaContrada,...F.stallaPersonale].filter(cv=>(cv.stanchezza||0)<3&&!cv._infortunato);
  const tuttiTutti=[...F.stallaContrada,...F.stallaPersonale];
  if(!tutti.length){alert('Nessun cavallo disponibile (stanchezza 3 o infortunato)!');return;}
  // Il capitano preferisce il cavallo MIGLIORE della stalla di contrada (non per forza il primo).
  // La valutazione si basa sulla somma delle statistiche positive (vel+acc+ten+res) meno il nervosismo.
  const stallaContrDisp=F.stallaContrada.filter(cv=>(cv.stanchezza||0)<3&&!cv._infortunato);
  let prefCap=null;
  if(stallaContrDisp.length){
    prefCap=stallaContrDisp.reduce((best,cv)=>{
      const score=(cv.vel||0)+(cv.acc||0)+(cv.ten||0)+(cv.res||0)-(cv.ner||0);
      const bestScore=(best.vel||0)+(best.acc||0)+(best.ten||0)+(best.res||0)-(best.ner||0);
      return score>bestScore?cv:best;
    });
  }
  F._meteo=sorteggiMeteo();
  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:30px">🐎</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Scegli il cavallo per il Palio</div>
      ${prefCap?`<div style="font-size:12px;color:var(--gold);margin-top:4px">Il Capitano preferisce: <strong>${prefCap.nome}</strong></div>`:''}
    </div>
    ${meteoHTML(F._meteo)}
    ${tutti.map((c,i)=>{
      const isContrada=F.stallaContrada.some(sc=>sc===c||sc.nome===c.nome);
      const isPref=prefCap&&c.nome===prefCap.nome;
      const badge=isPref?'<span class="bdg g">♥ Cap. preferisce</span>'
        :(isContrada?'<span class="bdg o">contrada</span>':'<span class="bdg r">personale</span>');
      return `<div class="card" style="cursor:pointer" onclick="fScegliCavParlio(${i},${!!isPref})">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold)">${c.nome}</div>
        ${badge}
      </div>
      ${sRow('Velocità',c.vel)}${sRowCapped('Accelerazione',c.acc,c.maxAcc)}${sRow('Tenuta curva',c.ten)}${sRowCapped('Resistenza',c.res,c.maxRes)}${sRow('Nervosismo',c.ner,5,true)}
    </div>`;}).join('')}
    <div id="FSCELTA_CAV_LIST" style="display:none">${JSON.stringify(tutti)}</div>
  </div>`);
  F._sceltaCavList=tutti;
}

function fScegliCavParlio(idx,isPrefCap){
  F.cavScelta=F._sceltaCavList[idx];
  applicaMeteoACav(F.cavScelta,F._meteo);
  if(isPrefCap){F.intesa=clamp(F.intesa+25,0,100);fAddLog('Hai scelto il cavallo del capitano. Intesa +25','grn');}
  else{F.intesa=clamp(F.intesa-10,0,100);fAddLog('Hai scelto un cavallo diverso da quello del capitano. Intesa −10','red');}

// ── SORTEGGIO BATTERIE FANTINO ──
function fCalcObiettivoCapitano(fase){
  // Calcola obiettivo del capitano basato sulle statistiche del fantino e situazione
  const media=(F.bravura+F.esperienza+F.mossa+F.empatia)/4;
  const bP=F._fbP||[];
  const finalisti=[...(F._fbQP||[]),...(F._fbQIA||[])];
  const partecipantiCorrente=fase==='finale'?finalisti:bP;
  const haNemica=partecipantiCorrente.includes(F.nemica);

  if(haNemica && media<=4){
    return {tipo:'elimina_nemica', testo:`Il Capitano ti sussurra: "Elimina ${F.nemica}! Non lasciarla vincere questa gara."`, icona:'⚔️', colore:'#E05555'};
  } else if(media<=3){
    return {tipo:'qualificati', testo:'Il Capitano ti guarda negli occhi: "Qualificati per la finale. È tutto ciò che chiedo."', icona:'🎯', colore:'var(--gold)'};
  } else {
    return {tipo:'vinci', testo:'Il Capitano ti stringe la spalla: "Sei pronto. Qualificati e vinci il Palio. Ce la fai."', icona:'🏆', colore:'#5DBB63'};
  }
}

function fValutaObiettivoCapitano(fase, pos, qualificato, vinto){
  // Valuta se l'obiettivo del capitano è stato soddisfatto e applica effetti
  let ob=fase==='finale'?(F._obiettivoCapFinale||null):(F._obiettivoCapBatteria||null);
  if(!ob)return;
  let successo=false;
  const bP=F._fbP||[];
  const finalisti=[...(F._fbQP||[]),...(F._fbQIA||[])];
  const partecipanti=fase==='finale'?finalisti:bP;
  const nemikaInGara=partecipanti.includes(F.nemica);

  if(ob.tipo==='qualificati'){
    successo=qualificato;
  } else if(ob.tipo==='vinci'){
    successo=vinto;
  } else if(ob.tipo==='elimina_nemica'){
    // Nemica eliminata = non è tra i primi 2 qualificati (batteria) o non vince (finale)
    if(fase==='batteria') successo=!F._fbQP.includes(F.nemica)&&!F._fbQIA.includes(F.nemica);
    else successo=pos!==1; // nemica non vince = qualsiasi risultato in cui non è prima (approssimazione: se giocatore non vince, la nemica potrebbe vincere — usiamo il risultato della nemica)
    // Usiamo una variabile salvata nel simulatore
    if(fase==='finale'&&F._nemikaPos!==undefined) successo=F._nemikaPos!==1;
  }

  if(successo){
    F.intesa=clamp(F.intesa+20,0,100);
    fAddLog('Obiettivo capitano raggiunto! Intesa +20','grn');
    F._esitoObiettivoCapitano={successo:true,fase,ob};
  } else {
    F.intesa=clamp(F.intesa-20,0,100);
    fAddLog('Obiettivo capitano fallito. Intesa −20','red');
    F._esitoObiettivoCapitano={successo:false,fase,ob};
  }
  fSyncEmpatia();fSalva();
}

          <div style="font-weight:700;color:var(--gold-l)">${nome} <span style="font-size:11px;color:rgba(201,168,76,.5)">(${info.contrada})</span></div>
          <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:2px">−300 oro · ${ami}% probabilità accettazione</div>
        </div>

      </button>`;
    });
  } else {
    html+=`<div style="font-size:13px;color:rgba(201,168,76,.4)">Nessun fantino noto in questa batteria.</div>`;

// ── ESEGUI CORSA ──
function fEseguiCorsa(){
  const fase=F._fasePalio;
  const giri=fase==='finale'?5:4;
  const bP=F._fbP;const bIA=F._fbIA;
  const cav=F.cavScelta||F.stallaContrada[0]||F.stallaPersonale[0];

  fSyncEmpatia();fSalva();

  // Simula corsa
  const partecipanti=fase==='batteria'?bP:[...(F._fbQP||[]),...(F._fbQIA||[])];
  const sc={};partecipanti.forEach(n=>sc[n]=0);const gpg=[];

  // Effetti accordo: chi ha l'accordo con il giocatore rallenta nell'ultimo giro
  const accordo=F._accordoPatto||null;

  for(let g=1;g<=giri;g++){
    partecipanti.forEach(n=>{
      const isP=n===F.contrada;
      // Per i rivali, cerca il fantino assegnato alla contrada e usa le sue stats fisse
      const c2=isP?cav:newIACav();
      let f2;
      if(isP){
        f2={bravura:F.bravura,esp:F.esperienza,mossa:F.mossa,emp:F.empatia};
      } else {
        // Trova il fantino rivale assegnato a questa contrada
        const rivalEntry=Object.entries(F.rivali).find(([,info])=>info.contrada===n);
        if(rivalEntry){
          const [,info]=rivalEntry;
          f2={bravura:info.bravura||FANTINI_MAP[rivalEntry[0]]?.bravura||rnd(2,4),
              esp:info.esp||FANTINI_MAP[rivalEntry[0]]?.esp||rnd(2,4),
              mossa:info.mossa||FANTINI_MAP[rivalEntry[0]]?.mossa||rnd(2,4),
              emp:info.emp||FANTINI_MAP[rivalEntry[0]]?.emp||rnd(2,4)};
        } else {
          f2=newIAFan();
        }
      }
      const pen=isP&&c2._meteoPen?c2._meteoPen:{ten:0,res:0};
      const resEff=Math.max(1,c2.res-(pen.res||0));
      const tenEff=Math.max(1,c2.ten-(pen.ten||0));
      const fatica=Math.max(0,(g-1)*(6-resEff)*.2);
      if(isP){const st=fStatCorsaEffettiva(c2);c2._bonTen=st.ten-c2.ten;c2._bonNer=st.ner-c2.ner;}
      const bonTen=isP?(c2._bonTen||0):0;
      let base=(c2.vel+c2.acc+tenEff+bonTen)-fatica+(f2.bravura*.5+(f2.emp||f2.empatia||1)*.2);
      // Accordo: il fantino con patto rallenta nell'ultimo giro
      if(accordo&&n!==F.contrada&&Object.keys(F.rivali).includes(accordo)){
        const rivalInfo=F.rivali[accordo];
        if(rivalInfo&&rivalInfo.contrada===partecipanti.find(ct=>ct===rivalInfo.contrada)&&g===giri){
          // controlla se questo partecipante è la contrada del fantino accordato
        }
      }
      // Applica rallentamento accordo: cerca la contrada del fantino accordato
      if(accordo&&g===giri){
        const rivalInfo=F.rivali[accordo];
        if(rivalInfo&&rivalInfo.contrada===n) base*=0.5;
      }
      sc[n]+=base*((g===1&&isP)?Mos.mult:1)+rf(0,3);
    });
    gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));
  }
  const classFinale=gpg[gpg.length-1];
  const pos=classFinale.indexOf(F.contrada)+1;
  const qP=classFinale.slice(0,2);

  // Salva posizione nemica per valutazione obiettivo
  F._nemikaPos=classFinale.indexOf(F.nemica)+1;

  if(fase==='batteria'){
    F._fbQP=qP;
    const gpgIA=[];const scIA={};F._fbIA.forEach(n=>scIA[n]=0);
    for(let g=1;g<=4;g++){F._fbIA.forEach(n=>{scIA[n]+=(rnd(2,5)+rnd(2,5)+rnd(1,5))+rf(0,3);});gpgIA.push([...Object.entries(scIA)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));}
    F._fbQIA=gpgIA[gpgIA.length-1].slice(0,2);
  }

  const playerIn=fase==='finale'?true:qP.includes(F.contrada);
  const vinto=fase==='finale'&&pos===1;

  // Valuta obiettivo capitano
  fValutaObiettivoCapitano(fase, pos, playerIn, vinto);

  if(vinto){
    F.bravura=clamp(F.bravura-1,1,5);F.esperienza=clamp(F.esperienza+1,1,5);
    F.intesa=clamp(F.intesa+50,0,100);F.sostegno=clamp(F.sostegno+50,0,100);
    F.premi=F.premi||[];F.premi.push({anno:F.anno,contrada:F.contrada});
    F.oro+=500;
    fAddLog('🏆 HAI VINTO IL PALIO '+F.anno+'! +500 oro, +1 Esp, +50 intesa, +50 sostegno','grn');
    // Intesa capitani rivali −20 alla vittoria
    Object.keys(F.intesaCapitani).forEach(k=>{if(k!==F.contrada)F.intesaCapitani[k]=clamp(F.intesaCapitani[k]-20,0,100);});
    fAddLog('Vittoria del Palio: intesa capitani rivali −20','red');
  } else if(fase==='finale'){
    F.bravura=clamp(F.bravura-1,1,5);F.esperienza=clamp(F.esperienza-1,1,5);
    fAddLog('Palio '+F.anno+': perso. −1 Bravura, −1 Esperienza','red');
  }
  if(F.cavScelta)ripristinaMeteo(F.cavScelta);
  fSyncEmpatia();fSalva();

  // Mostra schermata tasti interattivi durante animazione
  fShowRaceInterattiva(partecipanti, gpg, giri, vinto, playerIn, pos, fase, qP);
}

function fRaceAction(tipo){
  if(_fRaceActionUsed){showToast('Hai già usato un\'azione!','red');return;}
  _fRaceActionUsed=true;
  document.querySelectorAll('.race-action-btn').forEach(b=>{b.disabled=true;b.style.opacity='.35';});
  const esito=R('RACE_ACTION_ESITO');
  let msg='',colore='grn';
  const d=window._fRaceData;

  // Salva i delta temporanei (verranno ripristinati dopo la gara)
  if(!window._fRaceStatDelta)window._fRaceStatDelta={acc:0,res:0,vel:0,ten:0};

  if(tipo==='nerbo'){
    msg='🪄 Hai usato il nerbo! Accelerazione +1, Resistenza −1';
    if(F.cavScelta){F.cavScelta.acc=clamp(F.cavScelta.acc+1,1,5);F.cavScelta.res=clamp(F.cavScelta.res-1,1,5);window._fRaceStatDelta.acc+=1;window._fRaceStatDelta.res-=1;}
    fAddLog('Nerbo usato in gara: Acc +1, Res −1','inf');
  } else if(tipo==='curva'){
    msg='🔄 Curva stretta! Velocità +1, Tenuta −1';
    if(F.cavScelta){F.cavScelta.vel=clamp(F.cavScelta.vel+1,1,5);F.cavScelta.ten=clamp(F.cavScelta.ten-1,1,5);window._fRaceStatDelta.vel+=1;window._fRaceStatDelta.ten-=1;}
    fAddLog('Curva stretta: Vel +1, Ten −1','inf');
  } else if(tipo==='tieniti'){
    msg='🛡️ Ti tieni per l\'ultimo giro! Velocità −1, Resistenza +1';
    if(F.cavScelta){F.cavScelta.vel=clamp(F.cavScelta.vel-1,1,5);F.cavScelta.res=clamp(F.cavScelta.res+1,1,5);window._fRaceStatDelta.vel-=1;window._fRaceStatDelta.res+=1;}
    fAddLog('Tieniti per ultimo: Vel −1, Res +1','inf');
  } else if(tipo==='giubba'){
    // Tira giubba alla nemica: sorpasso garantito se nemica è davanti
    msg='👕 Tiri la giubba alla nemica! Sorpasso!';
    colore='grn';
    fAddLog('Tira giubba alla nemica: sorpasso!','grn');
    // Segna flag per simulatore
    window._fTiraGiubba=true;
  } else if(tipo==='frena'){
    msg='🛑 Freni il cavallo! Velocità −1 · Intesa capitani rivali +10';
    colore='inf';
    if(F.cavScelta){F.cavScelta.vel=clamp(F.cavScelta.vel-1,1,5);window._fRaceStatDelta.vel-=1;}
    Object.keys(F.intesaCapitani).forEach(k=>{if(k!==F.contrada)F.intesaCapitani[k]=clamp(F.intesaCapitani[k]+10,0,100);});
    fAddLog('Frena cavallo: Vel −1, Intesa capitani rivali +10','inf');
  }
  if(esito)esito.innerHTML=`<div class="evbox ${colore}">${msg}</div>`;
  fSyncEmpatia();fSalva();
}

// Ripristina le stat del cavallo modificate temporaneamente durante la gara
function fRipristinaStatRace(){
  if(window._fRaceStatDelta&&F.cavScelta){
    const d=window._fRaceStatDelta;
    if(d.acc)F.cavScelta.acc=clamp(F.cavScelta.acc-d.acc,1,5);
    if(d.res)F.cavScelta.res=clamp(F.cavScelta.res-d.res,1,5);
    if(d.vel)F.cavScelta.vel=clamp(F.cavScelta.vel-d.vel,1,5);
    if(d.ten)F.cavScelta.ten=clamp(F.cavScelta.ten-d.ten,1,5);
  }
  window._fRaceStatDelta=null;
}

function fRaceActionAdd(tipo){

  const esito=R('RACE_ACTION_ESITO');

  const d=window._fAddRaceData;

  if(tipo==='nerbo'){
    msg='🪄 Nerbo! Acc +1, Res −1';
    if(cav){cav.acc=clamp(cav.acc+1,1,5);cav.res=clamp(cav.res-1,1,5);window._fAddRaceStatDelta.acc+=1;window._fAddRaceStatDelta.res-=1;}
  } else if(tipo==='curva'){
    msg='🔄 Curva stretta! Vel +1, Ten −1';
    if(cav){cav.vel=clamp(cav.vel+1,1,5);cav.ten=clamp(cav.ten-1,1,5);window._fAddRaceStatDelta.vel+=1;window._fAddRaceStatDelta.ten-=1;}
  } else if(tipo==='tieniti'){
    msg='🛡️ Tieniti! Vel −1, Res +1';
    if(cav){cav.vel=clamp(cav.vel-1,1,5);cav.res=clamp(cav.res+1,1,5);window._fAddRaceStatDelta.vel-=1;window._fAddRaceStatDelta.res+=1;}
  } else if(tipo==='frena'){
    msg='🛑 Frena! Vel −1, Int. cap. rivali +10';

  fSalva();
}

function fFinaleSpettatore(){
  const finalisti=[...(F._fbQP||[]),...(F._fbQIA||[])];
  F._fasePalio='finale';Mos.mult=1;
  fEseguiCorsaSpettatore(finalisti);
}
function fEseguiCorsaSpettatore(finalisti){
  const sc={};finalisti.forEach(n=>sc[n]=0);const gpg=[];
  for(let g=1;g<=5;g++){finalisti.forEach(n=>{sc[n]+=(rnd(2,5)+rnd(2,5))+rf(0,3);});gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));}
  const vincitore=gpg[gpg.length-1][0];
  fAddLog('Finale: vince '+vincitore,'inf');fSalva();
  showRaceAnimation(finalisti, gpg, 5, null, ()=>{
    let html=`<div style="text-align:center;margin-bottom:12px"><div style="font-size:28px">👀</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:4px">Finalissima — Stai guardando dalle tribune</div></div>
    <div class="card">`;
    for(let g=0;g<gpg.length;g++){html+=`<div style="margin-bottom:7px"><div style="font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px">Giro ${g+1}/5</div>`;gpg[g].forEach((nome,p)=>{html+=`<div class="cr-line def">${p+1}° ${nome}${p===0&&g===gpg.length-1?' 🏆':''}</div>`;});html+=`</div>`;}
    html+=`</div><button class="btn gold w" onclick="fShowFineAnno(0)">Fine anno →</button>`;
    setMain('<div class="pad">'+html+'</div>');
  }, {titolo:'La Finalissima', sottotitolo:'Stai guardando dalle tribune · '+finalisti.join(' · ')});
}

// ── FINE ANNO FANTINO ──
function fShowFineAnno(vinto){
  F._vinto=vinto;
  const puoRestare=F.intesa>=40;
  const contradeCambiabili=Object.keys(CDB).filter(k=>k!==F.contrada&&(F.intesaCapitani[k]||0)>=60);
  // Controlla la condizione "anno da svincolato"
  const svincolato=!puoRestare&&!contradeCambiabili.length;
  if(svincolato){
    fShowAnnoSvincolato();return;
  }

  // Genera offerta da contrada rivale se vinto Provaccia o Palio
  const vintoProvaccia=F._vintoProvacciaQuestAnno||false;
  F._vintoProvacciaQuestAnno=false; // reset flag
  let offertaContrada=null,offertaOro=0;
  if(vinto){
    // Vinto il Palio: offerta tra 200 e 500 oro
    const altreContrPalio=Object.keys(CDB).filter(k=>k!==F.contrada);
    offertaContrada=altreContrPalio[Math.floor(Math.random()*altreContrPalio.length)];
    offertaOro=rnd(200,500);
  } else if(vintoProvaccia){
    // Vinto la Provaccia: offerta tra 50 e 300 oro
    const altreContrProv=Object.keys(CDB).filter(k=>k!==F.contrada);
    offertaContrada=altreContrProv[Math.floor(Math.random()*altreContrProv.length)];
    offertaOro=rnd(50,300);
  }

  let offertaHtml='';
  if(offertaContrada){
    const titoloOfferta=vinto?'🏆 Offerta Post-Palio':'🏁 Offerta Post-Provaccia';
    const descOfferta=vinto
      ? `La contrada <strong style="color:var(--gold)">${offertaContrada}</strong> ha notato la tua vittoria al Palio e ti offre <strong style="color:#5DBB63">${offertaOro} oro</strong> per passare con loro!`
      : `La contrada <strong style="color:var(--gold)">${offertaContrada}</strong> ha notato la tua vittoria nella Provaccia e ti offre <strong style="color:#5DBB63">${offertaOro} oro</strong> per passare con loro!`;
    offertaHtml=`<div class="card" style="border-color:rgba(93,187,99,.4);background:linear-gradient(135deg,rgba(26,74,26,.15),rgba(26,14,8,.8))">
      <div class="ct" style="color:#5DBB63">${titoloOfferta}</div>
      <div style="font-size:13px;color:var(--parch2);line-height:1.7;margin-bottom:10px">${descOfferta}</div>
      <div style="font-size:11px;color:rgba(201,168,76,.4);margin-bottom:10px">L'offerta è indipendente dall'intesa col capitano di ${offertaContrada}.</div>
      <button class="btn w" onclick="fAccettaOfferta('${offertaContrada}',${offertaOro})" style="margin-bottom:6px;background:linear-gradient(135deg,#2E7D32,#1A4D1A);border-color:#5DBB63;color:#5DBB63;font-weight:700">
        ✅ Accetta — Vai con ${offertaContrada} (+${offertaOro} oro)
      </button>
    </div>`;
  }

  setMain(`<div class="pad">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:30px">⚜</div>
      <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:8px">Fine Anno ${F.anno}</div>
    </div>
    <div class="card">
      ${fBar('Intesa col Capitano',F.intesa,'fnt-bar-green')}
      ${fBar('Sostegno contradaioli',F.sostegno,'fnt-bar-blue')}
    </div>
    ${offertaHtml}
    <div class="card">
      <div class="ct">Scegli il tuo futuro</div>
      ${puoRestare?`<button class="btn gold w" onclick="fNuovoAnno(false)" style="margin-bottom:8px">Rimani con ${F.contrada}</button>`
        :`<div class="evbox red" style="margin-bottom:8px">Intesa troppo bassa per restare (serve ≥40). Devi cambiare contrada.</div>`}
      ${contradeCambiabili.length?`<div style="font-size:12px;color:rgba(201,168,76,.5);margin-bottom:8px">Contrade disponibili (intesa ≥60):</div>
        ${contradeCambiabili.map(k=>`<button class="btn w" onclick="fNuovoAnno(true,'${k}')" style="margin-bottom:6px;text-align:left;padding:11px">
          Vai con ${k} <span style="font-size:11px;color:rgba(201,168,76,.5);margin-left:6px">Intesa: ${F.intesaCapitani[k]}/100</span>
        </button>`).join('')}`
        :`<div style="font-size:12px;color:rgba(201,168,76,.4)">Nessuna contrada disponibile al cambio (intesa <60).</div>`}
    </div>
  </div>`);
}

function fAccettaOfferta(nuovaContrada, oro){
  F.oro=(F.oro||0)+oro;
  fAddLog('Offerta accettata da '+nuovaContrada+'! +'+oro+' oro. Trasferito a '+nuovaContrada,'grn');
  fSalva();
  mostraSchermatGiubba(nuovaContrada, ()=>{
    fNuovoAnno(true, nuovaContrada);
  });
}

function fNuovoAnno(cambia,nuovaContrada){
  // Stalla contrada sempre azzerata a fine anno
  F.stallaContrada=[];
  if(cambia&&nuovaContrada){
    F.contrada=nuovaContrada;
    F.nemica=CDB[nuovaContrada].nemica;
    F.intesa=F.intesaCapitani[nuovaContrada]||60;
    fAddLog('Nuovo anno con '+nuovaContrada,'inf');
    // Riassegna rivali escludendo la nuova contrada del giocatore
    fRiassegnaRivali();
  } else {
    // Anche restando, riassegna casualmente i rivali (escludi la propria contrada)
    fRiassegnaRivali();
  }
  F.mi=0;F.anno++;
  F.veterinario=false;F._stipendioAumentato=false;
  F.corsaUsata=false;F.addestramentoContrataUsato=false;F.amiciziaMensile=0;
  F.cavScelta=null;F._fbP=null;F._fbIA=null;F._fbQP=null;F._fbQIA=null;
  F._tradimentoUsatoAnno=null;F._tradimentoAttivoPerContrada={};F._tradimentoAnnoSeed=null;
  F.mktF=fGenMkt();
  // Invecchiamento cavalli personali: solo dal 3° anno in stalla
  F.stallaPersonale.forEach(c=>{
    const anni=(F.anno+1)-(c.annoAcquisto||F.anno+1);
    if(anni>=3){
      c.maxAcc=Math.max(1,c.maxAcc-1);c.maxRes=Math.max(1,c.maxRes-1);
      c.acc=Math.min(c.acc,c.maxAcc);c.res=Math.min(c.res,c.maxRes);
    }
  });
  // Nemica fantini: −25 amicizia
  Object.entries(F.rivali).forEach(([n,info])=>{if(info.contrada===F.nemica)F.rivali[n].amicizia=clamp(info.amicizia-25,0,100);});
  fSyncEmpatia();fSalva();
  // Mostra schermata giubba prima di avviare la UI
  mostraSchermatGiubba(F.contrada, ()=>fAvviaUI());
}

function fRiassegnaRivali(){
  const altreContrade=Object.keys(CDB).filter(k=>k!==F.contrada);
  // assegna esattamente 7 fantini alle 7 contrade avversarie, 1 per contrada
  // e 1 alla contrada del giocatore come compagno
  const shuffled=[...altreContrade].sort(()=>Math.random()-.5);
  const nomiRivali=Object.keys(F.rivali);
  const shuffledNomi=[...nomiRivali].sort(()=>Math.random()-.5);
  shuffledNomi.forEach((nome,i)=>{
    if(i<shuffled.length) F.rivali[nome].contrada=shuffled[i];
    else if(i===shuffled.length) F.rivali[nome].contrada=F.contrada; // compagno
    else F.rivali[nome].contrada=null; // svincolato
  });
  // Aggiorna nomeCompagno
  const compagnoEntry=Object.entries(F.rivali).find(([,info])=>info.contrada===F.contrada);
  F.nomeCompagno=compagnoEntry?compagnoEntry[0]:null;
}

const CONTRADA_COLORS={
  Flora:        {c1:'#C0001A',c2:'#1A3A8C'},   // rosso/blu obliquo
  Legnarello:   {c1:'#C0001A',c2:'#F0C020'},   // rosso/giallo obliquo
  SanDomenico:  {c1:'#1A7A1A',c2:'#FFFFFF'},   // verde/bianco obliquo
  SantErasmo:   {c1:'#5BB8E8',c2:'#FFFFFF'},   // azzurro/bianco obliquo
  SantAmbrogio: {c1:'#1A7A1A',c2:'#F0C020'},   // verde/giallo obliquo
  SanMartino:   {c1:'#1A3A8C',c2:'#FFFFFF'},   // blu/bianco obliquo
  SanBernardino:{c1:'#C0001A',c2:'#FFFFFF'},   // rosso/bianco obliquo
  SanMagno:     {c1:'#C0001A',c2:'#FFFFFF',stripes:true} // rosso/bianco/rosso strisce verticali
};

// Disegna un pallino contrada su canvas 2D
function drawContradaDot(ctx, x, y, r, nome) {
  const cc = CONTRADA_COLORS[nome] || {c1:'#999',c2:'#555'};
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.clip();
  if (nome === 'SanMartino' || nome === 'San Martino') {
    // Pallino blu pieno con croce bianca — path unico per evitare artefatti all'intersezione
    ctx.fillStyle = '#1A3A8C';
    ctx.fillRect(x-r, y-r, r*2, r*2);
    const t = r * 0.38; // spessore braccio
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    // path a croce in senso orario, partendo da angolo in alto a sinistra del braccio verticale
    ctx.moveTo(x - t/2, y - r);
    ctx.lineTo(x + t/2, y - r);
    ctx.lineTo(x + t/2, y - t/2);
    ctx.lineTo(x + r,   y - t/2);
    ctx.lineTo(x + r,   y + t/2);
    ctx.lineTo(x + t/2, y + t/2);
    ctx.lineTo(x + t/2, y + r);
    ctx.lineTo(x - t/2, y + r);
    ctx.lineTo(x - t/2, y + t/2);
    ctx.lineTo(x - r,   y + t/2);
    ctx.lineTo(x - r,   y - t/2);
    ctx.lineTo(x - t/2, y - t/2);
    ctx.closePath();
    ctx.fill();
  } else if (cc.stripes) {
    // 3 strisce verticali: rosso | bianco | rosso
    ctx.fillStyle = cc.c1;
    ctx.fillRect(x-r, y-r, r*2, r*2);
    ctx.fillStyle = cc.c2;
    ctx.fillRect(x-r/3, y-r, r*2/3, r*2);
  } else {
    // divisione obliqua (diagonale /)
    ctx.fillStyle = cc.c1;
    ctx.fillRect(x-r, y-r, r*2, r*2);
    ctx.beginPath();
    ctx.moveTo(x-r, y+r); ctx.lineTo(x+r, y-r); ctx.lineTo(x+r, y+r); ctx.closePath();
    ctx.fillStyle = cc.c2;
    ctx.fill();
  }
  ctx.restore();
  // bordo
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

// Disegna ovale sulla pista su canvas ctx
function drawOvalPath(ctx, cx, cy, rx, ry) {
  const halfRx = rx * 0.5;
  ctx.beginPath();
  ctx.moveTo(cx - halfRx, cy - ry);
  ctx.lineTo(cx + halfRx, cy - ry);
  ctx.arc(cx + halfRx, cy, ry, -Math.PI/2, Math.PI/2);
  ctx.lineTo(cx - halfRx, cy + ry);
  ctx.arc(cx - halfRx, cy, ry, Math.PI/2, Math.PI*1.5);
  ctx.closePath();
}

// Posizione su pista - percorso ORARIO (canvas: y verso il basso)
// t=0 = traguardo = fine rettilineo inferiore lato sinistro = (cx-halfRx, cy+ry)
//   0.00-0.25: curva sinistra, da (cx-halfRx,cy+ry) a (cx-halfRx,cy-ry), angolo PI/2->3PI/2
//   0.25-0.50: rettilineo superiore sx->dx, da (cx-halfRx,cy-ry) a (cx+halfRx,cy-ry)
//   0.50-0.75: curva destra, da (cx+halfRx,cy-ry) a (cx+halfRx,cy+ry), angolo -PI/2->PI/2
//   0.75-1.00: rettilineo inferiore dx->sx, da (cx+halfRx,cy+ry) a (cx-halfRx,cy+ry)
function trackPosGlobal(t, cx, cy, rx, ry) {
  const phase = (t % 1 + 1) % 1;
  const halfRx = rx * 0.5;
  if (phase < 0.25) {
    // Curva sinistra: centro (cx-halfRx, cy), raggio ry
    const a = Math.PI/2 + (phase / 0.25) * Math.PI;
    return {x: cx - halfRx + Math.cos(a) * ry, y: cy + Math.sin(a) * ry};
  } else if (phase < 0.50) {
    // Rettilineo superiore: sx -> dx
    const p = (phase - 0.25) / 0.25;
    return {x: cx - halfRx + p * rx, y: cy - ry};
  } else if (phase < 0.75) {
    // Curva destra: centro (cx+halfRx, cy), raggio ry
    const a = -Math.PI/2 + ((phase - 0.50) / 0.25) * Math.PI;
    return {x: cx + halfRx + Math.cos(a) * ry, y: cy + Math.sin(a) * ry};
  } else {
    // Rettilineo inferiore: dx -> sx
    const p = (phase - 0.75) / 0.25;
    return {x: cx + halfRx - p * rx, y: cy + ry};
  }
}

function showRaceAnimation(batt, gpg, giriTotali, playerName, onComplete, extraInfo, actionsHtml) {
  // batt: array nomi partecipanti; gpg: array classifiche per giro; playerName: chi è il giocatore
  // extraInfo: {titolo, sottotitolo} opzionali
  // actionsHtml: HTML opzionale per i tasti azione da mostrare nella stessa schermata sopra la canvas
  if (_raceAnimFrame) { cancelAnimationFrame(_raceAnimFrame); _raceAnimFrame = null; }
  if (MosInt) { clearInterval(MosInt); MosInt = null; }

  const titolo = (extraInfo && extraInfo.titolo) || 'In Pista!';
  const sottotitolo = (extraInfo && extraInfo.sottotitolo) || '';

  setMain(`<div style="text-align:center;margin-bottom:10px">
    <div style="font-size:28px">🏇</div>
    <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:4px">${titolo}</div>
    ${sottotitolo?`<div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">${sottotitolo}</div>`:''}
  </div>
  ${actionsHtml||''}
  <div class="race-wrap">
    <div class="race-lap-info" id="RACE_LAP">Giro 1 / ${giriTotali}</div>
    <canvas id="RACE_CVS" class="race-canvas" height="220"></canvas>
    <div class="race-legend" id="RACE_LEG"></div>
  </div>
  <div class="card race-pos-list" id="RACE_POS"></div>
  <div id="RACE_NEXT" style="display:none">
    <button class="btn gold w" id="RACE_BTN">Continua →</button>
  </div>`);

  const canvas = document.getElementById('RACE_CVS');
  if (!canvas) return;
  canvas.width = canvas.offsetWidth || 340;
  const W = canvas.width, H = 220;
  const cx = W/2, cy = H/2;
  const rx = W*0.38, ry = H*0.36;
  const ctx = canvas.getContext('2d');

  // Legenda
  const legEl = document.getElementById('RACE_LEG');
  if (legEl) {
    legEl.innerHTML = batt.map(n => {
      const cc = CONTRADA_COLORS[n] || {c1:'#999',c2:'#555'};
      const isP = n === playerName;
      // mini canvas per legenda
      return `<div class="race-leg-item">
        <canvas width="16" height="16" id="LEG_${n.replace(/[^a-z]/gi,'_')}"></canvas>
        <span style="color:${isP?'var(--gold)':'rgba(201,168,76,.7)'};font-weight:${isP?700:400}">${n}${isP?' (tu)':''}</span>
      </div>`;
    }).join('');
    batt.forEach(n => {
      const lc = document.getElementById('LEG_'+n.replace(/[^a-z]/gi,'_'));
      if (lc) { const lctx = lc.getContext('2d'); drawContradaDot(lctx, 8, 8, 7, n); }
    });
  }

  // Stato animazione
  const N = batt.length;
  const R_DOT = Math.max(7, Math.min(11, 60/N));
  const GIRO_DURATION = 6500; // ms per giro (più lento, realistico)
  let currentGiro = 0;
  let startTime = null;
  // Posizioni t ∈ [0,1) per ogni partecipante
  // Inizialmente spalmati sulla linea di partenza (rettilineo superiore)
  // t=0 = traguardo; t piccolo = subito dopo il traguardo
  // Al giro g, la classifica dice chi è davanti
  // Calcoliamo offset t dalla classifica
  const tPos = {}; // t corrente di ogni partecipante
  const tTarget = {}; // t target alla fine del giro
  const tStart = {}; // t all'inizio del giro

  function initPositions() {
    batt.forEach((n, i) => {
      // partenza: tutti al traguardo (t=0) con piccolo offset di fila
      tPos[n] = 0.001 * i;
    });
  }
  function setTargetsForGiro(g) {
    // Il vincitore del giro g ha fatto 1 giro in più
    const rank = gpg[g]; // classifica [primo, ..., ultimo]
    const spread = 0.08; // distanza max tra primo e ultimo
    rank.forEach((n, pos) => {
      // primo = più avanti (t più alto = quasi completato il giro)
      // Simula: il primo è a t = (g+1) + piccola distanza, l'ultimo è indietro
      tTarget[n] = (g + 1) - pos * spread / (N - 1 || 1);
    });
    batt.forEach(n => { tStart[n] = tPos[n]; });
  }

  initPositions();
  setTargetsForGiro(0);

  function renderFrame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const prog = Math.min(elapsed / GIRO_DURATION, 1);
    // ease in-out
    const ease = prog < 0.5 ? 2*prog*prog : -1+(4-2*prog)*prog;

    // aggiorna posizioni
    batt.forEach(n => {
      const t = tStart[n] + (tTarget[n] - tStart[n]) * ease;
      tPos[n] = t;
    });

    // Disegna
    ctx.clearRect(0, 0, W, H);

    const trackW = 28;

    // SFONDO VERDE (esterno)
    ctx.fillStyle = '#2D5A27';
    ctx.fillRect(0, 0, W, H);

    // Pista sabbia (ovale esterno)
    drawOvalPath(ctx, cx, cy, rx + trackW*2, ry + trackW);
    ctx.fillStyle = '#D4B483';
    ctx.fill();

    // Verde interno
    drawOvalPath(ctx, cx, cy, rx - trackW, ry - trackW);
    ctx.fillStyle = '#3A7A32';
    ctx.fill();

    // Bordi pista
    drawOvalPath(ctx, cx, cy, rx + trackW*2, ry + trackW);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    drawOvalPath(ctx, cx, cy, rx - trackW, ry - trackW);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Traguardo: a t=0 i pallini sono a (cx-halfRx, cy+ry) — fine rettilineo inferiore
    const halfRxT = rx * 0.5;
    const tgX = cx - halfRxT;
    ctx.save();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(tgX, cy + ry - trackW - 4);
    ctx.lineTo(tgX, cy + ry + trackW + 4);
    ctx.stroke();
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(tgX, cy + ry - trackW - 4, 9, 5);
    ctx.fillStyle = '#C0001A';
    ctx.fillRect(tgX, cy + ry - trackW + 2, 9, 5);
    ctx.restore();

    // Pallini (ordine per z: ultimi sotto, primi sopra)
    const ranked = [...batt].sort((a,b) => tPos[a] - tPos[b]);
    ranked.forEach(n => {
      const t = (tPos[n] % 1 + 1) % 1;
      const pt = trackPosGlobal(t, cx, cy, rx, ry);
      drawContradaDot(ctx, pt.x, pt.y, R_DOT, n);
      if (n === playerName) {
        ctx.font = 'bold 8px sans-serif';
        ctx.fillStyle = '#FFD700';
        ctx.textAlign = 'center';
        ctx.fillText('▲', pt.x, pt.y - R_DOT - 2);
      }
    });

    // Classifica corrente
    const posEl = document.getElementById('RACE_POS');
    if (posEl && prog > 0.25) {
      const g = Math.min(currentGiro, gpg.length-1);
      const rankNow = gpg[g];
      posEl.innerHTML = rankNow.map((n,i) => {
        const isP = n === playerName;
        const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'°';
        return `<div class="race-pos-row">
          <span style="width:28px;font-weight:700;color:${i===0?'var(--gold)':'rgba(201,168,76,.5)'}">${medal}</span>
          <canvas width="14" height="14" id="POS_${n.replace(/[^a-z]/gi,'_')}"></canvas>
          <span style="color:${isP?'var(--gold)':'var(--parch)'};font-weight:${isP?700:400}">${n}</span>
          ${isP?'<span class="bdg o" style="margin-left:auto">tu</span>':''}
        </div>`;
      }).join('');
      rankNow.forEach(n => {
        const pc = document.getElementById('POS_'+n.replace(/[^a-z]/gi,'_'));
        if (pc) { const pctx = pc.getContext('2d'); drawContradaDot(pctx, 7, 7, 6, n); }
      });
    }

    if (prog < 1) {
      _raceAnimFrame = requestAnimationFrame(renderFrame);
    } else {
      currentGiro++;
      const lapEl = document.getElementById('RACE_LAP');
      if (lapEl) lapEl.textContent = currentGiro < giriTotali ? `Giro ${currentGiro+1} / ${giriTotali}` : `🏁 Gara conclusa!`;
      if (currentGiro < giriTotali) {
        setTargetsForGiro(currentGiro);
        startTime = null;
        _raceAnimFrame = requestAnimationFrame(renderFrame);
      } else {
        const nextEl = document.getElementById('RACE_NEXT');
        if (nextEl) nextEl.style.display = 'block';
        const btn = document.getElementById('RACE_BTN');
        if (btn && onComplete) btn.onclick = onComplete;
      }
    }
  }

  _raceAnimFrame = requestAnimationFrame(renderFrame);
}

function modPrestigio(delta,motivo){
  if(!G)return;
  G.prestigio=Math.max(0,Math.min(100,(G.prestigio||20)+delta));
  if(delta!==0)addLog('Prestigio '+(delta>0?'+':'')+delta+' ('+motivo+') → '+G.prestigio,'inf');
}

function checkObiettivi(tipo){
  if(!G)return;
  if(!G.obiettivi)G.obiettivi={ceneAnno:0,eventiAnno:0,completati:{}};
  const ob=G.obiettivi;
  if(!ob.completati)ob.completati={};
  const done=ob.completati;
  if(tipo==='cena_maniero'&&!done.cene_anno){
    ob.ceneAnno=(ob.ceneAnno||0)+1;
    if(ob.ceneAnno>=5){done.cene_anno=true;modPrestigio(5,'Obiettivo: cene tutto l\'anno');showToast('🎯 Obiettivo: cene tutto l\'anno! +5 Prestigio','grn');}
  }
  if(tipo==='evento_maniero'&&!done.eventi_anno){
    ob.eventiAnno=(ob.eventiAnno||0)+1;
    if(ob.eventiAnno>=5){done.eventi_anno=true;modPrestigio(5,'Obiettivo: eventi tutto l\'anno');showToast('🎯 Obiettivo: eventi tutto l\'anno! +5 Prestigio','grn');}
  }
  if(tipo==='cond_maniero_100'&&!done.cond_maniero_100){
    done.cond_maniero_100=true;modPrestigio(5,'Obiettivo: maniero a 100');showToast('🎯 Obiettivo: Maniero a 100! +5 Prestigio','grn');
  }
  if(tipo==='amicizia_100'&&!done.amica_contrada){
    done.amica_contrada=true;modPrestigio(5,'Obiettivo: amica di contrada');showToast('🎯 Obiettivo: amica di contrada! +5 Prestigio','grn');
  }
  if(tipo==='morale_200'&&!done.massimo_morale){
    done.massimo_morale=true;modPrestigio(5,'Obiettivo: massimo morale');showToast('🎯 Obiettivo: massimo morale! +5 Prestigio','grn');
  }
  if(tipo==='nemica_non_vince'&&!done.impedisci_nemica){
    done.impedisci_nemica=true;modPrestigio(5,'Obiettivo: nemica fermata');showToast('🎯 Obiettivo: nemica fermata! +5 Prestigio','grn');
  }
  if(tipo==='vinto_palio'){
    if(G.anno===2027&&!done.vinci_primo_anno){
      done.vinci_primo_anno=true;modPrestigio(5,'Obiettivo: vinto al primo anno');showToast('🎯 Vinto al primo anno! +5 Prestigio','grn');
    }
    ob.consecutivi=(ob.consecutivi||0)+1;
    if(ob.consecutivi>=2&&!done.consecutivi_2){done.consecutivi_2=true;modPrestigio(5,'2 vittorie consecutive');showToast('🎯 2 vittorie consecutive! +5 Prestigio','grn');}
    if(ob.consecutivi>=3&&!done.consecutivi_3){done.consecutivi_3=true;modPrestigio(5,'3 vittorie consecutive');showToast('🎯 3 vittorie consecutive! +5 Prestigio','grn');}
    if(ob.consecutivi>=4&&!done.consecutivi_4){done.consecutivi_4=true;modPrestigio(5,'4 vittorie consecutive');showToast('🎯 4 vittorie consecutive! +5 Prestigio','grn');}
  }
  if(tipo==='mese_senza_vittoria'&&ob.consecutivi){ob.consecutivi=0;}
  G.obiettivi=ob;salva();
}

    testo=`La contrada di <strong>${ct}</strong> è accusata di aver fatto uno scherzo ai danni di una rivale. I contradaioli negano tutto, ma la città mormora.`;

    testo=`Si vocifera che <strong>${ct}</strong> abbia portato in stalla un cavallo di straordinarie qualità. I bookmaker li quotano favoriti per il Palio.`;
  } else if(r<0.60){
    const ct=rndArr(contrade);
    titolo='👑 Il Favorito';
    testo=`I contradaioli sussurrano: il favorito per questa edizione del Palio sembra essere <strong>${ct}</strong>. Ma il Palio potrebbe riservare sempre sorprese.`;
  } else if(r<0.75){
    const ct=rndArr(contrade);

    testo=`Si vocifera di un accordo nell'ombra. <strong>${ct}</strong> e un'altra contrada sembrano aver stretto un patto segreto. Le alleanze cambiano le sorti del Palio.`;
  } else {
    const ct=rndArr(contrade);

    testo=`Le rivalità si infiammano. <strong>${ct}</strong> ha rafforzato la propria stalla e si dice voglia il crocione ad ogni costo.`;

}

function mostraGazzetta(onClose){
  if(!G)return;
  // Se c'è stato un evento casuale questo mese, mostralo nella Gazzetta
  const eventoMese=G._eventoMese;
  let titolo, testo;
  if(eventoMese){
    // Converti il msg dell'evento in formato Gazzetta
    const m=eventoMese.msg;
    if(m.includes('Scherzo da parte di')||m.includes('Scherzo nemico')){
      titolo='⚠ Mossa Sleale!';
      testo=`La contrada di <strong>${G.nemica}</strong> ha ordito uno scherzo contro di noi. I contradaioli sono in fermento e il morale ne ha risentito. Vendetta sarà a maggio?`;

      titolo='🗡️ Imboscata Notturna!';
      testo=`Nella notte, qualcuno ha turbato i nostri destrieri nella stalla. Il nervosismo dei cavalli è aumentato. Si sospetta la mano della contrada nemica!`;
    } else if(m.includes('ex contradaiolo')||m.includes('800 oro')){
      titolo='💰 Dono Inatteso!';
      testo=`Un generoso ex contradaiolo ha inviato <strong>800 oro</strong> nelle casse della contrada! Un gesto di fedeltà e amore verso i nostri colori che scalda il cuore.`;

      testo=`Tragedia per la nostra contrada: <strong>il maniero è crollato</strong>! Le condizioni sono ridotte a zero. Servirà una costosa opera di manutenzione per ripristinarlo.`;

  }
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px';
  const mese=MESI[Math.min(G.mi,4)]||'—';
  overlay.innerHTML=`
    <div style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:16px;padding:20px;max-width:340px;width:100%;position:relative;box-shadow:0 0 40px rgba(201,168,76,.2)">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:30px">📰</div>
        <div style="font-family:var(--fn);font-size:18px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-top:4px">Gazzetta del Palio</div>
        <div style="font-size:10px;color:rgba(201,168,76,.5);text-transform:uppercase;letter-spacing:2px;margin-top:2px">${mese} ${G.anno}</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-bottom:14px"></div>
      <div style="font-family:var(--fn);font-size:15px;font-weight:700;color:${eventoMese?'#E05555':'var(--gold-l)'};margin-bottom:8px">${titolo}</div>
      <div style="font-size:13px;color:var(--parch2);line-height:1.7">${testo}</div>
      <button id="GAZZETTA_BTN" class="btn gold w" style="margin-top:16px">Ho letto →</button>
    </div>`;
  document.getElementById('APP').appendChild(overlay);
  document.getElementById('GAZZETTA_BTN').onclick=()=>{overlay.remove();onClose&&onClose();};
}

// ── ACCORDI E STRATEGIE DI GARA (CAPITANO) ──
function showAccordiEStrategieCap(fase, onContinue){
  if(!G)return;
  const batt=fase==='batteria'?(G._bP||[]):[...((G._qP)||[]),...((G._qIA)||[])];
  const altriInBatt=batt.filter(n=>n!==G.nome);
  const hasNemica=altriInBatt.includes(G.nemica);
  G._strategia=null;
  const bonusprest=Math.min(20,Math.floor((G.prestigio||20)/5));

  let html=`<div style="text-align:center;margin-bottom:14px">
    <div style="font-size:28px">🤝</div>
    <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Accordi e Strategie di Gara</div>
    <div style="font-size:12px;color:rgba(201,168,76,.5);margin-top:4px">${fase==='finale'?'Finale':'Batteria'} — Prima del canapo</div>
    <div style="font-size:11px;color:rgba(201,168,76,.4);margin-top:2px">Prestigio: ⭐${G.prestigio||20} — bonus accettazione Patti +${bonusprest}%</div>
  </div>
  <div class="card">
    <div class="ct">Composizione batteria</div>`;
  batt.forEach(n=>{
    const ami=n===G.nome?100:(G.amicizia[n]||0);
    const col=n===G.nome?'var(--gold)':ami>=70?'#5DBB63':ami>=40?'var(--gold)':'#E05555';
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(201,168,76,.08)">
      <div style="font-family:var(--fn);font-size:13px;font-weight:${n===G.nome?'700':'400'};color:${n===G.nome?'var(--gold)':'var(--parch)'}">
        ${n===G.nome?'▶ '+n+' (tu)':n}${n===G.nemica?' <span class="bdg r">nemica</span>':''}
      </div>
      ${n!==G.nome?`<span style="font-size:12px;font-weight:700;color:${col}">${ami}/100</span>`:''}
    </div>`;
  });
  html+=`</div>
  <div class="card">
    <div class="ct">Scegli la strategia</div>
    <div style="font-size:11px;color:rgba(201,168,76,.4);margin-bottom:8px;font-family:var(--fn)">Puoi scegliere una sola strategia</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn w stratg-btn" onclick="scegliStrategiaCap('tenuta',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:var(--gold-l)">🛡️ Tenersi per l'ultimo giro</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Velocità −1 · Resistenza +2</div>
      </button>`;
  if(hasNemica){
    html+=`<button class="btn w stratg-btn" onclick="scegliStrategiaCap('contro_nemica',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#E05555">⚔️ Contro la nemica</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Né tu né ${G.nemica} vincete questa corsa</div>
      </button>`;
  }
  html+=`<button class="btn w stratg-btn" onclick="scegliStrategiaCap('morte',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#E05555">⚡ Alla morte</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Velocità +2 · Resistenza −1</div>
      </button>`;
  altriInBatt.forEach(n=>{
    const ami=G.amicizia[n]||0;
    const prob=Math.min(95,ami+bonusprest);
    html+=`<button class="btn w stratg-btn" onclick="scegliStrategiaCap('patti','${n}','${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#7BC8FF">🤝 Patti con ${n}</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">−300 oro · ${prob}% probabilità accettazione</div>
      </button>`;
  });
  html+=`</div></div>`;
  setMain('<div class="pad">'+html+'</div>');
  // Salva callback per dopo
  window._strOnContinue=onContinue;
}

function scegliStrategiaCap(tipo,bersaglio,fase){
  if(!G)return;
  // Disabilita tutti i bottoni strategia per impedire scelte multiple
  document.querySelectorAll('.stratg-btn').forEach(b=>{b.disabled=true;b.style.opacity='.35';b.style.pointerEvents='none';});
  const bonusprest=Math.min(20,Math.floor((G.prestigio||20)/5));
  // Probabilità ubbidienza fantino: base 50%, +5 per ogni punto bravura, +bonus prestigio
  const probUbbidienza=Math.min(95,50+(G.fan?G.fan.bravura*5:0)+bonusprest*2);
  const fantUbbidisce=Math.random()*100<probUbbidienza;
  let msg='',colore='grn';
  if(!fantUbbidisce){
    msg=`⚠️ Il fantino <strong>${G.fan?G.fan.nome:'—'}</strong> ha ignorato i tuoi ordini! Correrà a suo modo.`;
    G._strategia={tipo:'normale',bersaglio:null};colore='red';
  } else if(tipo==='tenuta'){
    msg=`✦ Il fantino eseguirà "Tenersi per l'ultimo giro". Velocità −1, Resistenza +2.`;
    G._strategia={tipo:'tenuta',bersaglio:null};
  } else if(tipo==='contro_nemica'){
    msg=`⚔️ Il fantino punterà contro ${G.nemica}. Né tu né la nemica vincerete.`;
    G._strategia={tipo:'contro_nemica',bersaglio:G.nemica};
  } else if(tipo==='morte'){
    msg=`⚡ Il fantino correrà "Alla morte"! Velocità +2, Resistenza −1.`;
    G._strategia={tipo:'morte',bersaglio:null};
  } else if(tipo==='patti'){
    const ami=G.amicizia[bersaglio]||0;
    const prob=Math.min(95,ami+bonusprest);
    if(G.oro<300){
      // Riabilita i bottoni se non abbastanza oro
      document.querySelectorAll('.stratg-btn').forEach(b=>{b.disabled=false;b.style.opacity='';b.style.pointerEvents='';});
      R('STRATG_ESITO').innerHTML=`<div class="evbox red">Non hai 300 oro per i Patti!</div>`;return;
    }
    G.oro-=300;updHUD();
    const acc=Math.random()*100<prob;
    if(acc){
      msg=`🤝 <strong>${bersaglio}</strong> ha accettato i Patti! Ti lascerà passare (−300 oro).`;
      G._strategia={tipo:'patti',bersaglio};
    } else {
      msg=`✗ <strong>${bersaglio}</strong> ha rifiutato i Patti. −300 oro sprecati.`;
      G._strategia={tipo:'normale',bersaglio:null};colore='red';
    }
  }
  const tracciato=fantUbbidisce?'Il fantino eseguirà gli ordini.':'Il fantino ha tradito la fiducia del Capitano.';
  addLog('Strategia: '+tipo+(bersaglio?' vs '+bersaglio:'')+(fantUbbidisce?' (eseguita)':' (tradimento)'),'inf');
  salva();
  // Mostra risultato come popup stile Gazzetta del Palio
  mostraEsitoStrategia(msg,colore,tracciato,fantUbbidisce);
}

function mostraEsitoStrategia(msg,colore,tracciato,fantUbbidisce){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px';
  const iconaFant=fantUbbidisce?'🐎':'🗡️';
  const titoloFant=fantUbbidisce?'Il Fantino Ubbidisce':'Il Fantino Tradisce!';
  const colBorder=colore==='red'?'#E05555':'#5DBB63';
  const colTitolo=colore==='red'?'#E05555':'#5DBB63';
  overlay.innerHTML=`
    <div style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:16px;padding:20px;max-width:340px;width:100%;position:relative;box-shadow:0 0 40px rgba(201,168,76,.2)">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:30px">📰</div>
        <div style="font-family:var(--fn);font-size:18px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-top:4px">Gazzetta del Palio</div>
        <div style="font-size:10px;color:rgba(201,168,76,.5);text-transform:uppercase;letter-spacing:2px;margin-top:2px">Prima del Canapo — Anno ${G.anno}</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-bottom:14px"></div>
      <div style="text-align:center;font-size:32px;margin-bottom:8px">${iconaFant}</div>
      <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:${colTitolo};margin-bottom:10px;text-align:center">${titoloFant}</div>
      <div style="padding:12px;background:rgba(0,0,0,.2);border-radius:10px;border-left:3px solid ${colBorder};margin-bottom:12px">
        <div style="font-size:13px;color:var(--parch2);line-height:1.7">${msg}</div>
        <div style="font-size:11px;color:rgba(201,168,76,.45);margin-top:6px;font-style:italic">${tracciato}</div>
      </div>
      <button id="ESITO_STRAT_BTN" class="btn gold w" style="margin-top:4px">⚔ Il canapo è tirato! →</button>
    </div>`;
  document.getElementById('APP').appendChild(overlay);
  document.getElementById('ESITO_STRAT_BTN').onclick=()=>{
    overlay.remove();
    if(window._strOnContinue)window._strOnContinue();
  };
}

function ripristinaStrategiaCap(){
  if(!G)return;
  // Ripristina le modifiche temporanee al cavallo applicate dalla strategia
  if(G._strategia){
    if(G._strategia.tipo==='tenuta'&&G.cav){
      G.cav.vel=Math.min(5,G.cav.vel+1);
      G.cav.res=Math.max(1,G.cav.res-2);
    } else if(G._strategia.tipo==='morte'&&G.cav){
      G.cav.vel=Math.max(1,G.cav.vel-2);
      G.cav.res=Math.min(5,G.cav.res+1);
    }
  }
  G._strategia=null;
}

renderIntro();
