// Crea la carriera fantino vera e propria, condivisa tra "crea il tuo fantino" e "controlla fantino reale".
// opts: {nome, contrada, slot, statsIniziali:{bravura,esp,mossa,emp}, escludiDaRivali:nomeFantinoReale}
function fFinalizzaCreazione(opts){
  const {nome,contrada,slot,statsIniziali,escludiDaRivali}=opts;
  const db=CDB[contrada];
  // Genera fantini rivali: 2 assegnati alla contrada del giocatore (il giocatore + 1 assegnato dal gioco),
  // 1 per ognuna delle altre 7 contrade, i rimanenti svincolati
  const rivali={};
  const altreContradeInit=Object.keys(CDB).filter(k=>k!==contrada);
  const shuffContrade=[...altreContradeInit].sort(()=>Math.random()-.5);
  // Se il giocatore controlla un fantino reale, quel nome viene escluso dal pool dei rivali:
  // non esiste più come avversario né come potenziale amico/compagno.
  const poolNomi=escludiDaRivali?NOMI_FANTINI_RIVALI.filter(n=>n!==escludiDaRivali):NOMI_FANTINI_RIVALI;
  const shuffNomi=[...poolNomi].sort(()=>Math.random()-.5);
  // Prima assegna 1 fantino per ognuna delle 7 altre contrade
  shuffNomi.forEach((n,i)=>{
    const dbStats=FANTINI_MAP[n]||{bravura:rnd(2,4),esp:rnd(2,4),mossa:rnd(2,4),emp:rnd(2,4)};
    // i=0..6 → assegnato alle 7 altre contrade; i=7 → assegnato alla propria contrada (compagno); i>7 → svincolato
    let ct=null;
    if(i<shuffContrade.length) ct=shuffContrade[i];
    else if(i===shuffContrade.length) ct=contrada; // compagno nella stessa contrada
    rivali[n]={contrada:ct,amicizia:rnd(30,70),
      bravura:dbStats.bravura,esp:dbStats.esp,mossa:dbStats.mossa,emp:dbStats.emp};
  });
  // Salva il nome del compagno di contrada (il fantino assegnato alla stessa contrada del giocatore)
  const compagnoEntry=Object.entries(rivali).find(([,info])=>info.contrada===contrada);
  const nomeCompagno=compagnoEntry?compagnoEntry[0]:null;
  // Intesa con capitani di ogni contrada
  const intesaCapitani={};
  Object.keys(CDB).forEach(k=>{intesaCapitani[k]=k===contrada?60:rnd(20,50);});

  const stats=statsIniziali||{bravura:1,esp:1,mossa:1,emp:1};

  F={
    nome,contrada,nemica:db.nemica,slot,
    oro:0,mi:0,anno:2027,
    bravura:stats.bravura,esperienza:stats.esp,mossa:stats.mossa,empatia:stats.emp,
    sostegno:50,intesa:60,
    reputazione:10,
    rivali,intesaCapitani,
    stallaContrada:[],stallaPersonale:[],
    cavScelta:null,
    amiciziaMensile:0,
    addestramentoUsato:false,
    corsaUsata:false,
    allenamentoContrataUsato:false,
    veterinario:false,
    imprevistaUsato:false,
    log:[],
    premi:[],
    mktF:null,
    obiettiviFantino:{completati:{}},
    nomeCompagno,  // fantino assegnato dal gioco nella stessa contrada
    ultimaVittoriaContrada:{}  // aggiornato quando una contrada vince il Palio
  };
  F.mktF=fGenMkt();
  fSalva();
  // Mostra schermata giubba prima della UI
  mostraSchermatGiubba(contrada, ()=>fAvviaUI());
}

function selFntRealeCt(k){

function creaFantinoReale(contrada){
  const db=FANTINI_DB;
  if(!db||!db.length)return;
  const f=db[_fntRealeIdx];
  if(!f)return;
  const slot=(R('FNT_REALE_CARD')&&R('FNT_REALE_CARD')._slot)||1;
  fFinalizzaCreazione({
    nome:f.nome,contrada,slot,
    statsIniziali:{bravura:f.bravura,esp:f.esp,mossa:f.mossa,emp:f.emp},
    escludiDaRivali:f.nome
  });
}

function fGenMkt(){
  // Raccoglie tutti i nomi già in uso: stalla contrada, stalla personale e mercato attuale
  const nomiUsati=new Set([
    ...(F&&F.stallaContrada||[]).map(c=>c.nome),
    ...(F&&F.stallaPersonale||[]).map(c=>c.nome),
    ...(F&&F.mktF&&F.mktF.cavalli||[]).map(c=>c.nome)
  ]);
  const disponibili=NC.filter(n=>!nomiUsati.has(n));
  const selezionati=sample(disponibili,Math.min(5,disponibili.length));
  return {cavalli:selezionati.map(n=>newCav(n))};
}

function fAddLog(msg,tipo){
  if(!F)return;
  F.log.unshift({msg,tipo,mese:MESI[Math.min(F.mi,4)]||'—'});

}

function fCalcEmpatia(){

function fPipsGrn(val,max){let h='<div class="fpip-row">';for(let i=0;i<max;i++)h+=`<div class="fpip${i<val?' grn':''}"></div>`;return h+'</div>';}

function fCavCardHeader(c,isContrada){

function fApplicaStanchezzaEffetti(c){
  // stanchezza 2 → -1 res temporanea (salvata come penalità separata)
  // stanchezza 3 → non può correre
  c._penRes= c.stanchezza>=2 ? 1 : 0;
}
function fApplicaIntesaEffetti(c){
  // intesa 2 → +1 ten; intesa 3 → +1 ten, -1 ner
  c._bonTen = c.intesaFant>=2 ? 1 : 0;
  c._bonNer = c.intesaFant>=3 ? 1 : 0;
}
function fStatCorsaEffettiva(c){
  // restituisce stats effettive per la corsa tenendo conto di bonus/penalità temporanei
  fApplicaStanchezzaEffetti(c);fApplicaIntesaEffetti(c);
  return {
    vel:c.vel, acc:c.acc,
    ten:c.ten+(c._bonTen||0),
    res:Math.max(1,c.res-(c._penRes||0)),
    ner:Math.max(1,c.ner-(c._bonNer||0))
  };
}

function fSyncIntesa(){
  // F.intesa e F.intesaCapitani[F.contrada] devono coincidere
  if(!F.intesaCapitani)F.intesaCapitani={};
  F.intesaCapitani[F.contrada]=F.intesa;
}
function fSyncEmpatia(){F.empatia=fCalcEmpatia();fSyncIntesa();}

function modReputazione(delta,motivo){
  if(!F)return;
  const prev=F.reputazione||10;
  F.reputazione=clamp(prev+delta,0,100);
  if(delta!==0)fAddLog('Reputazione '+(delta>0?'+':'')+delta+' ('+motivo+') → '+F.reputazione,'inf');
}

function fApplicaColoriContradaFantino(){
  if(!F||!F.contrada)return;
  // Mappa contrada → chiave CONTRADA_COLORI
  const chiaveMap={
    'SanMartino':'SanMartino','San Martino':'SanMartino',
    'SanDomenico':'SanDomenico','San Domenico':'SanDomenico',
    'SanMagno':'SanMagno','San Magno':'SanMagno',

    'Flora':'Flora',
    'SantErasmo':'SantErasmo',"Sant'Erasmo":'SantErasmo',
    'SanBernardino':'SanBernardino','San Bernardino':'SanBernardino',
    'Legnarello':'Legnarello'
  };
  const chiave=chiaveMap[F.contrada]||F.contrada.replace(/\s+/g,'').replace("'","");
  const col=CONTRADA_COLORI[chiave];
  if(!col)return;
  const app=R('APP');
  if(!app)return;
  const c1=col.c1,c2=col.c2,c3=col.c3||null;
  let grad;
  if(c3){
    grad=`repeating-linear-gradient(135deg,${c1} 0px,${c1} 18px,${c2} 18px,${c2} 36px,${c3} 36px,${c3} 54px)`;
  } else {
    grad=`repeating-linear-gradient(135deg,${c1} 0px,${c1} 24px,${c2} 24px,${c2} 48px)`;
  }
  app.style.background=`linear-gradient(rgba(15,10,5,.82),rgba(15,10,5,.82)),${grad}`;
  document.body.style.background='#0D0806';
}

  R('NAV').style.display='flex';
  fApplicaColoriContradaFantino();
  fSyncIntesa();
  // Rebuild nav for fantino
  R('NAV').innerHTML=`
    <button class="nb on" onclick="fGoTo('mese')"><span class="nbi">📅</span>Mese</button>
    <button class="nb" onclick="fGoTo('stalla')"><span class="nbi">🐎</span>Stalla</button>
    <button class="nb" onclick="fGoTo('mercato')"><span class="nbi">🛒</span>Mercato</button>
    <button class="nb" onclick="fGoTo('politica')"><span class="nbi">⚔️</span>Politica</button>
    <button class="nb" onclick="fGoTo('contrade')"><span class="nbi">🏰</span>Contrade</button>
    <button class="nb" onclick="fGoTo('premi')"><span class="nbi">🏆</span>Premi</button>`;

}

function fBuildDOM(){
  R('MAIN').innerHTML=`<div class="pad">
    <div class="sc on" id="sc-fmese"></div>
    <div class="sc" id="sc-fstalla"></div>
    <div class="sc" id="sc-fmercato"></div>
    <div class="sc" id="sc-fpolitica"></div>
    <div class="sc" id="sc-fcontrade"></div>
    <div class="sc" id="sc-fpremi"></div>
  </div>`;
}

function fGoTo(id){
  document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const ids=['mese','stalla','mercato','politica','contrade','premi'];
  const el=R('sc-f'+id);if(el)el.classList.add('on');
  document.querySelectorAll('.nb')[ids.indexOf(id)].classList.add('on');
  R('MAIN').scrollTop=0;
  if(id==='mese')fRenderMese();
  if(id==='stalla')fRenderStalla();
  if(id==='mercato')fRenderMercato();
  if(id==='politica')fRenderPolitica();
  if(id==='contrade')fRenderContrade();
  if(id==='premi')fRenderPremi();
}

function fShowEv(msg,tipo){

function fAvanzaMese(){
  if(!F)return;
  if(F.mi===4){fShowSceltaCapitano();return;}
  F.mi++;
  F.oro+=(F._stipendioBase||100);
  F.addestramentoContrataUsato=false;
  F.corsaUsata=false;
  F.amiciziaMensile=0;
  F.imprevistaUsato=false;
  F._imprevistoPista=false;
  F._eventoMeseFantino=null;
  [...F.stallaContrada,...F.stallaPersonale].forEach(cv=>{cv._infortunato=false;});
  // Ricalcola il prezzo di vendita dei cavalli della scuderia personale ogni mese
  F.stallaPersonale.forEach(c=>{c.valoreVendita=calcPrezzoVendita(c);});
  if(!F.mktF||F.mi%1===0)F.mktF=fGenMkt();
  // Veterinario: -1 stanchezza a tutti i cavalli
  if(F.veterinario){
    [...F.stallaContrada,...F.stallaPersonale].forEach(cv=>{cv.stanchezza=Math.max(0,(cv.stanchezza||0)-1);});
    fAddLog('Veterinario: stanchezza −1 a tutti i cavalli','grn');
  }
  // Fine anno: veterinario abbandona
  fSyncEmpatia();
  fAddLog('Mese '+F.mi+'. +'+(F._stipendioBase||100)+' oro stipendio.','inf');
  // Imprevisti (30%, max 1 al mese) — estratto prima della Gazzetta
  if(!F.imprevistaUsato&&Math.random()<0.3){fEstraiImprevisto();}
  // Bonus mensile sostegno da reputazione
  const repF=F.reputazione||0;
  if(repF>=80){F.sostegno=clamp(F.sostegno+10,0,100);fAddLog('Reputazione alta ('+repF+'): Sostegno +10','grn');}
  else if(repF>=60){F.sostegno=clamp(F.sostegno+5,0,100);fAddLog('Buona reputazione ('+repF+'): Sostegno +5','grn');}
  fSalva();
  // Mostra Gazzetta del Palio prima del mese
  fMostraGazzettaFantino(()=>{fGoTo('mese');});
}


// ── GAZZETTA DEL PALIO — CARRIERA FANTINO ──
function fNotiziaMesePalioFantino(){
  if(!F)return null;
  const r=Math.random();
  const contrade=Object.keys(CDB).filter(k=>k!==F.contrada);
  const rndArr=arr=>arr[Math.floor(Math.random()*arr.length)];
  let titolo,testo;
  if(r<0.20){
    const ct=rndArr(contrade);
    titolo='🐎 Destriero di Razza!';
    testo=`Si vocifera che <strong>${ct}</strong> abbia portato in stalla un cavallo di straordinarie qualità. I bookmaker li considerano già favoriti per il Palio.`;
  } else if(r<0.40){
    const ct=rndArr(contrade);
    titolo='⚠️ Tensione tra le Contrade!';
    testo=`Le rivalità si infiammano. <strong>${ct}</strong> ha rafforzato la propria stalla e si dice voglia il crocione ad ogni costo. Tieni gli occhi aperti.`;
  } else if(r<0.55){
    const ct=rndArr(contrade);
    titolo="🤝 Accordi nell'Ombra";
    testo=`Si vocifera di un patto segreto tra <strong>${ct}</strong> e un'altra contrada. Le alleanze cambiano le sorti del Palio — e anche della Provaccia.`;
  } else if(r<0.70){
    titolo='💪 La Città ti Osserva!';
    testo=`I contradaioli di <strong>${F.contrada}</strong> ti guardano con aspettativa. I tuoi allenamenti in pista non passano inosservati. Dimostra il tuo valore.`;
  } else if(r<0.85){
    const ct=rndArr(contrade);
    titolo='👑 Il Favorito del Momento';
    testo=`Le bocche di piazza sussurrano: il favorito per questa edizione sembra essere <strong>${ct}</strong>. Ma il Palio riserva sempre sorprese — e tu potresti essere una.`;
  } else {
    titolo='📜 Notizie dalla Piazza';
    testo=`Le strade di Legnano fremono di attività. La stagione del Palio entra nel vivo e ogni fantino è osservato. Preparati al meglio per fare la tua parte.`;
  }
  return {titolo,testo};
}

function fMostraGazzettaFantino(onClose){
  if(!F)return onClose&&onClose();
  const eventoMese=F._eventoMeseFantino;
  let titolo,testo,isEvento=false;
  if(eventoMese){
    isEvento=true;
    const m=eventoMese.msg;
    if(m.includes('ha dormito bene')){
      titolo='😴 Notte di Riposo!';
      const nomeCav=(m.match(/Il cavallo (.+?) ha dormito/)||[])[1]||'il cavallo';
      testo=`Buone notizie dalla stalla: <strong>${nomeCav}</strong> ha dormito profondamente e si è svegliato in forma smagliante. La sua stanchezza è diminuita. Un bel segno in vista delle corse.`;
    } else if(m.includes('Pista impraticabile')){
      titolo='🌧️ Pista Impraticabile!';
      testo=`Le piogge di questi giorni hanno reso il terreno del Palio completamente impraticabile. <strong>Nessuna corsa di addestramento sarà possibile questo mese.</strong> Usa il tempo per allenare la mente e consolidare le relazioni.`;
    } else if(m.includes('infortunato')){
      const nomeCav=(m.match(/🤕 (.+?) è infortunato/)||m.match(/([A-Z][a-z]+(?: [A-Z][a-z]+)*) è infortunato/)||[])[1]||'un cavallo';
      titolo='🤕 Cavallo Infortunato!';
      testo=`Brutta notizia dalla stalla: <strong>${nomeCav}</strong> si è infortunato durante un allenamento. Non potrà correre questo mese. Scegliete con cura gli altri destrieri.`;
    } else if(m.includes('grande amico')){
      const nomeFant=(m.match(/grande amico di (.+?)!/)||[])[1]||'un rivale';
      titolo='🤝 Nuova Amicizia!';
      testo=`Una serata in compagnia ha fatto miracoli: <strong>${nomeFant}</strong> e tu avete trovato un'intesa straordinaria. L'amicizia tra fantini cambia gli equilibri in pista.`;
    } else if(m.includes('Patto col diavolo')){
      const nemCap=(m.match(/capitano di (.+?) → 100/)||[])[1]||'una contrada';
      titolo='😈 Patto Col Diavolo!';
      testo=`In un momento di debolezza hai stretto un accordo oscuro. La tua intesa col capitano di <strong>${nemCap}</strong> è alle stelle, ma il prezzo è alto: <strong>la tua gestione della mossa è compromessa.</strong> Valuta attentamente le prossime mosse.`;
    } else if(m.includes('Multa')){
      const importo=(m.match(/pagato (\d+) oro/)||[])[1]||'oro';
      titolo='💸 Multa Salata!';
      testo=`Le autorità del Palio ti hanno comminato una <strong>multa di ${importo} oro</strong>. Non si sa bene per quale infrazione, ma le tasche ne risentono. Fai più attenzione in futuro.`;
    } else if(m.includes('Beccato con gli avversari')){
      titolo='🍽️ Tradimento a Tavola!';
      testo=`Qualcuno ti ha visto a cena con dei contradaioli rivali. <strong>I tuoi contradaioli si sentono traditi.</strong> Il tuo sostegno nella contrada è crollato di 50 punti. Dovrai lavorare duro per riconquistare la loro fiducia.`;
    } else if(m.includes('Che peccato')){
      titolo='😱 Scandalo in Città!';
      testo=`Le voci corrono veloci tra i vicoli di Legnano: <strong>ti hanno scoperto a svolgere pratiche illegali.</strong> La tua reputazione ha subito un duro colpo — 50 punti in meno. La città osserva e giudica.`;
    } else {
      titolo='📢 Notizia dal Mese';
      testo=m;
    }
  } else {
    const notizia=fNotiziaMesePalioFantino();
    if(!notizia){onClose&&onClose();return;}
    titolo=notizia.titolo;testo=notizia.testo;
  }
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px';
  const mese=MESI[Math.min(F.mi,4)]||'—';
  overlay.innerHTML=`
    <div style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:16px;padding:20px;max-width:340px;width:100%;position:relative;box-shadow:0 0 40px rgba(201,168,76,.2)">
      <div style="text-align:center;margin-bottom:12px">
        <div style="font-size:30px">📰</div>
        <div style="font-family:var(--fn);font-size:18px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-top:4px">Gazzetta del Palio</div>
        <div style="font-size:10px;color:rgba(201,168,76,.5);text-transform:uppercase;letter-spacing:2px;margin-top:2px">${mese} ${F.anno} · Fantino</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-bottom:14px"></div>
      <div style="font-family:var(--fn);font-size:15px;font-weight:700;color:${isEvento?'#E05555':'var(--gold-l)'};margin-bottom:8px">${titolo}</div>
      <div style="font-size:13px;color:var(--parch2);line-height:1.7">${testo}</div>
      <button id="FGAZZETTA_BTN" class="btn gold w" style="margin-top:16px">Ho letto →</button>
    </div>`;
  document.getElementById('APP').appendChild(overlay);
  document.getElementById('FGAZZETTA_BTN').onclick=()=>{overlay.remove();onClose&&onClose();};
}

function fRichiediAumento(){
  const media=(F.bravura+F.esperienza+F.mossa+F.empatia)/4;
  const nuovoStipendio=Math.floor(media*100);
  F.intesa=clamp(F.intesa-5,0,100);
  F.sostegno=clamp(F.sostegno-10,0,100);
  fSyncEmpatia();
  fAddLog('Richiesto aumento stipendio. Nuovo stipendio mensile: '+nuovoStipendio+' oro','inf');
  F._stipendioBase=nuovoStipendio;
  const el=R('FDIALOG_ESITO');
  if(el) el.innerHTML=`<div class="evbox grn" style="margin-top:10px">
    Il Capitano accetta. Nuovo stipendio mensile: <strong>${nuovoStipendio} oro</strong><br>
    <span style="font-size:11px">Intesa −5 · Sostegno −10</span>
  </div>`;
  fSalva();
}


function fEstraiImprevisto(){
  F.imprevistaUsato=true;
  const tuttoCav=[...F.stallaContrada,...F.stallaPersonale];
  const tipi=['dormito_bene','meteo_pista','infortunato','amici','patto_diavolo','multa','beccato_avversari','che_peccato'];
  const tipo=tipi[rnd(0,tipi.length-1)];
  let msg='';
  if(tipo==='dormito_bene'&&tuttoCav.length){
    const cv=tuttoCav[rnd(0,tuttoCav.length-1)];
    cv.stanchezza=Math.max(0,(cv.stanchezza||0)-1);
    msg='😴 Il cavallo '+cv.nome+' ha dormito bene! Stanchezza −1';
  } else if(tipo==='meteo_pista'){
    F._imprevistoPista=true;
    msg='🌧️ Pista impraticabile! Nessuna corsa di addestramento questo mese.';
  } else if(tipo==='infortunato'&&tuttoCav.length){
    const cv=tuttoCav[rnd(0,tuttoCav.length-1)];
    cv._infortunato=true;
    msg='🤕 '+cv.nome+' è infortunato! Non può correre questo mese.';
  } else if(tipo==='amici'){
    const nomiRiv=Object.keys(F.rivali);
    const scelto=nomiRiv[rnd(0,nomiRiv.length-1)];
    F.rivali[scelto].amicizia=100;
    msg='🤝 Sei diventato grande amico di '+scelto+'! Amicizia → 100';
  } else if(tipo==='patto_diavolo'){
    const nemCap=Object.keys(F.intesaCapitani).find(k=>k===F.nemica)||Object.keys(F.intesaCapitani)[0];
    F.intesaCapitani[nemCap]=100;
    F.mossa=1;
    msg='😈 Patto col diavolo! Intesa col capitano di '+nemCap+' → 100 ma Gestione Mossa → 1.';
  } else if(tipo==='multa'){
    const importoMulta=rnd(500,1000);
    F.oro=Math.max(0,F.oro-importoMulta);
    msg='💸 Multa! Hai pagato '+importoMulta+' oro di multa.';
  } else if(tipo==='beccato_avversari'){
    F.sostegno=clamp((F.sostegno||50)-50,0,100);
    msg='🍽️ Beccato con gli avversari! I contradaioli ti hanno visto a cena con dei contradaioli rivali, si sentono traditi. Sostegno contradaioli −50.';
  } else if(tipo==='che_peccato'){
    F.reputazione=clamp((F.reputazione||10)-50,0,100);
    msg='😱 Che peccato! Ti hanno scoperto svolgere delle pratiche illegali. Reputazione −50.';
  } else return; // nessun effetto se no cavalli
  // Salva l'imprevisto per la Gazzetta del Palio
  F._eventoMeseFantino={msg};
  fAddLog('Imprevisto: '+msg,'red');
}

function fRichiediVeterinario(){
  const haVinto=(F.premi||[]).some(p=>p.contrada===F.contrada);
  const el=R('FDIALOG_ESITO');
  if(!haVinto){

function fAllenaContrada(idx,tipo){
  if(F.addestramentoContrataUsato){showToast('Allenamento contrada già usato!','red');return;}
  const c=F.stallaContrada[idx];if(!c)return;
  if((c.stanchezza||0)>=3){showToast('Cavallo troppo stanco per allenarsi!','red');return;}
  if(tipo==='forza'){c.vel=clamp(c.vel+1,1,5);c.ner=clamp(c.ner+1,1,5);fAddLog('Forza pura su '+c.nome+' (contrada)','inf');}
  else if(tipo==='controllo'){c.acc=clamp(c.acc+1,1,c.maxAcc);c.ner=clamp(c.ner-1,1,5);fAddLog('Controllo su '+c.nome+' (contrada)','inf');}
  else{c.ten=clamp(c.ten+1,1,5);c.res=clamp(c.res+1,1,c.maxRes);fAddLog('Fondo su '+c.nome+' (contrada)','inf');}
  F.addestramentoContrataUsato=true;
  c.stanchezza=Math.min(3,(c.stanchezza||0)+1);
  showToast('✦ Allenamento completato!','grn');
  fSalva();fRenderStalla();
}
function fAllenaPersonale(idx,tipo){
  if(F.oro<300){showToast('Servono 300 oro!','red');return;}
  const c=F.stallaPersonale[idx];if(!c)return;
  if((c.stanchezza||0)>=3){showToast('Cavallo troppo stanco per allenarsi!','red');return;}
  F.oro-=300;
  if(tipo==='forza'){c.vel=clamp(c.vel+1,1,5);c.ner=clamp(c.ner+1,1,5);fAddLog('Forza pura su '+c.nome+' −300 oro','inf');}
  else if(tipo==='controllo'){c.acc=clamp(c.acc+1,1,c.maxAcc);c.ner=clamp(c.ner-1,1,5);fAddLog('Controllo su '+c.nome+' −300 oro','inf');}
  else{c.ten=clamp(c.ten+1,1,5);c.res=clamp(c.res+1,1,c.maxRes);fAddLog('Fondo su '+c.nome+' −300 oro','inf');}
  c.valoreVendita=calcPrezzoVendita(c);
  c.stanchezza=Math.min(3,(c.stanchezza||0)+1);
  showToast('✦ Allenamento completato! −300 oro','grn');
  fSalva();fRenderStalla();
}

function fVendiCavPersonale(idx){
  const c=F.stallaPersonale[idx];if(!c)return;
  const prezzo=c.valoreVendita!==undefined?c.valoreVendita:calcPrezzoVendita(c);
  F.oro+=prezzo;
  fAddLog('Venduto '+c.nome+' per '+prezzo+' oro','inf');
  F.stallaPersonale.splice(idx,1);
  showToast('Venduto '+c.nome+' per '+prezzo+' oro','grn');
  fSalva();fRenderStalla();
}
