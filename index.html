// Genera i 30 contradaioli della contrada del giocatore: 20 maschi, 10 femmine,
// ognuno con amicizia iniziale random tra 10 e 30, nessun badge assegnato, un'età
// random tra 5 e 55 anni e una qualità fittizia (puramente descrittiva)
function nGeneraContradaiolo(nome,sesso){
  return {nome,sesso,amicizia:rnd(10,30),badge:null,eta:rnd(5,55),qualita:sample(QUALITA_CONTRADAIOLI,1)[0],fazione:nEstraiFazioneCasuale()};
}
function nGeneraContradaioli(){
  const list=[];
  NOMI_CONTRADAIOLI_M.forEach(nome=>list.push(nGeneraContradaiolo(nome,'M')));
  NOMI_CONTRADAIOLI_F.forEach(nome=>list.push(nGeneraContradaiolo(nome,'F')));
  return list;
}
// Ogni contradaiolo invecchia di un anno; chi raggiunge 80 anni viene sostituito da un
// nuovo contradaiolo (stesso sesso, per mantenere l'equilibrio 20M/10F), con nuova età
// giovane, nuova qualità e nessun badge (la carica eventualmente ricoperta resta vacante
// finché non viene riassegnata dal rinnovo automatico o da una sostituzione manuale)
function nInvecchiaContradaioli(){
  if(!N||!N.contradaioli)return;
  N.contradaioli.forEach(c=>{
    if(c.eta===undefined)c.eta=rnd(5,55);
    if(!c.qualita)c.qualita=sample(QUALITA_CONTRADAIOLI,1)[0];
    c.eta++;
    if(c.eta>=80){
      const nomiPool=c.sesso==='M'?NOMI_CONTRADAIOLI_M:NOMI_CONTRADAIOLI_F;
      c.nome=sample(nomiPool,1)[0];
      c.eta=rnd(16,30);
      c.qualita=sample(QUALITA_CONTRADAIOLI,1)[0];
      c.amicizia=rnd(10,30);
      c.fazione=nEstraiFazioneCasuale();
      c.badge=null;
      c.mandatoInizio=undefined;
    }
  });
}

// Genera i rapporti iniziali (0-100, random) con le 7 contrade diverse dalla propria,
// usati nella schermata "Contrade" della carriera Vita da Contradaiolo (incluse gli scherzi)
function nInizRapportiContrade(){
  const r={};
  Object.keys(CDB).forEach(k=>{if(k!==N.contrada)r[k]=rnd(0,100);});
  return r;
}

// Assegna (o riassegna) i badge ai contradaioli rispettando i vincoli di sesso e quantità;
// ogni contradaiolo può avere un solo badge o nessuno
function nAssegnaBadges(){
  if(!N||!N.contradaioli)return;
  N.contradaioli.forEach(c=>c.badge=null);
  const usati=new Set();
  Object.entries(BADGE_INFO).forEach(([chiave,info])=>{
    let papabili=N.contradaioli.filter(c=>!usati.has(c.nome)&&(!info.sesso||c.sesso===info.sesso)&&(!info.etaMin||(c.eta||0)>=info.etaMin));
    // Se per età troppo pochi papabili rispettano il minimo (contrada "giovane"), si ripiega
    // sui candidati disponibili senza vincolo d'età pur di non lasciare la carica vacante
    if(papabili.length<info.quanti){
      const fallback=N.contradaioli.filter(c=>!usati.has(c.nome)&&(!info.sesso||c.sesso===info.sesso));
      if(fallback.length>papabili.length)papabili=fallback;
    }
    const scelti=sample(papabili,Math.min(info.quanti,papabili.length));
    scelti.forEach(c=>{c.badge=chiave;c.mandatoInizio=N.anno;usati.add(c.nome);});
  });
  N.badgeUltimoAnno=N.anno;
}

function caricaContradaiolo(slot){
  try{
    const s=localStorage.getItem('palio_contradaiolo_'+slot);
    if(!s){showToast('Slot '+slot+' vuoto!','red');return;}
    N=JSON.parse(s);N.slot=slot;
    if(!N.ultimaVittoriaContrada)N.ultimaVittoriaContrada={};
    if(N.eta===undefined)N.eta=1;
    if(N.etaFine===undefined)N.etaFine=rnd(70,90);
    if(N.mi===undefined)N.mi=0;
    if(!N.status)N.status='Cucciolo di contrada';
    if(!N.statusKey)N.statusKey=nStatusKey();
    if(!N.statoStorico)N.statoStorico={gonfaloniere:false,capitano:false,granPriore:false,addettoStalla:false,addettoCorse:false};
    nAggiornaStatus();
    if(!N.palii)N.palii=[];
    if(!N.contradaioli){N.contradaioli=nGeneraContradaioli();nAssegnaBadges();}
    N.contradaioli.forEach(c=>{
      if(c.eta===undefined)c.eta=rnd(5,55);
      if(!c.qualita)c.qualita=sample(QUALITA_CONTRADAIOLI,1)[0];
      if(!c.fazione)c.fazione=nEstraiFazioneCasuale();
    });
    if(!N.fazionePunti)N.fazionePunti={corsa:0,maniero:0,politica:0};
    if(N.badgeUltimoAnno===undefined)N.badgeUltimoAnno=N.anno;
    if(N.amiciziaMensile===undefined)N.amiciziaMensile=0;
    if(N.reputazione===undefined)N.reputazione=5;
    if(N.budgetContrada===undefined)N.budgetContrada=3000;
    if(N.moraleContrada===undefined)N.moraleContrada=rnd(30,70);
    if(N.condManiero===undefined)N.condManiero=60;
    if(N.manieroSerataMensile===undefined)N.manieroSerataMensile=false;
    if(N.manieroDaiManoMensile===undefined)N.manieroDaiManoMensile=false;
    if(N.manieroOrganizzaCena===undefined)N.manieroOrganizzaCena=false;
    if(N.manieroVenditaGadget===undefined)N.manieroVenditaGadget=false;
    if(N.manieroOrganizzaEvento===undefined)N.manieroOrganizzaEvento=false;
    if(N.manieroManutenzione===undefined)N.manieroManutenzione=false;
    if(N.manieroGiornataAperta===undefined)N.manieroGiornataAperta=false;
    if(N.sostituzioneAnno===undefined)N.sostituzioneAnno=0;
    if(N.pistaImpraticabile===undefined)N.pistaImpraticabile=false;
    if(N.veterinario===undefined)N.veterinario=false;
    nCheckDecadimentoCapitano();
    nAvviaUI();showToast('Contradaiolo caricato — '+N.nome,'grn');
  }catch(e){alert('Errore nel caricamento.');}
}

// Anno dell'ultima vittoria al Palio per contrada, per la carriera Contradaiolo
function nGetUltimaVittoria(k){
  if(N&&N.ultimaVittoriaContrada&&N.ultimaVittoriaContrada[k]!==undefined)
    return N.ultimaVittoriaContrada[k];

// ── SCHERMATA CAVALLI (Vita da Contradaiolo) ──
// Mostra tutti i cavalli con almeno una presenza alle corse di addestramento dell'anno
// corrente di gioco. Le statistiche tecniche (velocità/accelerazione/tenuta curva/resistenza)
// restano nascoste finché il cavallo non entra in Stalla di contrada: qui si vedono solo le
// corse di addestramento disputate/vinte nell'anno e i Palii disputati/vinti in carriera.

// Prezzo di acquisto di un cavallo: stessa formula della carriera Capitano (media delle 4
// statistiche tecniche x 450, arrotondata per difetto).
function nCavCalcPrezzoAcquisto(db){
  return Math.floor(((db.vel+db.acc+db.ten+db.res)/4)*450);
}

// Statistiche di carriera (Palii disputati/vinti) di un cavallo — persistono per tutta la
// carriera e non si azzerano ogni anno (a differenza di N.statsCavalli).
function nCavCareerStats(nome){
  if(!N.statsCavalliCarriera)N.statsCavalliCarriera={};
  return N.statsCavalliCarriera[nome]||{palii:0,vinti:0};
}

function nCavStatsBlock(nome){
  const stag=(N.statsCavalli&&N.statsCavalli[nome])||{gare:0,vittorie:0};
  const car=nCavCareerStats(nome);
  return `${nFntCountRow('Corse addestramento (anno)',stag.gare)}${nFntCountRow('Corse vinte (anno)',stag.vittorie)}${nFntCountRow('Palii disputati (carriera)',car.palii)}${nFntCountRow('Palii vinti (carriera)',car.vinti)}`;
}

// Il Capitano accetta di prendere in prestito il cavallo (fino a fine anno, gratuitamente)
// se reputazione del giocatore + amicizia del capitano sono >= 155.
function nProponiCapitano(nome){
  if(!N)return;
  if(nPermessiStatus().cavalli==='none'){showToast('Il tuo status attuale non ti permette di proporre cavalli.','red');return;}
  const db=getCavDB(nome);if(!db)return;
  if((N.stalla||[]).some(c=>c.nome===nome)){showToast('Il cavallo è già in stalla!','red');return;}
  const capitano=(N.contradaioli||[]).find(c=>c.badge==='capitano');
  if(!capitano){showToast('Nessun capitano in carica: non può accettare cavalli!','red');return;}
  const somma=(N.reputazione||0)+(capitano.amicizia||0);
  if(somma>=155){
    if(!N.stalla)N.stalla=[];
    const cav={nome:db.nome,vel:db.vel,acc:db.acc,ten:db.ten,res:db.res,ner:db.ner,maxAcc:5,maxRes:5,annoAcquisto:N.anno,prestito:true};
    cav.valoreVendita=calcPrezzoVendita(cav);
    N.stalla.push(cav);
    nSalva();
    showToast('✦ '+capitano.nome+' accetta '+nome+' in stalla fino a fine anno!','grn');
    nRenderCavalli();nRenderStalla();
  } else {
    showToast('✗ '+capitano.nome+' rifiuta: servono almeno 155 punti tra reputazione e amicizia (hai '+somma+').','red');
  }
}

// Acquisto definitivo del cavallo: il prezzo viene scalato dal budget personale e il cavallo
// resta in stalla finché il giocatore non decide di venderlo.
function nAcquistaCavMercato(nome){
  if(!N)return;
  if(nPermessiStatus().cavalli!=='full'){showToast('Il tuo status attuale ti permette solo di proporre il cavallo al capitano.','red');return;}
  const db=getCavDB(nome);if(!db)return;
  if((N.stalla||[]).some(c=>c.nome===nome)){showToast('Il cavallo è già in stalla!','red');return;}
  const prezzo=nCavCalcPrezzoAcquisto(db);
  if(N.oro<prezzo){showToast('Oro insufficiente!','red');return;}
  N.oro-=prezzo;
  if(!N.stalla)N.stalla=[];
  const cav={nome:db.nome,vel:db.vel,acc:db.acc,ten:db.ten,res:db.res,ner:db.ner,maxAcc:5,maxRes:5,annoAcquisto:N.anno,acquistato:true};
  cav.valoreVendita=calcPrezzoVendita(cav);
  N.stalla.push(cav);
  nSalva();
  showToast('✦ Acquistato '+nome+' per '+prezzo+' oro!','grn');
  nRenderCavalli();nRenderStalla();
}

// ── MINIGIOCO FORZA 4 (scherzo alle contrade, Vita da Contradaiolo) ──
function n4RigaLibera(board,col){for(let r=5;r>=0;r--)if(board[r][col]===0)return r;return -1;}
function n4CheckVittoria(board,row,col,player){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    let count=1;
    for(let s=1;s<4;s++){const r=row+dr*s,c=col+dc*s;if(r<0||r>5||c<0||c>6||board[r][c]!==player)break;count++;}
    for(let s=1;s<4;s++){const r=row-dr*s,c=col-dc*s;if(r<0||r>5||c<0||c>6||board[r][c]!==player)break;count++;}
    if(count>=4)return true;
  }
  return false;
}
function n4TrovaMossaVincente(board,player){
  for(let col=0;col<7;col++){
    const row=n4RigaLibera(board,col);
    if(row===-1)continue;
    board[row][col]=player;
    const vince=n4CheckVittoria(board,row,col,player);
    board[row][col]=0;
    if(vince)return col;
  }
  return -1;
}
function n4MossaIA(board){
  let col=n4TrovaMossaVincente(board,2);
  if(col===-1)col=n4TrovaMossaVincente(board,1);
  if(col===-1){
    const ordine=[3,2,4,1,5,0,6];
    const disp=ordine.filter(c=>n4RigaLibera(board,c)!==-1);
    col=disp[Math.floor(Math.random()*disp.length)];
  }
  return col;
}

        <div style="font-size:38px;margin-bottom:6px" id="N4_RES_ICON"></div>
        <div style="font-family:var(--fn);font-size:16px;font-weight:800;margin-bottom:8px" id="N4_RES_TITLE"></div>
        <div style="font-size:13px;color:var(--parch2);line-height:1.6;padding:10px;background:rgba(0,0,0,.2);border-radius:10px;border-left:3px solid #888;margin-bottom:10px" id="N4_RES_MSG"></div>
        <button id="N4_CLOSE_BTN" class="btn gold w">Continua →</button>
      </div>
    </div>`;
  document.getElementById('APP').appendChild(overlay);

  const grid=document.getElementById('N4_GRID');
  const status=document.getElementById('N4_STATUS');
  const cellCol=(r,c)=>board[r][c]===1?colGioc:board[r][c]===2?colIA:'#1A0E08';

  function disegna(){
    grid.innerHTML='';
    for(let r=0;r<6;r++){
      for(let c=0;c<7;c++){
        const cell=document.createElement('div');
        cell.style.cssText=`width:100%;aspect-ratio:1;border-radius:50%;background:${cellCol(r,c)};border:1.5px solid #5C3D2E;transition:background .15s;cursor:${finito?'default':'pointer'}`;
        cell.onclick=()=>giocaColonna(c);
        grid.appendChild(cell);
      }
    }
  }
  disegna();

  function giocaColonna(col){
    if(finito||!turnoGiocatore)return;
    const row=n4RigaLibera(board,col);
    if(row===-1)return;
    board[row][col]=1;
    disegna();
    if(n4CheckVittoria(board,row,col,1)){concludi(true);return;}
    if(board.every(riga=>riga.every(v=>v!==0))){concludi(false);return;}
    turnoGiocatore=false;
    status.textContent=bersaglio+' sta pensando alla mossa…';
    setTimeout(()=>{
      const colIa=n4MossaIA(board);
      const rowIa=n4RigaLibera(board,colIa);
      if(rowIa!==-1){
        board[rowIa][colIa]=2;
        disegna();
        if(n4CheckVittoria(board,rowIa,colIa,2)){concludi(false);return;}
      }
      if(board.every(riga=>riga.every(v=>v!==0))){concludi(false);return;}
      turnoGiocatore=true;
      status.textContent='Tocca a te: scegli una colonna';
    },500);
  }

  function concludi(vinto){
    finito=true;
    disegna();
    document.getElementById('N4_STATUS').style.display='none';
    const box=document.getElementById('N4_BOX');
    const resEl=document.getElementById('N4_RESULT');
    resEl.style.display='';
    const icon=document.getElementById('N4_RES_ICON');
    const title=document.getElementById('N4_RES_TITLE');
    const msg=document.getElementById('N4_RES_MSG');

    N.scherzoMensile=(N.scherzoMensile||0)+1;
    const isNemica=bersaglio===N.nemica;

    if(vinto){
      box.style.borderColor='#5DBB63';box.style.boxShadow='0 0 50px rgba(93,187,99,.35)';
      icon.textContent='😂';title.style.color='#5DBB63';title.textContent='Scherzo riuscito!';
      const repGain=isNemica?10:5;
      N.reputazione=clamp((N.reputazione||0)+repGain,0,100);
      let extra='';
      if(!isNemica){
        const nemicaDelBersaglio=CDB[bersaglio]?CDB[bersaglio].nemica:null;
        if(nemicaDelBersaglio&&nemicaDelBersaglio!==N.contrada&&N.rapportiContrade[nemicaDelBersaglio]!==undefined){
          N.rapportiContrade[nemicaDelBersaglio]=clamp(N.rapportiContrade[nemicaDelBersaglio]+5,0,100);
          extra=` La contrada di <strong>${nemicaDelBersaglio}</strong>, nemica di ${bersaglio}, apprezza il gesto: rapporto +5.`;
        }
      }
      msg.style.borderLeftColor='#5DBB63';
      msg.innerHTML=`Lo scherzo ai danni di <strong>${bersaglio}</strong> è riuscito alla perfezione! Reputazione +${repGain}.${extra}`;
      showToast('✦ Scherzo riuscito su '+bersaglio+'! +'+repGain+' reputazione','grn');
    } else {
      box.style.borderColor='#E05555';box.style.boxShadow='0 0 50px rgba(224,85,85,.3)';
      icon.textContent='😬';title.style.color='#E05555';title.textContent='Scherzo fallito!';
      const repLoss=isNemica?10:5;
      N.reputazione=clamp((N.reputazione||0)-repLoss,0,100);
      N.rapportiContrade[bersaglio]=clamp((N.rapportiContrade[bersaglio]||0)-10,0,100);
      msg.style.borderLeftColor='#E05555';
      msg.innerHTML=`Lo scherzo ai danni di <strong>${bersaglio}</strong> è stato scoperto! Reputazione −${repLoss}, rapporto con ${bersaglio} −10.`;
      showToast('✗ Scherzo fallito su '+bersaglio+'! −'+repLoss+' reputazione','red');
    }
    nSalva();
    document.getElementById('N4_CLOSE_BTN').onclick=()=>{overlay.remove();nRenderContrade();};
  }
}
function nRenderAlbo(){
  const el=R('sc-nalbo');if(!el)return;
  if(!N){el.innerHTML='<div class="le">Nessun dato.</div>';return;}
  const storico=N.albumStorico||[];
  let listHtml;
  if(!storico.length){
    listHtml='<div class="le">Nessun Palio ancora disputato.</div>';
  } else {
    listHtml='';
    storico.forEach(entry=>{
      const isPlayer=entry.isPlayerVictory===true;
      listHtml+=`<div class="le ${isPlayer?'grn':''}">
        <strong style="color:var(--gold)">${entry.anno}</strong> — 
        ${isPlayer
          ?`<strong style="color:#5DBB63">🏆 ${entry.vincitore} (TU)</strong>`
          :`${entry.vincitore}${entry.vincitore===N.nemica?' <span class="bdg r">nemica</span>':''}`
        }
      </div>`;
    });
  }
  el.innerHTML=`<div class="card"><div class="ct">Albo d'Oro — Palii per Anno</div><div>${listHtml}</div></div>`;
}

// ── STALLA DEL CONTRADAIOLO (cavalli acquistati + fantino ingaggiato) ──
function nRenderStalla(){
  if(!N)return;
  const cv=R('CARD_NCAV'),cf=R('CARD_NFAN');
  if(!cv||!cf)return;
  if(!N.stalla)N.stalla=[];
  const stallaMode=nPermessiStatus().stalla; // 'none' | 'view' | 'train' | 'full'
  const puoAllenare=stallaMode==='train'||stallaMode==='full';
  const puoGestire=stallaMode==='full'; // vendi cavallo / licenzia fantino
  const allenatoQuestoMese=(N.allenamentoMensile||0)>=1;
  const avviso=(puoAllenare&&allenatoQuestoMese)?'<div style="font-size:11px;color:rgba(201,168,76,.5);margin-bottom:10px;font-family:var(--fn)">Hai già allenato un cavallo questo mese — riprova il mese prossimo.</div>':'';
  const avvisoSoloVisione=stallaMode==='view'?'<div style="font-size:11px;color:rgba(201,168,76,.5);margin-bottom:10px;font-family:var(--fn)">Il tuo status attuale ti permette solo di visionare cavallo e fantino, senza poter decidere allenamenti, vendite o licenziamenti.</div>':'';
  if(N.stalla.length){
    let html='<div class="ct">I tuoi destrieri</div>'+avviso+avvisoSoloVisione;
    N.stalla.forEach((c,idx)=>{
      const accAtMax=c.acc>=c.maxAcc,resAtMax=c.res>=c.maxRes;
      const eta=c.maxAcc<5||c.maxRes<5?`<div style="font-size:11px;color:#E05555;margin-bottom:6px">⚠ ${5-Math.min(c.maxAcc,c.maxRes)} anno/i — acc e res al massimo attuale.</div>`:'';
      const _dbCavS=getCavDB(c.nome);const _imgSrcS=_dbCavS&&_dbCavS.img?_dbCavS.img:'';const _imgHtmlS=_imgSrcS?`<img src="${_imgSrcS}" alt="${c.nome}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='🐎'">`:' 🐎';
      const stanC=c.stanchezza||0,intC=c.intesaFant||0,troppoStancoC=stanC>=3;
      html+=`<div style="border:var(--bord);border-radius:10px;padding:12px;margin-bottom:10px;background:#1A0E08">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
          <div style="width:72px;height:72px;flex-shrink:0;border-radius:8px;overflow:hidden;border:var(--bord);background:#1A0E08;display:flex;align-items:center;justify-content:center;font-size:28px">${_imgHtmlS}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold)">${c.nome}${c.prestito?' <span class="bdg o" style="font-size:9px">prestito capitano</span>':''}</div>
              ${(c.prestito||!puoGestire)?'':`<button class="btn" style="font-size:11px;padding:5px 10px" onclick="nVendiCav(${idx})">Vendi (${c.valoreVendita!==undefined?c.valoreVendita:(c.valoreVendita=calcPrezzoVendita(c))} oro)</button>`}
            </div>
            ${c.prestito?'<div style="font-size:11px;color:rgba(201,168,76,.5);margin-bottom:6px">Resta in stalla fino a fine anno, poi torna al Capitano.</div>':''}
            ${eta}
            <div style="display:flex;gap:10px;align-items:center;margin-top:4px">
              <div><div class="fpip-label" style="text-align:center;margin-bottom:2px">STAN</div>${fPipsGrn(stanC,3)}</div>
              <div><div class="fpip-label" style="text-align:center;margin-bottom:2px">INT</div>${fPipsBlu(intC,3)}</div>
            </div>
          </div>
        </div>
        ${sRow('Velocità',c.vel)}${sRowCapped('Accelerazione',c.acc,c.maxAcc)}
        ${sRow('Tenuta curva',c.ten)}${sRowCapped('Resistenza',c.res,c.maxRes)}
        ${sRow('Nervosismo',c.ner,5,true)}
        ${troppoStancoC?'<div style="font-size:11px;color:#E05555;margin-top:6px">⚠ Cavallo troppo stanco per allenarsi o correre</div>':''}
        ${(puoAllenare&&!troppoStancoC)?`<div style="font-size:10px;color:rgba(201,168,76,.5);margin-top:8px;margin-bottom:4px;font-family:var(--fn);letter-spacing:1px;text-transform:uppercase">Allenamento · max 1 al mese</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button class="train-btn" ${allenatoQuestoMese?'disabled':''} onclick="nAllena('forza',${idx})"><div class="train-title">Forza pura</div><div class="train-desc">+1 Velocità, +1 Nervosismo</div></button>
          <button class="train-btn" ${(accAtMax||allenatoQuestoMese)?'disabled':''} onclick="nAllena('controllo',${idx})"><div class="train-title">Controllo e ritmo</div><div class="train-desc ${accAtMax?'cap':''}">${accAtMax?'Accelerazione al massimo ('+c.maxAcc+')':'+1 Accelerazione, −1 Nervosismo'}</div></button>
          <button class="train-btn" ${(resAtMax||allenatoQuestoMese)?'disabled':''} onclick="nAllena('fondo',${idx})"><div class="train-title">Fondo e curve</div><div class="train-desc ${resAtMax?'cap':''}">${resAtMax?'Resistenza al massimo ('+c.maxRes+')':'+1 Tenuta curva, +1 Resistenza'}</div></button>
        </div>`:''}
      </div>`;
    });
    cv.innerHTML=html;
  } else {
    cv.innerHTML='<div class="ct">I tuoi destrieri</div><div style="font-size:14px;color:rgba(201,168,76,.5)">Nessun cavallo in stalla. Vai al menù Cavalli.</div>';
  }
  if(N.fan){
    const f=N.fan;
    cf.innerHTML=`<div class="ct">Il tuo fantino</div>
      <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:var(--gold);margin-bottom:10px">${f.nome}</div>
      ${sRow('Bravura',f.bravura)}${sRow('Esperienza',f.esp)}
      ${sRow('Gestione mossa',f.mossa)}${sRow('Empatia',f.emp)}
      ${puoGestire?`<button class="btn w" onclick="nLicFan()">Licenzia fantino</button>`:''}`;
  } else {
    cf.innerHTML='<div class="ct">Il tuo fantino</div><div style="font-size:14px;color:rgba(201,168,76,.5)">Nessun fantino. Vai al menù Fantini.</div>';
  }
  const vetBox=R('CARD_NVET');
  if(vetBox){
    if(nPermessiStatus().vet){
      vetBox.style.display='';
      vetBox.innerHTML=N.veterinario
        ? `<div class="ct">Veterinario</div><div class="evbox grn">✦ Veterinario attivo fino a fine anno paliesco — stanchezza −1/mese a tutti i cavalli in stalla.</div>`
        : `<div class="ct">Veterinario</div><button class="btn w" onclick="nIngaggiaVeterinario()">🏥 Ingaggia veterinario<div style="font-size:11px;font-weight:400;margin-top:2px">Dura fino a fine anno paliesco · Stanchezza −1/mese a tutti i cavalli in stalla</div></button>`;
    } else {
      vetBox.style.display='none';
      vetBox.innerHTML='';
    }
  }
}

function nIngaggiaVeterinario(){
  if(!N)return;
  if(!nPermessiStatus().vet){showToast('Il tuo status attuale non ti permette di ingaggiare il veterinario.','red');return;}
  if(N.veterinario){showToast('Veterinario già ingaggiato per quest\'anno.','red');return;}
  N.veterinario=true;
  showToast('✦ Veterinario ingaggiato! Stanchezza −1/mese a tutti i cavalli in stalla.','grn');
  nSalva();
  nRenderStalla();
}

function nAllena(tipo,idx){
  if(!N.stalla||!N.stalla[idx])return;
  const sm=nPermessiStatus().stalla;
  if(sm!=='train'&&sm!=='full'){showToast('Il tuo status attuale non ti permette di allenare i cavalli.','red');return;}
  if((N.allenamentoMensile||0)>=1){showToast('Puoi allenare un solo cavallo al mese!','red');return;}
  if((N.stalla[idx].stanchezza||0)>=3){showToast('Cavallo troppo stanco per allenarsi!','red');return;}
  nMostraMinigioco(tipo,idx);
}

// ── MINIGIOCO ALLENAMENTO (Contradaiolo) ──
function nMostraMinigioco(tipo,idx){
  const MOSSE=['🥕','⚡','🏇','🍏','🍎','🐎'];
  const NMOVES=6;
  const seqLen=5;
  const sequenza=[];
  for(let i=0;i<NMOVES;i++) sequenza.push(Math.floor(Math.random()*MOSSE.length));

  const titoliTipo={forza:'Forza Pura 💪',controllo:'Controllo e Ritmo 🎯',fondo:'Fondo e Curve 🏇'};
  const overlay=document.createElement('div');
  overlay.id='NMINIGIOCO_OVL';
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px';

  overlay.innerHTML=`
    <div id="NMG_BOX" style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:18px;padding:20px;max-width:340px;width:100%;position:relative;box-shadow:0 0 50px rgba(201,168,76,.25);transition:border-color .5s,box-shadow .5s">
      <div style="text-align:center;margin-bottom:4px">
        <div style="font-size:26px">🏋️</div>
        <div style="font-family:var(--fn);font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.5px;margin-top:4px">Minigioco Allenamento</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:2px;font-family:var(--fn)">${titoliTipo[tipo]||tipo}</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0"></div>

      <div id="NMG_PHASE_SHOW" style="">
        <div style="font-family:var(--fn);font-size:12px;color:var(--gold-l);text-align:center;margin-bottom:10px">Osserva la combinazione!</div>
        <div style="display:flex;justify-content:center;gap:10px;margin-bottom:14px" id="NMG_DOTS"></div>
        <div style="text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center">
          <div id="NMG_CUR_MOVE" style="font-size:44px;opacity:0;transition:opacity .2s"></div>
        </div>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(201,168,76,.4);text-align:center;margin-top:8px" id="NMG_SHOW_STATUS">Preparati…</div>
      </div>

      <div id="NMG_PHASE_PLAY" style="display:none">
        <div style="font-family:var(--fn);font-size:12px;color:var(--gold-l);text-align:center;margin-bottom:10px">Replica la sequenza!</div>
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:12px" id="NMG_REPLAY_DOTS"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px" id="NMG_BTNS"></div>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(201,168,76,.4);text-align:center" id="NMG_PLAY_STATUS">Mossa 1 di ${NMOVES}</div>
      </div>

      <div id="NMG_PHASE_RESULT" style="display:none;text-align:center">
        <div style="font-size:42px;margin-bottom:6px" id="NMG_RES_ICON"></div>
        <div style="font-family:var(--fn);font-size:17px;font-weight:800;margin-bottom:8px" id="NMG_RES_TITLE"></div>
        <div style="font-size:13px;color:var(--parch2);line-height:1.6;padding:10px;background:rgba(0,0,0,.2);border-radius:10px;border-left:3px solid #888;margin-bottom:14px" id="NMG_RES_MSG"></div>
        <button id="NMG_CLOSE_BTN" class="btn gold w">Continua →</button>
      </div>
    </div>`;

  document.getElementById('APP').appendChild(overlay);

  const dotsEl=document.getElementById('NMG_DOTS');
  const curMoveEl=document.getElementById('NMG_CUR_MOVE');

  for(let i=0;i<seqLen;i++){
    const d=document.createElement('div');
    d.style.cssText='width:16px;height:16px;border-radius:50%;background:#1A0E08;border:1.5px solid #5C3D2E;transition:background .2s,border-color .2s';
    d.id='NMG_DOT_'+i;
    dotsEl.appendChild(d);
  }

  function mostraMossaIdx(moveIdx){
    if(moveIdx>=NMOVES){
      document.getElementById('NMG_PHASE_SHOW').style.display='none';
      mostraFaseGioco();
      return;
    }
    const dotIdx=Math.min(moveIdx,seqLen-1);
    const colors=['#C9A84C','#5DBB63','#378ADD','#E05555','#B07BD4','#FF9B30'];
    for(let i=0;i<seqLen;i++){
      const d=document.getElementById('NMG_DOT_'+i);
      if(d){d.style.background='#1A0E08';d.style.borderColor='#5C3D2E';}
    }
    const d=document.getElementById('NMG_DOT_'+dotIdx);
    if(d){d.style.background=colors[sequenza[moveIdx]];d.style.borderColor=colors[sequenza[moveIdx]];}
    curMoveEl.style.opacity='0';
    setTimeout(()=>{
      curMoveEl.textContent=MOSSE[sequenza[moveIdx]];
      curMoveEl.style.opacity='1';
      setTimeout(()=>{
        curMoveEl.style.opacity='0';
        setTimeout(()=>mostraMossaIdx(moveIdx+1),200);
      },650);
    },100);
  }

  setTimeout(()=>mostraMossaIdx(0),700);

  let playerSeq=[];
  function mostraFaseGioco(){
    document.getElementById('NMG_PHASE_PLAY').style.display='';
    const replayDots=document.getElementById('NMG_REPLAY_DOTS');
    const btnsEl=document.getElementById('NMG_BTNS');
    const playStatus=document.getElementById('NMG_PLAY_STATUS');

    replayDots.innerHTML='';
    for(let i=0;i<NMOVES;i++){
      const d=document.createElement('div');
      d.style.cssText='width:14px;height:14px;border-radius:50%;background:#1A0E08;border:1.5px solid #5C3D2E;transition:background .15s';
      d.id='NMG_PDOT_'+i;
      replayDots.appendChild(d);
    }

    btnsEl.innerHTML='';
    const colors=['#C9A84C','#5DBB63','#378ADD','#E05555','#B07BD4','#FF9B30'];
    MOSSE.forEach((m,i)=>{
      const b=document.createElement('button');
      b.style.cssText=`padding:12px 6px;border-radius:10px;border:1.5px solid ${colors[i]};background:rgba(0,0,0,.3);
        cursor:pointer;font-size:26px;font-family:var(--fn);text-align:center;min-height:54px;
        transition:transform .1s,background .1s;-webkit-appearance:none`;
      b.textContent=m;
      b.onclick=()=>registraMossa(i);
      btnsEl.appendChild(b);
    });

    function registraMossa(moveIdx){
      const step=playerSeq.length;
      playerSeq.push(moveIdx);
      const pd=document.getElementById('NMG_PDOT_'+step);
      if(pd){pd.style.background=colors[moveIdx];pd.style.borderColor=colors[moveIdx];}
      if(playerSeq.length<NMOVES){
        playStatus.textContent='Mossa '+(playerSeq.length+1)+' di '+NMOVES;
      } else {
        btnsEl.querySelectorAll('button').forEach(b2=>b2.disabled=true);
        const vinto=playerSeq.every((v,i)=>v===sequenza[i]);
        setTimeout(()=>mostraRisultato(vinto),300);
      }
    }
  }

  function mostraRisultato(vinto){
    document.getElementById('NMG_PHASE_PLAY').style.display='none';
    document.getElementById('NMG_PHASE_RESULT').style.display='';
    const mgBox=document.getElementById('NMG_BOX');
    const resIcon=document.getElementById('NMG_RES_ICON');
    const resTitle=document.getElementById('NMG_RES_TITLE');
    const resMsg=document.getElementById('NMG_RES_MSG');

    const c=N.stalla[idx];
    N.allenamentoMensile=(N.allenamentoMensile||0)+1;
    c.stanchezza=Math.min(3,(c.stanchezza||0)+1);

    if(vinto){
      mgBox.style.borderColor='#5DBB63';
      mgBox.style.boxShadow='0 0 50px rgba(93,187,99,.35)';
      resIcon.textContent='🏆';
      resTitle.style.color='#5DBB63';
      resTitle.textContent='Allenamento Riuscito!';
      let descMiglioramento='';
      if(tipo==='forza'){c.vel=clamp(c.vel+1,1,5);c.ner=clamp(c.ner+1,1,5);descMiglioramento='+1 Velocità, +1 Nervosismo';}
      else if(tipo==='controllo'){c.acc=clamp(c.acc+1,1,c.maxAcc);c.ner=clamp(c.ner-1,1,5);descMiglioramento='+1 Accelerazione, −1 Nervosismo';}
      else if(tipo==='fondo'){c.ten=clamp(c.ten+1,1,5);c.res=clamp(c.res+1,1,c.maxRes);descMiglioramento='+1 Tenuta curva, +1 Resistenza';}
      c.valoreVendita=calcPrezzoVendita(c);
      resMsg.style.borderLeftColor='#5DBB63';
      resMsg.innerHTML=`Il cavallo <strong>${c.nome}</strong> ha risposto magnificamente all'allenamento!<br><span style="color:#5DBB63;font-weight:700">${descMiglioramento}</span>`;
    } else {
      mgBox.style.borderColor='#E05555';

function nVendiCav(idx){
  if(!N.stalla||!N.stalla[idx])return;
  if(nPermessiStatus().stalla!=='full'){showToast('Il tuo status attuale non ti permette di vendere cavalli.','red');return;}
  const c=N.stalla[idx];const v=c.valoreVendita!==undefined?c.valoreVendita:calcPrezzoVendita(c);
  N.oro+=v;
  N.stalla.splice(idx,1);
  nSalva();
  showToast('Venduto '+c.nome+' per '+v+' oro','grn');
  nRenderStalla();
}
function nLicFan(){
  if(!N.fan)return;
  if(nPermessiStatus().stalla!=='full'){showToast('Il tuo status attuale non ti permette di licenziare il fantino.','red');return;}
  showToast(N.fan.nome+' licenziato','inf');

  nRenderStalla();
}

// ── FANTINI SUL MERCATO (Contradaiolo) ──
function nGenFantiniMercato(){
  const tuttiNomi=[...NF];
  const shuffled=[...tuttiNomi].sort(()=>Math.random()-.5);
  const altreContrade=Object.keys(CDB).filter(k=>k!==N.contrada);
  const shuffContrade=[...altreContrade].sort(()=>Math.random()-.5).slice(0,7);
  const fantiniContratti=shuffled.slice(0,7).map((nome,i)=>{
    const db=FANTINI_MAP[nome]||{bravura:rnd(1,5),esp:rnd(1,5),mossa:rnd(1,5),emp:rnd(1,5)};
    return {nome,bravura:db.bravura,esp:db.esp,mossa:db.mossa,emp:db.emp,contrada:shuffContrade[i]};
  });
  const fantiniSvincolati=shuffled.slice(7).map(nome=>{
    const db=FANTINI_MAP[nome]||{bravura:rnd(1,5),esp:rnd(1,5),mossa:rnd(1,5),emp:rnd(1,5)};
    return {nome,bravura:db.bravura,esp:db.esp,mossa:db.mossa,emp:db.emp,contrada:null};
  });
  return {contratti:fantiniContratti,svincolati:fantiniSvincolati};
}

// Riga statistica "a contatore" (non a puntini) per i dati pubblici dei fantini sul mercato
function nFntCountRow(label,val){return `<div class="sr"><span class="sl">${label}</span><span style="font-size:13px;color:var(--gold-l);font-weight:700;font-family:var(--fn)">${val}</span></div>`;}

// Statistiche di carriera (Palii disputati/vinti) di un fantino — persistono per tutta la carriera, non si azzerano ogni anno
function nFntCareerStats(nome){
  if(!N.statsFantiniCarriera)N.statsFantiniCarriera={};
  return N.statsFantiniCarriera[nome]||{palii:0,vinti:0};
}

// Dati pubblici di un fantino sul mercato: finché non è ingaggiato (in Stalla), le 4 statistiche
// (Bravura, Esperienza, Gestione mossa, Empatia) restano nascoste al giocatore. Si vedono al loro posto
// le gare/vittorie della stagione corrente e i Palii disputati/vinti in carriera.
function nFntStatsBlock(nome){
  const stag=(N.statsFantini&&N.statsFantini[nome])||{gare:0,vittorie:0};
  const car=nFntCareerStats(nome);
  return `${nFntCountRow('Gare disputate (anno)',stag.gare)}${nFntCountRow('Vittorie (anno)',stag.vittorie)}${nFntCountRow('Palii disputati (carriera)',car.palii)}${nFntCountRow('Palii vinti (carriera)',car.vinti)}`;
}

function nApriOffertaFnt(i){
  if(N.fan){showToast('Licenzia prima il fantino attuale dalla Stalla!','red');return;}

  if(N.fantiniRifiutati[f.nome]){showToast(f.nome+' ha rifiutato: non può essere contattato fino al prossimo anno.','red');return;}
  const el=R('NFNT_OFFERTA_'+i);if(!el)return;

function nInviaOffertaFnt(i){
  if(N.fan){showToast('Hai già un fantino in stalla! Licenzialo prima.','red');return;}
  const f=N.fantiniMercato.svincolati[i];
  if(!f)return;
  const slEl=R('NFNT_SL_'+i);
  if(!slEl)return;
  const offerta=parseInt(slEl.value)||0;
  if(offerta>N.oro){showToast('Oro insufficiente!','red');return;}
  if(offerta===0){showToast('L\'offerta deve essere maggiore di 0!','red');return;}

  const mediaStats=(f.bravura+f.esp+f.mossa+f.emp)/4;
  const prestigioMod=(N.reputazione||5)/100;
  const fattoreRandom=0.8+Math.random()*0.4;
  const soglia=(mediaStats-prestigioMod)*500*fattoreRandom;

  const accetta=offerta>=soglia;

  if(accetta){
    N.oro-=offerta;
    N.fan={nome:f.nome,bravura:f.bravura,esp:f.esp,mossa:f.mossa,emp:f.emp,costo:offerta};
    N.fantiniMercato.svincolati.splice(i,1);
    nSalva();
    nMostraEsitoOffertaFnt(f.nome,true,offerta,Math.round(soglia));
  } else {
    if(!N.fantiniRifiutati)N.fantiniRifiutati={};
    N.fantiniRifiutati[f.nome]=true;
    nSalva();
    nMostraEsitoOffertaFnt(f.nome,false,offerta,Math.round(soglia));
  }
}

// Modifica il morale di contrada e verifica se il Capitano in carica deve decadere
function nModMoraleContrada(delta){
  if(!N)return;
  N.moraleContrada=clamp((N.moraleContrada||0)+delta,0,100);
  nCheckDecadimentoCapitano();
}

// Se il morale crolla a 0, il Capitano in carica decade automaticamente,
// non solo quando viene volontariamente sostituito dal Consiglio Direttivo.
// Il cambio di Capitano termina anche il mandato di tutte le altre cariche,
// che riparte da quell'anno (stessa regola di una sostituzione manuale).
function nCheckDecadimentoCapitano(){
  if(!N||!N.contradaioli)return;
  if((N.moraleContrada||0)>0)return;
  const capitanoAttuale=N.contradaioli.find(c=>c.badge==='capitano');
  if(!capitanoAttuale)return;
  const nomeVecchio=capitanoAttuale.nome;
  capitanoAttuale.badge=null;
  const papabili=N.contradaioli.filter(c=>!c.badge&&c.sesso==='M');
  let nomeNuovo=null;
  if(papabili.length){
    const nuovo=papabili[Math.floor(Math.random()*papabili.length)];
    nuovo.badge='capitano';nuovo.mandatoInizio=N.anno;
    nomeNuovo=nuovo.nome;
  }
  N.contradaioli.forEach(c=>{if(c.badge)c.mandatoInizio=N.anno;});
  nSalva();
  showToast('⚠ Morale a 0: '+nomeVecchio+' decade da Capitano'+(nomeNuovo?', al suo posto '+nomeNuovo+'!':'!'),'red');
}

function nDoManiero(tipo){
  if(!N)return;
  if(N.condManiero===undefined)N.condManiero=60;
  const evEl=R('NMANIERO_EV');
  function showMev(msg,cls){if(evEl)evEl.innerHTML=`<div class="evbox ${cls}">${msg}</div>`;}
  if(tipo==='cena'){
    if(N.manieroOrganizzaCena)return;
    if(N.budgetContrada<100){showMev('Budget insufficiente (100 necessari).','red');return;}
    N.budgetContrada-=100;
    const cond=N.condManiero;
    const fatt=rf(0.8,1.2);
    const guad=Math.floor((N.moraleContrada-(100-cond))*8*fatt);
    const guadEff=Math.max(0,guad);
    N.budgetContrada+=guadEff;N.manieroOrganizzaCena=true;
    nSalva();
    showMev('🍷 Cena organizzata! −100 oro, +'+guadEff+' oro guadagnati nel budget','grn');
    nManieroOrganizza();
    return;
  } else if(tipo==='gadget'){
    if(N.manieroVenditaGadget)return;
    const guadBase=Math.floor(N.moraleContrada*2*rf(.8,1.2));
    const guad=N.manieroGiornataAperta?Math.floor(guadBase*1.5):guadBase;
    N.budgetContrada+=guad;N.manieroVenditaGadget=true;
    nSalva();
    showMev('💰 Gadget venduti! +'+guad+' oro'+(N.manieroGiornataAperta?' (bonus Giornata Manieri Aperti x1,5)':''),'grn');
    nManieroOrganizza();
    return;
  } else if(tipo==='manutenzione'){
    if(N.manieroManutenzione)return;
    if(N.budgetContrada<500){showMev('Budget insufficiente (500 necessari).','red');return;}
    N.budgetContrada-=500;N.condManiero=clamp(N.condManiero+20,0,100);
    nModMoraleContrada(5);N.manieroManutenzione=true;
    nSalva();
    showMev('🔨 Manutenzione completata! −500 oro, +20 condizioni, +5 morale','grn');
    nManieroOrganizza();
    return;
  }
}

// ══════════════════════════════════════════════
//  CORSE DI ADDESTRAMENTO (Contradaiolo)
//  12 cavalli + 12 fantini dal database esterno, accoppiati a caso,
//  divisi in 3 gare da 4. Ogni gara: 4 giri calcolati, si vede solo il
//  risultato finale (nessuna simulazione grafica).
// ══════════════════════════════════════════════
let CORSE_ADD=null;

// Pesca 12 cavalli e 12 fantini dal DB esterno, li accoppia a caso
// e li divide in 3 gare da 4 coppie cavallo-fantino.
// cavalliForzati: eventuali cavalli della stalla di contrada scelti dal giocatore
// (tramite l'Addetto Corse) che devono entrare nel lotto al posto di cavalli casuali del DB.
function nGeneraCorseAddestramento(cavalliForzati){
  if(!CAVALLI_DB||!CAVALLI_DB.length||!NF||!NF.length)return null;
  cavalliForzati=(cavalliForzati||[]).filter(Boolean);
  const n=Math.min(12,CAVALLI_DB.length+cavalliForzati.length,NF.length);
  if(n<3)return null;
  const nomiForzati=new Set(cavalliForzati.map(c=>c.nome));
  const forzatiSel=cavalliForzati.slice(0,n);
  const restanti=Math.max(0,n-forzatiSel.length);
  const poolDb=CAVALLI_DB.filter(c=>!nomiForzati.has(c.nome));
  const cavSelDb=[...poolDb].sort(()=>Math.random()-.5).slice(0,restanti);
  const cavSel=[...forzatiSel,...cavSelDb];
  const fanSel=[...NF].sort(()=>Math.random()-.5).slice(0,n);
  const coppie=cavSel.map((c,i)=>({cavallo:c.nome,fantino:fanSel[i],cav:c,daStalla:nomiForzati.has(c.nome)}));
  const shuff=[...coppie].sort(()=>Math.random()-.5);
  const nGare=3,perGara=Math.floor(n/nGare);
  const gare=[];
  for(let i=0;i<nGare;i++){
    gare.push(shuff.slice(i*perGara,i===nGare-1?shuff.length:(i+1)*perGara));
  }
  return gare;
}

// Stanchezza/intesa dei cavalli in Carriera Contradaiolo — bonus/malus sulle statistiche,
// esattamente come nella Carriera Fantino (v. fApplicaStanchezzaEffetti/fApplicaIntesaEffetti).
function nApplicaStanchezzaEffetti(c){
  // stanchezza 2 → -1 res temporanea; stanchezza 3 → non può correre né allenarsi
  c._penRes = (c.stanchezza||0)>=2 ? 1 : 0;
}
function nApplicaIntesaEffetti(c){
  // intesa 2 → +1 ten; intesa 3 → +1 ten, -1 ner
  c._bonTen = (c.intesaFant||0)>=2 ? 1 : 0;
  c._bonNer = (c.intesaFant||0)>=3 ? 1 : 0;
}
function nStatCorsaEffettiva(c){
  nApplicaStanchezzaEffetti(c);nApplicaIntesaEffetti(c);
  return {
    vel:c.vel||3, acc:c.acc||3,
    ten:(c.ten||3)+(c._bonTen||0),
    res:Math.max(1,(c.res||3)-(c._penRes||0)),
    ner:Math.max(1,(c.ner||3)-(c._bonNer||0))
  };
}

// Punteggio di un singolo giro per una coppia cavallo-fantino
function nScoreGiroAllenamento(cav,fan,giro){
  const st=nStatCorsaEffettiva(cav);
  const vel=st.vel,acc=st.acc,ten=st.ten,res=st.res;
  const fatica=Math.max(0,(giro-1)*(6-res)*.2);
  const base=(vel+acc+ten)-fatica+((fan.bravura||3)*.5+(fan.emp||3)*.2+(fan.mossa||3)*.3);
  return base+rf(0,3);
}

// Simula i 4 giri di una gara e restituisce la classifica finale (dal 1° al 4° posto)
function nSimulaGaraAddestramento(coppie){
  const punti={};
  coppie.forEach(cp=>punti[cp.cavallo]=0);
  for(let g=1;g<=4;g++){
    coppie.forEach(cp=>{
      const fanStats=FANTINI_MAP[cp.fantino]||{bravura:rnd(1,5),esp:rnd(1,5),mossa:rnd(1,5),emp:rnd(1,5)};
      punti[cp.cavallo]+=nScoreGiroAllenamento(cp.cav,fanStats,g);
    });
  }
  return coppie.map(cp=>({...cp,punti:+punti[cp.cavallo].toFixed(1)})).sort((a,b)=>b.punti-a.punti);
}

// Registra gare disputate e vittorie di cavalli e fantini (dati stagionali, si azzerano ogni anno)
function nRegistraStatsGara(classifica){
  if(!N.statsCavalli)N.statsCavalli={};
  if(!N.statsFantini)N.statsFantini={};
  classifica.forEach((cp,idx)=>{
    if(!N.statsCavalli[cp.cavallo])N.statsCavalli[cp.cavallo]={gare:0,vittorie:0};
    if(!N.statsFantini[cp.fantino])N.statsFantini[cp.fantino]={gare:0,vittorie:0};
    N.statsCavalli[cp.cavallo].gare++;
    N.statsFantini[cp.fantino].gare++;
    if(idx===0){
      N.statsCavalli[cp.cavallo].vittorie++;
      N.statsFantini[cp.fantino].vittorie++;
    }
  });
  nSalva();
}

function nCorseAddestramento(){
  if(!N)return;
  if(!nMeseConsentito('corseAddestramento')){showToast('Il tuo status attuale ('+nStatusLabel()+') non ti permette di accedere a questa sezione.','red');return;}
  if(N.pistaImpraticabile){showToast('La pista è impraticabile questo mese: nessuna corsa di addestramento!','red');return;}
  if(N.stalla&&N.stalla.length){
    N._corseStallaSel=[];
    nMostraSelezioneStallaCorse();
    return;
  }
  nAvviaCorseAddestramento([]);
}

// Prima delle corse, se ci sono cavalli in stalla, l'Addetto Corse chiede al giocatore
// se e quali di quei cavalli far entrare nel lotto per l'estrazione dei 12 partecipanti.
function nMostraSelezioneStallaCorse(){
  if(!N)return;
  if(!N._corseStallaSel)N._corseStallaSel=[];

  const nomeAddetto=addetto?addetto.nome:'l\'Addetto Corse';
  const righe=N.stalla.map((c,i)=>{
    const sel=N._corseStallaSel.includes(i);

      ${righe}
    </div>
    <button class="btn pr w" onclick="nAvviaCorseAddestramento(N._corseStallaSel)">✔ Conferma e genera le corse →</button>

function nToggleStallaCorsa(idx){
  if(!N)return;
  const cvSel=N.stalla&&N.stalla[idx];
  if(cvSel&&(cvSel.stanchezza||0)>=3){showToast('Cavallo troppo stanco per correre!','red');return;}
  if(!N._corseStallaSel)N._corseStallaSel=[];
  const p=N._corseStallaSel.indexOf(idx);
  if(p>=0)N._corseStallaSel.splice(p,1);else N._corseStallaSel.push(idx);
  nMostraSelezioneStallaCorse();
}

function nAvviaCorseAddestramento(stallaIdxs){
  if(!N)return;
  const cavalliStalla=(stallaIdxs||[]).map(i=>N.stalla[i]).filter(Boolean);
  N._corseStallaSel=[];
  const gare=nGeneraCorseAddestramento(cavalliStalla);
  if(!gare){showToast('Il database di cavalli e fantini non è sufficiente per le corse!','red');return;}
  // Stanchezza/intesa: i cavalli di stalla che corrono l'addestramento +1 stanchezza, +1 intesa;
  // gli altri cavalli di stalla che non corrono questo mese -1 stanchezza.
  if(N.stalla&&N.stalla.length){
    N.stalla.forEach(cv=>{
      if(cavalliStalla.includes(cv)){
        cv.stanchezza=Math.min(3,(cv.stanchezza||0)+1);
        cv.intesaFant=Math.min(3,(cv.intesaFant||0)+1);
      } else {
        cv.stanchezza=Math.max(0,(cv.stanchezza||0)-1);
      }
    });
    nSalva();
  }
  CORSE_ADD={gare,idx:0,risultati:[]};
  nRenderCorseIntro();
}

// Simula il Palio di fine anno (Maggio): estrae la contrada vincitrice e, se coincide
// con la contrada del giocatore, registra la vittoria nell'albo personale
function nSimulaPalioAnno(){
  if(!N)return;
  const contrade=Object.keys(CDB);
  const vincitrice=contrade[Math.floor(Math.random()*contrade.length)];
  if(!N.ultimaVittoriaContrada)N.ultimaVittoriaContrada={};
  N.ultimaVittoriaContrada[vincitrice]=N.anno;

  // Albo d'Oro: registra anno per anno chi vince il Palio, come per la carriera Capitano
  if(!N.albumStorico)N.albumStorico=[];
  N.albumStorico.push({anno:N.anno,vincitore:vincitrice,isPlayerVictory:vincitrice===N.contrada});

  // Aggiorna le statistiche di carriera (Palii disputati/vinti) dei fantini attualmente
  // ingaggiati da una contrada: i fantini "già ingaggiati da altre contrade" e, se presente,
  // il fantino del giocatore corrono il Palio di quest'anno. Questi dati persistono per
  // tutta la carriera e non si azzerano ogni anno (a differenza di N.statsFantini).
  if(!N.statsFantiniCarriera)N.statsFantiniCarriera={};
  const registraPalio=(nome,haVinto)=>{
    if(!nome)return;
    if(!N.statsFantiniCarriera[nome])N.statsFantiniCarriera[nome]={palii:0,vinti:0};
    N.statsFantiniCarriera[nome].palii++;
    if(haVinto)N.statsFantiniCarriera[nome].vinti++;
  };
  if(N.fantiniMercato&&N.fantiniMercato.contratti){
    N.fantiniMercato.contratti.forEach(f=>registraPalio(f.nome,f.contrada===vincitrice));
  }
  if(N.fan)registraPalio(N.fan.nome,N.contrada===vincitrice);

  // Aggiorna le statistiche di carriera (Palii disputati/vinti) dei cavalli: si considerano
  // "in lizza" per il Palio tutti i cavalli che hanno corso almeno una corsa di addestramento
  // quest'anno. Questi dati persistono per tutta la carriera (a differenza di N.statsCavalli).
  if(!N.statsCavalliCarriera)N.statsCavalliCarriera={};
  const poolCavalli=Object.keys(N.statsCavalli||{});
  const cavalloVincitore=poolCavalli.length?poolCavalli[Math.floor(Math.random()*poolCavalli.length)]:NC[Math.floor(Math.random()*NC.length)];
  poolCavalli.forEach(nome=>{
    if(!N.statsCavalliCarriera[nome])N.statsCavalliCarriera[nome]={palii:0,vinti:0};
    N.statsCavalliCarriera[nome].palii++;
  });
  if(!N.statsCavalliCarriera[cavalloVincitore])N.statsCavalliCarriera[cavalloVincitore]={palii:0,vinti:0};
  N.statsCavalliCarriera[cavalloVincitore].vinti++;

  if(vincitrice===N.contrada){
    const fantino=N.fan?N.fan.nome:NF[Math.floor(Math.random()*NF.length)];
    const cavallo=cavalloVincitore;
    if(!N.palii)N.palii=[];
    N.palii.push({anno:N.anno,status:N.status,fantino,cavallo});
  }
}

function nAvanzaMese(){
  if(!N)return;
  if(N.mi<4){
    // Passaggio Aprile → Maggio, riservato al Capitano: si apre l'Imprevisto dell'Ultima Ora
    // al posto dell'imprevisto mensile "normale" e della Gazzetta del Palio.
    const passaggioUltimaOra=(N.mi===3)&&nRuoloIn('capitano');
    // Passaggio Marzo → Aprile, dall'undicesimo anno di età (compreso) in poi: si apre
    // "Le Correnti di Contrada" al posto dell'imprevisto mensile "normale" e della Gazzetta.
    const passaggioBivio=(N.mi===2)&&(N.eta>=11);
    N.mi++;
    N.amiciziaMensile=0;
    N.allenamentoMensile=0;
    N.scherzoMensile=0;
    N.manieroSerataMensile=false;
    N.manieroDaiManoMensile=false;
    N.manieroOrganizzaCena=false;
    N.manieroVenditaGadget=false;
    N.manieroOrganizzaEvento=false;
    N.manieroManutenzione=false;
    N.manieroGiornataAperta=false;
    if(N.condManiero===undefined)N.condManiero=60;
    N.condManiero=clamp(N.condManiero-5,0,100);
    // Reputazione: lento logorio mensile della vita da contradaiolo
    N.reputazione=clamp((N.reputazione||0)-5,0,100);
    N.pistaImpraticabile=false;
    N._eventoMese=null;
    // Veterinario: -1 stanchezza a tutti i cavalli in stalla
    if(N.veterinario&&N.stalla&&N.stalla.length){
      N.stalla.forEach(cv=>{cv.stanchezza=Math.max(0,(cv.stanchezza||0)-1);});
      showToast('Veterinario: stanchezza −1 a tutti i cavalli','grn');
    }
    if(passaggioUltimaOra){
      nGeneraImprevistoUltimaOra();
      nSalva();
      nMostraImprevistoUltimaOra(()=>{nRenderMese();});
      return;
    }
    if(passaggioBivio){
      nSalva();
      nMostraBivio(()=>{nRenderMese();});
      return;
    }
    // Imprevisti mensili (30% di probabilità, uno solo al mese)
    if(Math.random()<0.3)nEstraiImprevistoContradaiolo();
    nSalva();
    // Mostra Gazzetta del Palio all'inizio del nuovo mese
    nMostraGazzetta(()=>{nRenderMese();});
    return;
  }
  // Maggio: prima di entrare nella Vigilia del Palio, risolve l'eventuale Imprevisto dell'Ultima Ora
  nRisolviImprevistoUltimaOra();
  nSalva();
  nAvviaVigiliaPalio();
}

// ── IMPREVISTO DELL'ULTIMA ORA (Aprile → Maggio, solo Capitano) — CARRIERA "VITA DA CONTRADAIOLO" ──
// Ogni imprevisto è legato a una carica del Consiglio Direttivo (badge) e ha una condizione
// di risoluzione: il giocatore può evitare le conseguenze negative sostituendo la persona
// coinvolta (opzione 1) oppure risolvendo la condizione richiesta (opzione 2) entro la fine
// di Maggio. Se non fa nulla (opzione 3), subisce le conseguenze negative.
const N_IMPREVISTI_ULTIMA_ORA={
  castellana:{

// Verifica se la condizione di risoluzione (opzione 2) è stata raggiunta
function nImprevistoRisolto(){
  const imp=N&&N._imprevistoUltimaOra;if(!imp)return false;
  if(imp.tipo==='castellana'){
    const c=(N.contradaioli||[]).find(x=>x.badge==='castellana');
    return !!c&&c.amicizia>=90;
  }
  if(imp.tipo==='addettoCorse'){
    const c=(N.contradaioli||[]).find(x=>x.badge==='addettoCorse');
    return !!c&&c.amicizia>=90;
  }
  if(imp.tipo==='finanze'){
    return (N.budgetContrada||0)>=5000;
  }
  if(imp.tipo==='gonfaloniere'){
    const altre=Object.keys(CDB).filter(k=>k!==N.contrada&&k!==N.nemica);
    const rap=N.rapportiContrade||{};
    return altre.length>0&&altre.every(k=>(rap[k]||0)>=90);
  }
  return false;
}
// Verifica se la persona coinvolta nell'imprevisto è stata sostituita (opzione 1)
function nImprevistoSostituito(){
  const imp=N&&N._imprevistoUltimaOra;if(!imp)return false;
  const c=(N.contradaioli||[]).find(x=>x.badge===imp.badge);
  const nomeAttuale=c?c.nome:null;
  return nomeAttuale!==imp.nomeOriginale;
}
// Applica le conseguenze negative dell'imprevisto (opzione 3: nessuna azione presa)
function nImprevistoApplicaEffettoNegativo(){
  const imp=N&&N._imprevistoUltimaOra;if(!imp)return;
  if(imp.tipo==='castellana'){
    const pool=N.contradaioli||[];
    const scelti=sample(pool,Math.min(10,pool.length));
    scelti.forEach(c=>{c.amicizia=0;});
  } else if(imp.tipo==='finanze'){
    N.budgetContrada=0;
  } else if(imp.tipo==='gonfaloniere'||imp.tipo==='addettoCorse'){
    // La contrada viene esclusa dal Palio dell'anno corrente: arriverà automaticamente
    // quarta (ultima) della propria batteria.
    N._forzaQuartaBatteria=true;
  }
}
// Da chiamare al passaggio Maggio → Vigilia del Palio: stabilisce quale delle tre opzioni
// è stata presa dal giocatore e applica le conseguenze corrispondenti.
function nRisolviImprevistoUltimaOra(){
  if(!N)return;
  const imp=N._imprevistoUltimaOra;
  if(!imp)return;
  const sostituito=nImprevistoSostituito();
  const risolto=!sostituito&&nImprevistoRisolto();
  if(!sostituito&&!risolto){
    nImprevistoApplicaEffettoNegativo();
  }
  N._imprevistoUltimaOra=null;
}

// Applica gli effetti della scelta del bivio: +10 amicizia ai contradaioli delle correnti
// sostenute, −5 amicizia a tutti gli altri contradaioli
function nApplicaBivio(opzione){
  if(!N)return;
  if(!N.fazionePunti)N.fazionePunti={corsa:0,maniero:0,politica:0};
  const sostenute=opzione.fazioni||[];
  Object.keys(FAZIONI_CONTRADAIOLI).forEach(fz=>{
    if(sostenute.includes(fz))N.fazionePunti[fz]=(N.fazionePunti[fz]||0)+1;
  });
  (N.contradaioli||[]).forEach(c=>{
    if(!c.fazione)c.fazione=nEstraiFazioneCasuale();
    c.amicizia=clamp(c.amicizia+(sostenute.includes(c.fazione)?10:-5),0,100);
  });
  nSalva();
  const nomiSostenute=sostenute.map(f=>FAZIONI_CONTRADAIOLI[f].label).join(' e ');
  showToast('Scelta presa: '+opzione.label+(nomiSostenute?' — vicinanza con «'+nomiSostenute+'»':''),'grn');
}

function nEstraiImprevistoContradaiolo(){
  if(!N)return;
  const tipi=['cena_proibita','crollo_morale','dono_ex_contradaiolo','crollo_maniero','pista_impraticabile',
    'trovato_amico','che_litigio','fantino_infortunato','scherzo_nemica','che_affronto','alleata'];
  const tipo=tipi[rnd(0,tipi.length-1)];
  let titolo,testo;
  if(tipo==='cena_proibita'){
    N.oro=Math.max(0,(N.oro||0)-600);
    titolo='📜 Cena Proibita!';
    testo=`Una cena non autorizzata tra contradaioli è finita nelle orecchie sbagliate: le autorità del Palio ti hanno inflitto una <strong>multa di 600 oro</strong>.`;
  } else if(tipo==='crollo_morale'){
    N.moraleContrada=clamp((N.moraleContrada||0)-90,0,100);
    titolo='😔 Crolla il Morale!';
    testo=`Un clima pesante si è diffuso tra i contradaioli. <strong>Il morale della contrada è crollato.</strong> Servirà del tempo, e qualche gesto concreto, per rialzare gli animi.`;
  } else if(tipo==='dono_ex_contradaiolo'){
    N.oro=(N.oro||0)+800;
    titolo='💰 Dono Inatteso!';
    testo=`Un ex contradaiolo, mai dimentico dei propri colori, ha inviato <strong>800 oro</strong> nelle casse della contrada. Un gesto che scalda il cuore di tutti.`;
  } else if(tipo==='crollo_maniero'){
    N.condManiero=0;
    titolo='🏚️ Crolla il Tetto del Maniero!';
    testo=`Tragedia per la nostra contrada: <strong>il tetto del maniero è crollato</strong>! Le condizioni sono ridotte a zero. Servirà una costosa manutenzione per ripristinarlo.`;
  } else if(tipo==='pista_impraticabile'){
    N.pistaImpraticabile=true;
    titolo='🌧️ Pista Impraticabile!';
    testo=`Le piogge di questi giorni hanno reso il terreno del Palio completamente impraticabile. <strong>Questo mese non sarà possibile disputare corse di addestramento.</strong>`;
  } else if(tipo==='trovato_amico'&&N.contradaioli&&N.contradaioli.length){
    const c=N.contradaioli[rnd(0,N.contradaioli.length-1)];
    c.amicizia=100;
    titolo='🤝 Trovato un Amico!';
    testo=`Una serata tra i vicoli della contrada ha fatto miracoli: tu e <strong>${c.nome}</strong> avete trovato un'intesa speciale. La vostra amicizia è ora al massimo.`;
  } else if(tipo==='che_litigio'&&N.contradaioli&&N.contradaioli.length){
    const c=N.contradaioli[rnd(0,N.contradaioli.length-1)];
    c.amicizia=0;
    titolo='😡 Che Litigio!';
    testo=`Una discussione finita male ha rovinato il rapporto con <strong>${c.nome}</strong>. L'amicizia tra voi è azzerata: ci vorrà tempo per ricucire lo strappo.`;
  } else if(tipo==='fantino_infortunato'&&N.fan){
    const nomeFant=N.fan.nome;
    N.fan=null;
    titolo='🤕 Fantino Infortunato!';
    testo=`Brutta notizia dalla stalla di contrada: <strong>${nomeFant}</strong> si è infortunato e ha dovuto lasciare la stalla. Bisognerà ingaggiare un nuovo fantino.`;
  } else if(tipo==='scherzo_nemica'){
    N.moraleContrada=clamp((N.moraleContrada||0)-10,0,100);
    const repLoss=nRuoloIn('capitano')?10:5;
    N.reputazione=clamp((N.reputazione||0)-repLoss,0,100);
    titolo='😈 Lo Scherzo della Nemica!';
    testo=`La contrada nemica <strong>${N.nemica}</strong> ci ha giocato un brutto scherzo. Il morale della contrada ne risente, e anche la tua reputazione in piazza è calata.`;
  } else if(tipo==='che_affronto'){
    const altre=Object.keys(CDB).filter(k=>k!==N.contrada&&k!==N.nemica);
    if(!altre.length)return;
    if(!N.rapportiContrade)N.rapportiContrade=nInizRapportiContrade();
    const bersaglio=altre[rnd(0,altre.length-1)];
    N.rapportiContrade[bersaglio]=0;
    titolo='😤 Che Affronto!';
    testo=`Una contrada che credevi amica ci ha giocato un brutto tiro: <strong>${bersaglio}</strong> ci ha fatto uno scherzo di pessimo gusto. L'intesa con quella contrada è crollata a zero.`;
  } else if(tipo==='alleata'){
    const altre=Object.keys(CDB).filter(k=>k!==N.contrada);
    if(!altre.length)return;
    if(!N.rapportiContrade)N.rapportiContrade=nInizRapportiContrade();
    const alleata=altre[rnd(0,altre.length-1)];
    N.rapportiContrade[alleata]=100;
    titolo='🏳️ Nuova Alleata!';
    testo=`Un patto d'amicizia è stato suggellato con <strong>${alleata}</strong>: l'intesa con questa contrada è ora al massimo. Un'alleanza preziosa in vista del Palio.`;
  } else {
    return; // condizione non applicabile questo mese (es. nessun contradaiolo o fantino): mese senza imprevisto
  }
  N._eventoMese={titolo,testo};
}

// Porta avanti l'anno dopo che il Palio (con tutta la sua vigilia) si è concluso
function nCompletaAnnoDopoPalio(){
  if(!N)return;
  N.anno++;
  N.eta++; // l'età aumenta di 1 ogni Gennaio, tranne l'anno di partenza
  nAggiornaStatus(); // ricalcola cucciolo/contradaiolo in base alla nuova età (gli status speciali restano invariati)
  nInvecchiaContradaioli(); // ogni contradaiolo invecchia di un anno; a 80 anni viene sostituito da uno nuovo
  // Invecchiamento cavalli della stalla di contrada: scatta dal 4° anno consecutivo
  // in stalla (compreso), cioè dopo 3 anni pieni trascorsi dall'acquisto.
  if(N.stalla){
    // I cavalli avuti in prestito dal Capitano (proposti dal menù Cavalli) restano in stalla
    // solo fino a fine anno: al cambio anno tornano al mercato.
    const cavalliInPrestitoPersi=N.stalla.filter(c=>c.prestito).map(c=>c.nome);
    N.stalla=N.stalla.filter(c=>!c.prestito);
    if(cavalliInPrestitoPersi.length)showToast('Il Capitano riprende: '+cavalliInPrestitoPersi.join(', '),'inf');
    N.stalla.forEach(c=>{
      if(c.annoAcquisto===undefined)c.annoAcquisto=N.anno-1;
      const anniInStalla=N.anno-c.annoAcquisto;
      if(anniInStalla>=3){c.maxAcc=Math.max(1,c.maxAcc-1);c.maxRes=Math.max(1,c.maxRes-1);c.acc=Math.min(c.acc,c.maxAcc);c.res=Math.min(c.res,c.maxRes);}
      c.valoreVendita=calcPrezzoVendita(c);
    });
  }
  N.mi=0;
  N.amiciziaMensile=0;
  N.allenamentoMensile=0;
  N.scherzoMensile=0;
  N.manieroSerataMensile=false;
  N.manieroDaiManoMensile=false;
  N.manieroOrganizzaCena=false;
  N.manieroVenditaGadget=false;
  N.manieroOrganizzaEvento=false;
  N.manieroManutenzione=false;
  N.manieroGiornataAperta=false;
  N.pistaImpraticabile=false;
  N._eventoMese=null;
  N.veterinario=false; // il veterinario va reingaggiato ogni anno paliesco
  if(N.condManiero===undefined)N.condManiero=60;
  N.condManiero=clamp(N.condManiero-5,0,100);
  // Le statistiche di gare/vittorie di cavalli e fantini si azzerano a ogni nuovo anno
  N.statsCavalli={};
  N.statsFantini={};
  // I ruoli/badge dei contradaioli vengono rinnovati ogni 3 anni di gioco
  if(N.badgeUltimoAnno===undefined||N.anno-N.badgeUltimoAnno>=3)nAssegnaBadges();
  nCheckDecadimentoCapitano();
  // Ripulisce lo stato temporaneo della vigilia appena conclusa
  N._strategia=null;N._bP=null;N._bIA=null;N._qP=null;N._qIA=null;N._offerta=null;N._meteo=null;N._esitoBatteria=undefined;
  N._imprevistoUltimaOra=null;N._forzaQuartaBatteria=false;
  nSalva();
  if(N.eta>=N.etaFine){
    nMostraRiepilogoFinale();
    return;
  }
  R('HUD').style.display='none';
  R('NAV').style.display='flex';
  R('MAIN').innerHTML='';
  nBuildDOM();
  nRenderNav();
  nGoTo('mese');
}

//  VIGILIA DEL PALIO — CARRIERA "VITA DA CONTRADAIOLO"

function nRuolo(){return nStatusKey();}
function nRuoloIn(...ruoli){return ruoli.includes(nRuolo());}

// Assegna un cavallo IA a ciascuna delle contrade avversarie per l'anno in corso
function nAssegnaCavalliIAAnno(){
  if(!N)return;
  const nomeCavalliContrada=(N.stalla||[]).map(c=>c.nome);
  const disponibili=CAVALLI_DB.filter(c=>!nomeCavalliContrada.includes(c.nome));
  const shuffled=[...disponibili].sort(()=>Math.random()-.5);
  const altreContrade=Object.keys(CDB).filter(k=>k!==N.contrada);
  CAVALLI_IA={};
  altreContrade.forEach((k,i)=>{if(shuffled[i])CAVALLI_IA[k]=shuffled[i];});
}

// Se la stalla di contrada è vuota, la contrada schiera comunque un cavallo per il Palio
function nCreaCavalloAuto(){
  const usati=new Set((N.stalla||[]).map(c=>c.nome));
  const disponibili=NC.filter(n=>!usati.has(n));
  const nome=disponibili.length?sample(disponibili,1)[0]:('Cavallo di '+N.contrada);
  const c=newCav(nome);
  c.annoAcquisto=N.anno;
  c.valoreVendita=calcPrezzoVendita(c);
  return c;
}
// Se non c'è un fantino ingaggiato, la contrada ne schiera comunque uno per il Palio
function nCreaFantinoAuto(){
  const nome=sample(NF,1)[0];
  return newFan(nome);
}

// ── ENTRY POINT ──
function nAvviaVigiliaPalio(){
  if(!N)return;
  R('HUD').style.display='none';
  R('NAV').style.display='none';
  N._strategia=null;N._offerta=null;
  N._bP=null;N._bIA=null;N._qP=null;N._qIA=null;
  nAssegnaCavalliIAAnno();
  if(!N.stalla)N.stalla=[];
  if(!N.stalla.length)N.stalla.push(nCreaCavalloAuto());
  if(N.cavSelIdx===undefined||!N.stalla[N.cavSelIdx])N.cavSelIdx=0;
  if(!N.fan)N.fan=nCreaFantinoAuto();
  N.cav=N.stalla[N.cavSelIdx];
  nSalva();
  nVigiliaSceltaCavallo();
}

// ── 1) SCELTA DEL CAVALLO CON ESTRAZIONE METEO — Capitano, Addetto Corse ──
function nVigiliaSceltaCavallo(){
  N._meteo=sorteggiMeteo();
  if(!nRuoloIn('capitano','addettoCorse')){
    N.cav=N.stalla[N.cavSelIdx]||N.stalla[0];

  }
  if(N.stalla.length<=1){

  let html=`<div style="text-align:center;margin-bottom:14px">

  </div>
  ${meteoHTML(N._meteo)}`;
  N.stalla.forEach((cv,i)=>{

    const _scImgHtml=_scImg?`<div style="display:flex;justify-content:center;margin-bottom:10px"><img src="${_scImg}" alt="${cv.nome}" style="max-width:100%;max-height:140px;object-fit:contain;border-radius:8px;border:var(--bord)" onerror="this.style.display='none'"></div>`:'';

      <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">${cv.nome}</div>

    </div>`;
  });
  setMain('<div style="padding:12px">'+html+'</div>');
}
function nSceltaCavParlio(idx){N.cavSelIdx=idx;N.cav=N.stalla[idx];applicaMeteoACav(N.cav,N._meteo);nVigiliaCena();}

// ── 5) ACCORDI E STRATEGIE — Capitano, Addetto Corse (con possibile offerta economica) ──
function nVigiliaAccordi(fase,onContinue){
  if(!N)return;
  if(!nRuoloIn('capitano','addettoCorse')){onContinue();return;}
  const batt=fase==='batteria'?(N._bP||[]):[...((N._qP)||[]),...((N._qIA)||[])];
  const altriInBatt=batt.filter(n=>n!==N.contrada);
  const hasNemica=altriInBatt.includes(N.nemica);
  N._strategia=null;N._offerta=null;
  const rapporti=N.rapportiContrade||{};
  const bonusrep=Math.min(20,Math.floor((N.reputazione||0)/5));

  // Possibile offerta economica da una contrada in batteria, in base all'intesa
  let offertaHtml='';
  for(const c of altriInBatt){
    const intesa=rapporti[c]||0;
    if(Math.random()*100<intesa){
      const cifra=rnd(100,700);
      N._offerta={da:c,cifra};
      offertaHtml=`<div class="card" id="OFFERTA_CARD">
        <div class="ct">💰 Offerta economica</div>
        <div style="font-size:13px;color:var(--parch2);margin-bottom:10px;line-height:1.6"><strong>${c}</strong> ti offre <strong style="color:var(--gold)">${cifra} oro</strong> per un accordo di gara.</div>
        <div style="display:flex;gap:8px">
          <button class="btn gold" style="flex:1" onclick="nAccettaOffertaN()">Accetta</button>
          <button class="btn" style="flex:1" onclick="nRifiutaOffertaN()">Rifiuta</button>
        </div>
      </div>`;
      break;
    }
  }

  let html=`<div style="text-align:center;margin-bottom:14px">
    <div style="font-size:28px">🤝</div>
    <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Accordi e Strategie di Gara</div>
    <div style="font-size:12px;color:rgba(201,168,76,.5);margin-top:4px">${fase==='finale'?'Finale':'Batteria'} — Prima del canapo</div>
    <div style="font-size:11px;color:rgba(201,168,76,.4);margin-top:2px">Reputazione: ⭐${N.reputazione||0} — bonus accettazione Patti +${bonusrep}%</div>
  </div>
  ${offertaHtml}
  <div class="card">
    <div class="ct">Composizione batteria</div>`;
  batt.forEach(n=>{
    const rap=n===N.contrada?100:(rapporti[n]||0);
    const col=n===N.contrada?'var(--gold)':rap>=70?'#5DBB63':rap>=40?'var(--gold)':'#E05555';
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(201,168,76,.08)">
      <div style="font-family:var(--fn);font-size:13px;font-weight:${n===N.contrada?'700':'400'};color:${n===N.contrada?'var(--gold)':'var(--parch)'}">
        ${n===N.contrada?'▶ '+n+' (tu)':n}${n===N.nemica?' <span class="bdg r">nemica</span>':''}
      </div>
      ${n!==N.contrada?`<span style="font-size:12px;font-weight:700;color:${col}">${rap}/100</span>`:''}
    </div>`;
  });
  html+=`</div>
  <div class="card">
    <div class="ct">Scegli la strategia</div>
    <div style="font-size:11px;color:rgba(201,168,76,.4);margin-bottom:8px;font-family:var(--fn)">Puoi scegliere una sola strategia</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn w stratgn-btn" onclick="nScegliStrategiaN('tenuta',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:var(--gold-l)">🛡️ Tenersi per l'ultimo giro</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Velocità −1 · Resistenza +2</div>
      </button>`;
  if(hasNemica){
    html+=`<button class="btn w stratgn-btn" onclick="nScegliStrategiaN('contro_nemica',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#E05555">⚔️ Contro la nemica</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Né tu né ${N.nemica} vincete questa corsa</div>
      </button>`;
  }
  html+=`<button class="btn w stratgn-btn" onclick="nScegliStrategiaN('morte',null,'${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#E05555">⚡ Alla morte</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">Velocità +2 · Resistenza −1</div>
      </button>`;
  altriInBatt.forEach(n=>{
    const rap=rapporti[n]||0;
    const prob=Math.min(95,rap+bonusrep);
    html+=`<button class="btn w stratgn-btn" onclick="nScegliStrategiaN('patti','${n}','${fase}')" style="text-align:left;padding:12px">
        <div style="font-weight:700;color:#7BC8FF">🤝 Patti con ${n}</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:3px">−300 oro · ${prob}% probabilità accettazione</div>
      </button>`;
  });
  html+=`</div></div>`;
  setMain('<div class="pad">'+html+'</div>');
  window._nStrOnContinue=onContinue;
}
function nAccettaOffertaN(){
  if(!N._offerta)return;
  N.oro+=N._offerta.cifra;
  showToast('Accordo con '+N._offerta.da+'! +'+N._offerta.cifra+' oro','grn');
  const card=R('OFFERTA_CARD');if(card)card.remove();
  N._offerta=null;nSalva();
}
function nRifiutaOffertaN(){
  showToast('Hai rifiutato l\'offerta economica.','inf');
  const card=R('OFFERTA_CARD');if(card)card.remove();
  N._offerta=null;nSalva();
}
function nScegliStrategiaN(tipo,bersaglio,fase){
  if(!N)return;
  document.querySelectorAll('.stratgn-btn').forEach(b=>{b.disabled=true;b.style.opacity='.35';b.style.pointerEvents='none';});
  const bonusrep=Math.min(20,Math.floor((N.reputazione||0)/5));
  const probUbbidienza=Math.min(95,50+(N.fan?N.fan.bravura*5:0)+bonusrep*2);
  const fantUbbidisce=Math.random()*100<probUbbidienza;
  let msg='',colore='grn';
  if(!fantUbbidisce){
    msg=`⚠️ Il fantino <strong>${N.fan?N.fan.nome:'—'}</strong> ha ignorato i tuoi ordini! Correrà a suo modo.`;
    N._strategia={tipo:'normale',bersaglio:null};colore='red';
  } else if(tipo==='tenuta'){
    msg=`✦ Il fantino eseguirà "Tenersi per l'ultimo giro". Velocità −1, Resistenza +2.`;
    N._strategia={tipo:'tenuta',bersaglio:null};
  } else if(tipo==='contro_nemica'){
    msg=`⚔️ Il fantino punterà contro ${N.nemica}. Né tu né la nemica vincerete.`;
    N._strategia={tipo:'contro_nemica',bersaglio:N.nemica};
  } else if(tipo==='morte'){
    msg=`⚡ Il fantino correrà "Alla morte"! Velocità +2, Resistenza −1.`;
    N._strategia={tipo:'morte',bersaglio:null};
  } else if(tipo==='patti'){
    const rapporti=N.rapportiContrade||{};
    const rap=rapporti[bersaglio]||0;
    const prob=Math.min(95,rap+bonusrep);
    if(N.oro<300){
      document.querySelectorAll('.stratgn-btn').forEach(b=>{b.disabled=false;b.style.opacity='';b.style.pointerEvents='';});
      showToast('Non hai 300 oro per i Patti!','red');return;
    }
    N.oro-=300;
    const acc=Math.random()*100<prob;
    if(acc){
      msg=`🤝 <strong>${bersaglio}</strong> ha accettato i Patti! Ti lascerà passare (−300 oro).`;
      N._strategia={tipo:'patti',bersaglio};
    } else {
      msg=`✗ <strong>${bersaglio}</strong> ha rifiutato i Patti. −300 oro sprecati.`;
      N._strategia={tipo:'normale',bersaglio:null};colore='red';
    }
  }
  const tracciato=fantUbbidisce?'Il fantino eseguirà gli ordini.':'Il fantino ha tradito la fiducia.';
  nSalva();
  nMostraEsitoStrategiaN(msg,colore,tracciato,fantUbbidisce);
}

  const f=N.fan,c=N.cav;

  if(MosInt)clearInterval(MosInt);

}
function nFermaMossaN(fase){
  if(!Mos.active)return;Mos.active=false;clearInterval(MosInt);MosInt=null;
  const d=Math.abs(Mos.pos-Mos.tacca);let esito,mult,msg;
  if(d<=Mos.amp/2){esito='OTTIMALE';mult=1.15;msg='⚡ PARTENZA A FIONDA! Sei schizzato primo!';}
  else if(Mos.pos>Mos.tacca+Mos.amp/2){esito='FALSA';mult=.1;msg='✗ PARTENZA FALSA! Riparti ultimo.';}
  else{esito='LENTA';mult=.5;msg='⚠ PARTENZA LENTA… Sei rimasto al canapo.';}
  Mos.mult=mult;
  R('MOS_RIS').style.display='block';
  const t=R('MOS_T');t.textContent=msg;
  t.style.color=esito==='OTTIMALE'?'#5DBB63':esito==='FALSA'?'#E05555':'var(--gold)';
  R('MOS_B').textContent=`Posizione: ${Math.round(Mos.pos)} · Tacca: ${Math.round(Mos.tacca)} · Distanza: ${Math.round(d)} · Moltiplicatore: ×${mult}`;
  const btn=R('MOS_BTN');
  if(btn){
    if(fase==='batteria'){btn.textContent='⚔ Via! Corri la batteria →';btn.onclick=nVigiliaAvviaCorsa;}
    else{btn.textContent='⚔ Via! Corri la finale →';btn.onclick=N._qP&&N._qP.includes(N.contrada)?nVigiliaAvviaFinale:nVigiliaFinaleSpettatore;}
  }
}

// ── CALCOLO CORSA (contradaiolo) ──
function nScoreGiro(isPlayer,giro,mult,nomeContrada){
  let cOrig;
  if(isPlayer){cOrig=N.cav;}
  else{
    const dbCav=CAVALLI_IA[nomeContrada]||null;
    cOrig=dbCav?{vel:dbCav.vel,acc:dbCav.acc,ten:dbCav.ten,res:dbCav.res,ner:dbCav.ner}:newIACav();
  }
  const f=isPlayer?N.fan:newIAFan();
  const pen=isPlayer&&cOrig&&cOrig._meteoPen?cOrig._meteoPen:{ten:0,res:0};
  let velEff=cOrig.vel, resEff=Math.max(1,cOrig.res-(pen.res||0));
  if(isPlayer&&N._strategia){
    if(N._strategia.tipo==='tenuta'){velEff=Math.max(1,velEff-1);resEff=Math.min(5,resEff+2);}
    else if(N._strategia.tipo==='morte'){velEff=Math.min(5,velEff+2);resEff=Math.max(1,resEff-1);}
  }
  const tenEff=Math.max(1,cOrig.ten-(pen.ten||0));
  const fatica=Math.max(0,(giro-1)*(6-resEff)*.2);
  const base=(velEff+cOrig.acc+tenEff)-fatica+(f.bravura*.5+f.emp*.2);
  return base*((giro===1&&isPlayer)?mult:1)+rf(0,3);
}
function nSimBatteria(nomi,giri,isPlayerBatt){
  const sc={};nomi.forEach(n=>sc[n]=0);const gpg=[];
  const strat=N._strategia;
  for(let g=1;g<=giri;g++){
    nomi.forEach(n=>{
      let base=nScoreGiro(isPlayerBatt&&n===N.contrada,g,Mos.mult,n);
      if(strat&&strat.tipo==='contro_nemica'&&g===giri){if(n===N.contrada||n===strat.bersaglio)base*=0.1;}
      if(strat&&strat.tipo==='patti'&&g===giri&&n===strat.bersaglio)base*=0.5;
      sc[n]+=base;
    });
    gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));
  }
  return gpg;
}

// ── 7-8) SIMULAZIONE GRAFICA BATTERIA UNO E DUE — tutti ──
function nVigiliaAvviaCorsa(){
  const bP=N._bP,bIA=N._bIA;
  let gpgP=nSimBatteria(bP,4,true);const gpgIA=nSimBatteria(bIA,4,false);
  // Esclusione dal Palio causata da un imprevisto dell'ultima ora non risolto: la contrada
  // del giocatore arriva automaticamente quarta (ultima) della propria batteria.
  if(N._forzaQuartaBatteria){
    gpgP=gpgP.map(giro=>{const senza=giro.filter(n=>n!==N.contrada);senza.push(N.contrada);return senza;});
    N._forzaQuartaBatteria=false;
  }
  const qP=gpgP[gpgP.length-1].slice(0,2);const qIA=gpgIA[gpgIA.length-1].slice(0,2);
  N._qP=qP;N._qIA=qIA;
  N._esitoBatteria=qP.includes(N.contrada);
  nSalva();
  showRaceAnimation(bP, gpgP, 4, N.contrada,
    ()=>showRaceAnimation(bIA, gpgIA, 4, null,
      ()=>nVigiliaMostraBatterie(bP,gpgP,qP,bIA,gpgIA,qIA),
      {titolo:'Batteria B', sottotitolo:'Le altre 4 contrade'}),
    {titolo:'Batteria A — La tua batteria', sottotitolo:'4 giri · Le prime 2 si qualificano'});
}

  for(let g=0;g<gpgIA.length;g++){
    html+=`<div style="margin-bottom:8px"><div style="font-family:var(--fn);font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px">Giro ${g+1}</div>`;
    gpgIA[g].forEach((nome,pos)=>{const isQ=pos<2&&g===gpgIA.length-1;html+=`<div class="cr-line def">${pos+1}° ${nome}${isQ?' <span class="bdg g">qualificato</span>':''}</div>`;});
    html+=`</div>`;
  }
  html+=`</div><div class="card" style="text-align:center">
    <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:${playerIn?'#5DBB63':'var(--gold)'};margin-bottom:6px">${playerIn?'⚜ Sei qualificato alla finale!':'Non sei qualificato per la finale. Guardi dalle tribune...'}</div>

    <button class="btn gold w" onclick="${playerIn?'nVigiliaAccordi(\'finale\', ()=>nVigiliaMossa(\'finale\'))':'nVigiliaFinaleSpettatore()'}">${playerIn?'⚔ Accordi e strategie per la finale →':'👀 Guarda la finale →'}</button>
  </div>`;

// ── 10) SCHERMATA VINCITORE DEL PALIO — tutti, poi si passa all'anno successivo ──
function nVigiliaShowFinale(finalisti,gpgF,playerIn){
  if(N.cav)ripristinaMeteo(N.cav);
  nRipristinaStrategiaN();
  const classFinale=gpgF[gpgF.length-1];
  const vincitore=classFinale[0];
  const playerVince=vincitore===N.contrada;
  const posFin=classFinale.indexOf(N.contrada)+1;
  const nemicaVince=vincitore===N.nemica&&!playerVince;
  const eliminatoInBatteria=!playerIn;

  // ── Morale di contrada in base all'esito del Palio ──
  let deltaMorale=0;
  if(playerVince)deltaMorale+=100;
  else{
    if(eliminatoInBatteria)deltaMorale-=50;
    else if(posFin===2)deltaMorale-=15;
    else if(posFin===3||posFin===4)deltaMorale-=25;
    if(nemicaVince)deltaMorale-=75;
  }
  nModMoraleContrada(deltaMorale);

  // ── Reputazione del giocatore, solo se ha un ruolo diverso da Contradaiolo/Cucciolo ──
  const ruoloContaPerReputazione=!nRuoloIn('contradaiolo','cucciolo');
  let deltaRep=0;
  if(ruoloContaPerReputazione){
    if(playerVince)deltaRep+=25;
    else{deltaRep-=25;if(nemicaVince)deltaRep-=50;}
    N.reputazione=clamp((N.reputazione||0)+deltaRep,0,100);
  }

  // ── Registrazioni Albo d'Oro e statistiche di carriera ──
  if(!N.ultimaVittoriaContrada)N.ultimaVittoriaContrada={};
  N.ultimaVittoriaContrada[vincitore]=N.anno;
  if(!N.albumStorico)N.albumStorico=[];
  N.albumStorico.push({anno:N.anno,vincitore,isPlayerVictory:playerVince});
  if(!N.statsFantiniCarriera)N.statsFantiniCarriera={};
  if(N.fan){
    if(!N.statsFantiniCarriera[N.fan.nome])N.statsFantiniCarriera[N.fan.nome]={palii:0,vinti:0};
    N.statsFantiniCarriera[N.fan.nome].palii++;
    if(playerVince)N.statsFantiniCarriera[N.fan.nome].vinti++;
  }
  if(!N.statsCavalliCarriera)N.statsCavalliCarriera={};
  if(N.cav){
    if(!N.statsCavalliCarriera[N.cav.nome])N.statsCavalliCarriera[N.cav.nome]={palii:0,vinti:0};
    N.statsCavalliCarriera[N.cav.nome].palii++;
    if(playerVince)N.statsCavalliCarriera[N.cav.nome].vinti++;
  }
  if(playerVince){
    if(!N.palii)N.palii=[];
    N.palii.push({anno:N.anno,status:N.status,fantino:N.fan?N.fan.nome:'—',cavallo:N.cav?N.cav.nome:'—'});
  }
  nSalva();

  let html=`<div style="text-align:center;margin-bottom:12px"><div style="font-size:36px">⚔</div>
    <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:4px">La Finalissima</div>
    <div style="font-size:12px;color:rgba(201,168,76,.5)">Finalisti: ${finalisti.join(' · ')}</div></div>
  <div class="card">`;
  for(let g=0;g<gpgF.length;g++){
    html+=`<div style="margin-bottom:8px"><div style="font-family:var(--fn);font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px">Giro ${g+1} / 5</div>`;
    gpgF[g].forEach((nome,p)=>{const isP=nome===N.contrada,isV=p===0&&g===gpgF.length-1;html+=`<div class="cr-line ${isP?'pp':isV?'p1':'def'}">${p+1}° ${nome}${isV?' 🏆':''}</div>`;});
    html+=`</div>`;
  }
  html+=`</div><div class="result-banner">
    <div style="font-size:${playerVince?'32':'24'}px;margin-bottom:6px">${playerVince?'🥇':playerIn?'🎖':'👀'}</div>
    <div style="font-family:var(--fn);font-size:${playerVince?'15':'13'}px;font-weight:700;color:${playerVince?'var(--gold)':'var(--parch)'}">
      ${playerVince?'HAI VINTO IL PALIO! Le campane suonano per '+N.contrada.toUpperCase()+'!':eliminatoInBatteria?'Eliminato in batteria. Vince '+vincitore+'.':'Sei arrivato '+posFin+'°. Vince '+vincitore+'.'}
    </div>
    <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:6px">Anno: ${N.anno} · Status: ${N.status}</div>
    <div style="font-size:12px;margin-top:5px;color:${deltaMorale>=0?'#5DBB63':'#E05555'}">Morale di contrada ${deltaMorale>=0?'+':''}${deltaMorale}${ruoloContaPerReputazione?' · Reputazione '+(deltaRep>=0?'+':'')+deltaRep:''}</div>
    ${nemicaVince?`<div style="font-size:12px;margin-top:4px;color:#E05555">💀 La tua nemica ${N.nemica} ha vinto il Palio!</div>`:''}
  </div>
  <button class="btn gold w" onclick="nVigiliaProssimoAnno(${playerVince?1:0})">Prossimo anno →</button>`;
  setMain(html);
}
