<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palio di Legnano">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1A0E08">
<title>Palio di Legnano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
:root{
  --gold:#C9A84C;--gold-l:#E8D5A3;--gold-d:#8B6914;
  --parch:#F5EDD6;--parch2:#E8D5A3;
  --bg:#1A0E08;--bg2:#261508;
  --red:#8B1A1A;--red2:#5C0000;
  --bord:1px solid rgba(201,168,76,0.27);
  --bord2:1px solid rgba(201,168,76,0.53);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  /* iOS system fonts — no external deps */
  --fs:ui-serif,-apple-system-ui-serif,"Georgia",serif;
  --fd:"Georgia","Times New Roman",serif;
  --fn:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}
html,body{height:100%;overflow:hidden;background:#0D0806;overscroll-behavior:none}
body{font-family:var(--fs)}

.app{position:fixed;top:0;left:0;right:0;bottom:0;
  padding-top:var(--st);padding-bottom:var(--sb);
  padding-left:var(--sl);padding-right:var(--sr);
  background:var(--bg);color:var(--parch);
  display:flex;flex-direction:column;overflow:hidden}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(201,168,76,.04) 30px,rgba(201,168,76,.04) 31px),
             repeating-linear-gradient(90deg,transparent,transparent 30px,rgba(201,168,76,.04) 30px,rgba(201,168,76,.04) 31px)}

/* HEADER */
.hdr{background:linear-gradient(135deg,#3D0000,#8B1A1A 50%,#3D0000);
  border-bottom:2px solid var(--gold);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:10;flex-shrink:0}
.hdr::after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);
  color:var(--gold);font-size:13px;opacity:.6}
.hsub{font-size:10px;color:var(--gold-l);letter-spacing:2px;text-transform:uppercase;
  font-family:var(--fn)}
.htit{font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.hmese{font-family:var(--fn);font-size:11px;color:var(--gold-l);text-align:right}

/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:7px 10px;background:var(--bg2);
  border-bottom:var(--bord);position:relative;z-index:9;flex-shrink:0}
.hc{background:var(--bg2);border:var(--bord);border-radius:7px;padding:5px 7px;overflow:hidden;position:relative}
.hc::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hl{font-size:9px;color:var(--gold-l);letter-spacing:1px;text-transform:uppercase;
  font-family:var(--fn);margin-bottom:1px}
.hv{font-size:12px;font-weight:700;color:var(--parch);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-family:var(--fn)}
.hv.o{color:var(--gold)}.hv.v{color:#5DBB63}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  position:relative;z-index:1}
.main::-webkit-scrollbar{display:none}
.pad{padding:12px 12px 24px}

/* BOTTOM NAV */
.nav{display:flex;border-top:var(--bord);background:var(--bg2);
  position:relative;z-index:10;flex-shrink:0}
.nb{flex:1;padding:8px 2px calc(8px + 2px);font-size:9px;color:rgba(201,168,76,.5);
  background:none;border:none;border-top:2px solid transparent;
  cursor:pointer;font-family:var(--fn);letter-spacing:.2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
.nb.on{color:var(--gold);border-top-color:var(--gold)}
.nb-off{opacity:.32;filter:grayscale(.6)}
.nbi{font-size:19px;line-height:1}

/* CARD */
.card{background:linear-gradient(135deg,#261508,#2C1810);border:var(--bord);
  border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.27),var(--gold),rgba(201,168,76,.27),transparent)}
.ct{font-family:var(--fn);font-size:9px;font-weight:600;color:var(--gold);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.ct::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.27),transparent)}

/* BUTTONS */
.btn{padding:13px 16px;border-radius:10px;border:var(--bord2);
  background:linear-gradient(135deg,#3D1F0A,#2C1810);
  cursor:pointer;font-size:15px;font-family:var(--fn);
  color:var(--gold-l);font-weight:600;
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;
  -webkit-appearance:none;transition:opacity .1s}
.btn:active{opacity:.75}
.btn.pr{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--gold);border-color:var(--gold)}
.btn.gold{background:linear-gradient(135deg,var(--gold-d),#6B4F10);color:var(--bg);border-color:var(--gold);font-weight:700}
.btn.w{width:100%;margin-top:8px;display:flex}
.btn[disabled]{opacity:.35;pointer-events:none}

/* ACTION GRID */
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{padding:13px 11px;background:linear-gradient(135deg,#261508,#1A0E08);
  border:var(--bord);border-radius:12px;cursor:pointer;text-align:left;
  min-height:84px;display:flex;flex-direction:column;justify-content:space-between;
  -webkit-appearance:none}
.ab:active{opacity:.7}
.ab[disabled]{opacity:.35;pointer-events:none}
.ic{font-size:22px;margin-bottom:4px}
.at{font-size:13px;font-weight:700;color:var(--gold-l);font-family:var(--fn)}
.ac{font-size:11px;color:rgba(201,168,76,.6);margin-top:2px;font-family:var(--fn);line-height:1.3}
.ab.red .at{color:#E05555}

/* STAT ROWS */
.sr{display:flex;align-items:center;gap:6px;margin:5px 0}
.sl{font-size:12px;color:rgba(201,168,76,.6);width:128px;flex-shrink:0;font-family:var(--fn)}
.ds{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;background:#3D1F0A;border:1px solid #5C3D2E}
.dot.on{background:var(--gold);border-color:var(--gold)}
.dot.fire{background:#E05555;border-color:#E05555}
.sn{font-size:12px;color:rgba(201,168,76,.6);margin-left:3px}

/* MARKET ITEMS */
.mi{display:flex;gap:10px;padding:12px;background:#1A0E08;
  border:var(--bord);border-radius:12px;margin-bottom:8px}
.mi-name{font-size:13px;font-weight:700;color:var(--gold-l);
  font-family:var(--fn);margin-bottom:4px}
.mi-cost{font-size:12px;color:var(--gold);font-weight:700}

/* LOG */
.le{font-size:13px;color:rgba(201,168,76,.5);padding:6px 0;
  border-bottom:1px solid rgba(201,168,76,.1);line-height:1.5;font-family:var(--fn)}
.le:last-child{border-bottom:none}
.le.red{color:#E05555}.le.grn{color:#5DBB63}.le.inf{color:var(--gold-l)}

/* BADGES */
.bdg{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;font-family:var(--fn)}
.bdg.r{background:rgba(139,26,26,.27);color:#E05555;border:1px solid rgba(224,85,85,.27)}
.bdg.g{background:rgba(26,74,26,.27);color:#5DBB63;border:1px solid rgba(93,187,99,.27)}
.bdg.o{background:rgba(107,73,16,.27);color:var(--gold);border:1px solid rgba(201,168,76,.27)}

/* MONTH TRACK */
.mt{display:flex;gap:4px;margin-bottom:12px}
.md{flex:1;padding:7px 2px;text-align:center;font-size:9px;border-radius:7px;
  background:#1A0E08;color:#5C3D2E;border:var(--bord);font-family:var(--fn);font-weight:600}
.md.done{background:var(--gold-d);color:var(--gold);border-color:var(--gold)}
.md.cur{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--gold);
  border-color:var(--gold);font-weight:800}

/* BARS */
.pb{height:6px;background:#261508;border-radius:3px;overflow:hidden;margin-top:4px}
.pf{height:100%;border-radius:3px;transition:width .4s}
.pfm{background:linear-gradient(90deg,#2E7D32,#5DBB63)}
.pfd{background:linear-gradient(90deg,#185FA5,#378ADD)}

/* MOSSA BAR */
.mbar{position:relative;height:64px;background:#1A0E08;border-radius:12px;
  overflow:hidden;cursor:pointer;margin:12px 0;border:var(--bord2)}
.mz{position:absolute;top:0;height:100%;background:rgba(26,74,26,.53)}
.mt2{position:absolute;top:0;width:4px;height:100%;background:#5DBB63}
.mcu{position:absolute;top:10px;width:8px;height:44px;background:var(--red);border-radius:4px}

/* INTRO */
.intro-bg{text-align:center;padding:24px 12px}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc2{padding:13px;background:#1A0E08;border:var(--bord);border-radius:12px;
  cursor:pointer;text-align:left}
.cc2:active{opacity:.7}
.cc2.sel{border:2px solid var(--gold);background:#261508}
.cc2-name{font-size:14px;font-weight:700;color:var(--gold);font-family:var(--fn)}
.cc2-desc{font-size:11px;color:rgba(201,168,76,.6);margin-top:3px;
  font-family:var(--fn);line-height:1.4}

/* RACE */
.cr-line{padding:7px 10px;border-radius:7px;margin:2px 0;font-size:13px;
  display:flex;align-items:center;gap:6px;font-family:var(--fn)}
.cr-line.p1{background:rgba(107,73,16,.13);color:var(--gold);font-weight:700}
.cr-line.pp{background:rgba(24,95,165,.13);color:#7BC8FF;font-weight:700}
.cr-line.def{background:rgba(26,14,8,.53);color:rgba(201,168,76,.5)}
.batt-box{background:#1A0E08;border-radius:8px;padding:10px 13px;margin-bottom:8px;border:var(--bord)}
.batt-nome{font-size:13px;color:var(--parch);padding:5px 0;
  border-bottom:1px solid rgba(201,168,76,.1);font-family:var(--fn)}
.batt-nome:last-child{border-bottom:none}
.batt-nome.tu{color:var(--gold);font-weight:700}

/* EVBOX */
.evbox{font-size:13px;padding:11px 13px;border-radius:10px;margin:8px 0;
  font-family:var(--fn);border-left:3px solid;line-height:1.5}
.evbox.red{background:rgba(139,26,26,.13);color:#E05555;border-color:#E05555}
.evbox.grn{background:rgba(26,74,26,.13);color:#5DBB63;border-color:#5DBB63}
.evbox.inf{background:rgba(24,95,165,.13);color:#7BC8FF;border-color:#378ADD}

/* DECO LINE */
.deco{display:flex;align-items:center;gap:8px;margin:12px 0;
  color:rgba(201,168,76,.27);font-size:12px;font-family:var(--fn)}
.deco::before,.deco::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.27))}

/* BIG SCORE */
.score-big{font-family:var(--fn);font-size:56px;font-weight:800;color:var(--gold);
  text-align:center;padding:10px 0;letter-spacing:-1px}
.result-banner{padding:16px;text-align:center;border-radius:12px;
  background:linear-gradient(135deg,rgba(139,26,26,.2),rgba(61,0,0,.4));
  border:var(--bord2);margin-bottom:12px}

/* TRAIN BUTTONS */
.train-btn{width:100%;text-align:left;padding:14px 13px;border-radius:10px;
  border:var(--bord);background:linear-gradient(135deg,#261508,#1A0E08);
  cursor:pointer;font-family:var(--fn);margin-bottom:7px;min-height:60px;
  display:block;-webkit-appearance:none}
.train-btn:active{opacity:.7}
.train-btn[disabled]{opacity:.4;pointer-events:none}
.train-title{font-weight:700;font-size:14px;color:var(--gold-l)}
.train-desc{font-size:12px;color:rgba(201,168,76,.6);margin-top:3px}
.train-desc.cap{color:#E05555}

/* RANGE */
input[type=range]{accent-color:var(--gold);height:32px;width:100%}

.sc{display:none}.sc.on{display:block}

/* iOS install hint */
.install-hint{font-size:11px;color:#5C3D2E;margin-top:20px;line-height:1.6;
  padding:10px;border-radius:8px;border:var(--bord);background:rgba(201,168,76,.04)}

/* RACE TRACK */
.race-wrap{background:#1A0E08;border:var(--bord2);border-radius:14px;padding:12px;margin-bottom:12px}
.race-canvas{width:100%;display:block}
.race-lap-info{text-align:center;font-family:var(--fn);font-size:13px;color:var(--gold);margin-bottom:6px;font-weight:700;letter-spacing:1px}
.race-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px}
.race-leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(201,168,76,.7);font-family:var(--fn)}
.race-pos-list{margin-top:8px}
.race-pos-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(201,168,76,.08);font-size:12px;font-family:var(--fn)}
.race-pos-row:last-child{border-bottom:none}

/* TOAST NOTIFICATION */
.toast{position:fixed;top:calc(var(--st) + 80px);left:50%;transform:translateX(-50%);
  z-index:999;padding:12px 20px;border-radius:12px;font-family:var(--fn);
  font-size:14px;font-weight:700;text-align:center;min-width:200px;
  border:var(--bord2);pointer-events:none;
  animation:toastIn .3s ease,toastOut .4s ease 2.1s forwards}
.toast.grn{background:rgba(26,74,26,.95);color:#5DBB63;border-color:#5DBB63}
.toast.red{background:rgba(139,26,26,.95);color:#E05555;border-color:#E05555}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
/* FRIENDSHIP BAR */
.ami-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.ami-label{font-size:12px;color:rgba(201,168,76,.7);width:110px;flex-shrink:0;font-family:var(--fn)}
.ami-bar{flex:1;height:8px;background:#261508;border-radius:4px;overflow:hidden;border:var(--bord)}
.ami-fill{height:100%;border-radius:4px;transition:width .4s}
.ami-val{font-size:11px;color:rgba(201,168,76,.6);width:28px;text-align:right;font-family:var(--fn)}
/* SLOT BUTTONS */
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.slot-btn{padding:12px 6px;border-radius:10px;border:var(--bord2);
  background:linear-gradient(135deg,#261508,#1A0E08);cursor:pointer;
  font-family:var(--fn);text-align:center;min-height:60px}
.slot-btn:active{opacity:.75}
.slot-btn.occ{border-color:var(--gold)}
.slot-num{font-size:16px;font-weight:700;color:var(--gold)}
.slot-info{font-size:10px;color:rgba(201,168,76,.5);margin-top:3px}
/* ── FANTINO CAREER ── */
.fnt-bar-wrap{margin:6px 0}
.fnt-bar-label{font-size:10px;color:rgba(201,168,76,.6);letter-spacing:1px;text-transform:uppercase;font-family:var(--fn);margin-bottom:3px;display:flex;justify-content:space-between}
.fnt-bar{height:10px;background:#1A0E08;border-radius:5px;overflow:hidden;border:var(--bord)}
.fnt-bar-fill{height:100%;border-radius:5px;transition:width .4s}
.fnt-bar-green{background:linear-gradient(90deg,#2E7D32,#5DBB63)}
.fnt-bar-blue{background:linear-gradient(90deg,#185FA5,#378ADD)}
.fnt-bar-gold{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.fnt-star-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.fnt-star-label{font-size:12px;color:rgba(201,168,76,.6);width:140px;flex-shrink:0;font-family:var(--fn)}
.fnt-stars{display:flex;gap:3px}
.fnt-star{width:16px;height:16px;border-radius:50%;background:#1A0E08;border:1px solid #5C3D2E}
.fnt-star.on{background:var(--gold);border-color:var(--gold)}
.career-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.career-card.cc-solo{grid-column:1/-1;max-width:calc(50% - 6px);margin:0 auto}
.career-card{padding:16px;background:linear-gradient(135deg,#261508,#1A0E08);border:var(--bord2);border-radius:14px;cursor:pointer;text-align:center}
.career-card:active{opacity:.75}
.career-card .cc-icon{font-size:36px;margin-bottom:8px}
.career-card .cc-title{font-family:var(--fn);font-size:15px;font-weight:700;color:var(--gold);margin-bottom:4px}
.career-card .cc-desc{font-size:11px;color:rgba(201,168,76,.5);line-height:1.5}


.fpip-row{display:flex;align-items:center;gap:6px}
.fpip{width:13px;height:13px;border-radius:50%;background:#1A0E08;border:1px solid #5C3D2E}
.fpip.grn{background:#5DBB63;border-color:#5DBB63}
.fpip.blu{background:#378ADD;border-color:#378ADD}
.fpip-label{font-size:10px;color:rgba(201,168,76,.5);font-family:var(--fn);letter-spacing:.5px}

/* POLITICA: bottone azione attivo */
.pol-action-btn.pol-active{border:2px solid var(--gold);background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(107,73,16,.35));}
.pol-action-btn.pol-active .at{color:var(--gold)}
</style>
</head>
<body>
<div class="app" id="APP">
<div class="hdr">
  <div><div class="hsub" id="H_ANNO">Palio di Legnano</div><div class="htit" id="H_NOME">Scegli la Contrada</div></div>
  <div class="hmese" id="H_MESE"></div>
</div>
<div class="hud" id="HUD" style="display:none">
  <div class="hc"><div class="hl">Oro</div><div class="hv o" id="HO">—</div></div>
  <div class="hc"><div class="hl">Morale</div><div class="hv v" id="HM">—</div></div>
  <div class="hc"><div class="hl">Cavallo</div><div class="hv" id="HC">—</div></div>
  <div class="hc"><div class="hl">Fantino</div><div class="hv" id="HF">—</div></div>
</div>
<div class="main" id="MAIN">
<div class="pad">
<div class="sc on" id="sc-mese">
  <div class="mt" id="MTRACK"></div>
  <div class="card">
    <div class="ct">Azioni mensili</div>
    <div class="ag" id="MAZIONI"></div>
    <div id="EVBOX"></div>
    <button class="btn pr w" id="BTN_AV" onclick="avanzaMese()">Passa al mese successivo →</button>
    <button class="btn w" onclick="salva();renderIntro()" style="margin-top:4px;border-color:rgba(201,168,76,.27);color:rgba(201,168,76,.6)">🏠 Salva e torna ad Home</button>
  </div>
  <div class="card">
    <div class="ct">Stato della contrada</div>
    <div style="font-family:var(--fn);font-size:9px;color:rgba(201,168,76,.6);letter-spacing:1px;margin-bottom:3px">MORALE</div>
    <div class="pb"><div class="pf pfm" id="BM"></div></div>
    <div style="font-family:var(--fn);font-size:9px;color:rgba(201,168,76,.6);letter-spacing:1px;margin-top:8px;margin-bottom:3px">DIFESA STALLA</div>
    <div class="pb"><div class="pf pfd" id="BD"></div></div>
  </div>
</div>
<div class="sc" id="sc-stalla">
  <div class="card" id="CARD_CAV"></div>
  <div class="card" id="CARD_FAN"></div>
</div>
<div class="sc" id="sc-mercato">
  <div class="card"><div class="ct">Cavalli disponibili</div><div id="MKT_C"></div></div>
</div>
<div class="sc" id="sc-fantini">
  <div class="card"><div class="ct">Fantini sul mercato</div><div id="FNT_MKT"></div></div>
</div>
<div class="sc" id="sc-log">
  <div class="card"><div class="ct">Albo d'Oro — Palii per Anno</div><div id="LOGL"></div></div>
</div>
<div class="sc" id="sc-politica">
  <div class="card"><div class="ct">Scegli il bersaglio</div><div id="POL_B"></div></div>
  <div class="card">
    <div class="ct">Tipo di azione</div>
    <div class="ag">
      <button id="POL_BTN_SCHERZO" class="ab red pol-action-btn" onclick="setPT('SCHERZO')"><div class="ic">🎨</div><div class="at">Scherzo</div><div class="ac">-15 morale avversario</div></button>
      <button id="POL_BTN_IMBOSCATA" class="ab red pol-action-btn" onclick="setPT('IMBOSCATA')"><div class="ic">🌶️</div><div class="at">Imboscata</div><div class="ac">+nervosismo cavallo</div></button>
    </div>

// ── AMICIZIA ──
function inizAmicizia(){
  if(!G)return;
  G.amicizia={};
  Object.keys(CDB).forEach(k=>{
    if(k===G.nome)return;
    G.amicizia[k]= k===G.nemica ? 0 : rnd(30,70);
  });
}

// ── ASSEGNAZIONE CAVALLI DA DB ──
// Assegna un cavallo dal database a ciascuna delle 7 contrade avversarie.
// I cavalli in stalla del giocatore vengono esclusi dall'assegnazione IA.
// I rimanenti vanno nel pool dei cavalli svincolati (disponibili per mercato).
function assegnaCavalliIAAnno(){
  if(!G)return;
  // Nomi cavalli attualmente in stalla del giocatore
  const nomeCavalliPlayer=(G.stalla||[]).map(c=>c.nome);
  // Tutti i cavalli del DB che non sono in stalla del giocatore
  const disponibili=CAVALLI_DB.filter(c=>!nomeCavalliPlayer.includes(c.nome));
  // Mescola casualmente
  const shuffled=[...disponibili].sort(()=>Math.random()-.5);
  // 7 contrade avversarie
  const altreContrade=Object.keys(CDB).filter(k=>k!==G.nome);
  CAVALLI_IA={};
  altreContrade.forEach((k,i)=>{
    if(shuffled[i])CAVALLI_IA[k]=shuffled[i];
  });
  // I rimanenti sono svincolati (non assegnati a nessuna contrada)
  const assegnati=new Set(Object.values(CAVALLI_IA).map(c=>c.nome));
  CAVALLI_SVINCOLATI=disponibili.filter(c=>!assegnati.has(c.nome)).map(c=>c.nome);
}

// Ottieni le stats base di un cavallo dal DB per nome
function getCavDB(nome){
  return CAVALLI_DB.find(c=>c.nome===nome)||null;
}
function modAmicizia(k,delta){
  if(!G||!G.amicizia)return;
  if(k===G.nome)return;
  G.amicizia[k]=clamp((G.amicizia[k]||0)+delta,0,100);
  if(G.amicizia[k]>=100)checkObiettivi('amicizia_100');
}
function nervosismoAmiziaBatteria(partecipanti){
  // avg amicizia delle contrade in batteria (escluso il giocatore)
  const altri=partecipanti.filter(n=>n!==G.nome);
  if(!altri.length)return;
  const avg=altri.reduce((s,n)=>s+(G.amicizia[n]||50),0)/altri.length;
  if(avg<=65&&G.cav){
    G.cav.ner=clamp(G.cav.ner+1,1,5);
    addLog('Clima teso in batteria (amicizia media '+Math.round(avg)+'): +1 nervosismo cavallo','red');
  }
}

function newFan(nome){const db=FANTINI_MAP[nome];const b=db?db.bravura:rnd(1,5),e=db?db.esp:rnd(1,5),m=db?db.mossa:rnd(1,5),em=db?db.emp:rnd(1,5);let c=Math.floor(((b+e+m+em)/4)*450*(0.9+Math.random()*.3));if(G&&G.bonus==="PRESTIGIO_STORICO")c=Math.floor(c*.8);return {nome,bravura:b,esp:e,mossa:m,emp:em,costo:c};}
function newCav(nome,elite=false){const v=elite?5:rnd(1,5),a=elite?5:rnd(1,5),t=elite?5:rnd(1,5),r=elite?5:rnd(1,5),n=elite?1:rnd(1,3);let val=Math.floor(((v+a+t+r)/4)*450);if(G&&G.bonus==="ALLEVAMENTO_TOP")val=Math.floor(val*.8);return {nome,vel:v,acc:a,ten:t,res:r,ner:n,valore:val,maxAcc:5,maxRes:5};}
function newIACav(){return {vel:rnd(2,5),acc:rnd(2,5),ten:rnd(2,5),res:rnd(2,5),ner:rnd(1,3)};}
function newIAFan(){return {bravura:rnd(2,5),esp:rnd(2,5),mossa:rnd(2,5),emp:rnd(2,5)};}
function genMkt(){
  // Usa cavalli dal DB non assegnati a contrade IA e non in stalla del giocatore
  const nomeCavalliPlayer=(G&&G.stalla||[]).map(c=>c.nome);
  const assegnatiIA=new Set(Object.values(CAVALLI_IA).map(c=>c.nome));
  const eligibili=CAVALLI_DB.filter(c=>!assegnatiIA.has(c.nome)&&!nomeCavalliPlayer.includes(c.nome));
  const selezionati=sample(eligibili,Math.min(5,eligibili.length));
  const c=selezionati.map(dbCav=>{
    let val=Math.floor(((dbCav.vel+dbCav.acc+dbCav.ten+dbCav.res)/4)*450);
    if(G&&G.bonus==='ALLEVAMENTO_TOP')val=Math.floor(val*.8);
    return {nome:dbCav.nome,vel:dbCav.vel,acc:dbCav.acc,ten:dbCav.ten,res:dbCav.res,ner:dbCav.ner,valore:val,maxAcc:5,maxRes:5};
  });
  return {c};
}

    if(G.raccoltaUsata)return;
    const g=G.bonus==='RACCOLTA_FONDI'?300:200;
    G.oro+=g;G.morale=clamp(G.morale-5,0,200);G.raccoltaUsata=true;
    addLog('Raccolta fondi +'+g+' oro','inf');showEv('✦ Raccolta fondi! +'+g+' oro, -5 morale','grn');
  } else if(tipo==='sicurezza'){
    if(G.sicurezzaUsata)return;
    if(G.oro<300){showEv('Oro insufficiente (300 necessari).','red');return;}
    G.oro-=300;G.difesa=clamp(G.difesa+2,0,5);G.sicurezzaUsata=true;
    addLog('Stalla rinforzata. Difesa +2','inf');showEv('✦ Stalla rinforzata! Difesa '+G.difesa+'/5','grn');
  }
  updHUD();renderMazioni();salva();
}

function doManiero(tipo){
  if(!G)return;
  if(G.condManiero===undefined)G.condManiero=60;
  const evEl=document.getElementById('MANIERO_EV');
  function showMev(msg,cls){if(evEl)evEl.innerHTML=`<div class="evbox ${cls}">${msg}</div>`;}
  if(tipo==='cena'){
    if(G.manieroOrganizzaCena)return;
    if(G.oro<100){showMev('Oro insufficiente (100 necessari).','red');return;}
    G.oro-=100;
    const cond=G.condManiero;
    const fatt=rf(0.8,1.2);
    const guad=Math.floor((G.morale-(100-cond))*8*fatt);
    const guadEff=Math.max(0,guad);
    G.oro+=guadEff;G.manieroOrganizzaCena=true;
    addLog('Organizza Cena al Maniero. −100 oro, guadagno '+guadEff+' oro','inf');
    showMev('🍷 Cena organizzata! −100 oro, +'+guadEff+' oro guadagnati','grn');
    checkObiettivi('cena_maniero');
    if(G.morale>=200)checkObiettivi('morale_200');
    // Popup guadagno cena
    updHUD();salva();
    mostraPopupGuadagnoManiero('🍷 Cena al Maniero',guadEff,'Incasso dalla cena con i contradaioli','cena_propiziatoria.png');
    return;
  } else if(tipo==='gadget'){
    if(G.manieroVenditaGadget)return;
    const guadBase=Math.floor(G.morale*(G.bonus==='GADGET_EXTRA'?3:2)*rf(.8,1.2));
    const guad=G.manieroGiornataAperta?Math.floor(guadBase*1.5):guadBase;
    G.oro+=guad;G.manieroVenditaGadget=true;
    addLog('Vendita Gadget al Maniero. +'+guad+' oro'+(G.manieroGiornataAperta?' (bonus Giornata Manieri Aperti x1,5)':''),'inf');
    showMev('💰 Gadget venduti! +'+guad+' oro'+(G.manieroGiornataAperta?' (bonus Giornata Manieri Aperti x1,5)':''),'grn');
    // Popup guadagno gadget
    updHUD();salva();
    mostraPopupGuadagnoManiero('💰 Vendita Gadget',guad,'Incasso dalla vendita dei gadget della contrada','vendita_gadget.png');
    return;
  } else if(tipo==='evento'){
    if(G.manieroOrganizzaEvento)return;
    apriMenuEvento();
    return;
  } else if(tipo==='manutenzione'){
    if(G.manieroManutenzione)return;
    if(G.oro<500){showMev('Oro insufficiente (500 necessari).','red');return;}
    G.oro-=500;G.condManiero=clamp(G.condManiero+20,0,100);
    G.morale=clamp(G.morale+5,0,200);G.manieroManutenzione=true;
    addLog('Manutenzione Maniero. −500 oro, +20 condizioni, +5 morale','inf');
    showMev('🔨 Manutenzione completata! −500 oro, +20 condizioni, +5 morale','grn');
    if(G.condManiero>=100)checkObiettivi('cond_maniero_100');
    if(G.morale>=200)checkObiettivi('morale_200');
  }
  updHUD();salva();
  // Ricostruisci overlay
  document.getElementById('MANIERO_OVERLAY').remove();
  apriManiero();
}

function eseguiEvento(tipo){
  if(!G)return;
  if(G.manieroOrganizzaEvento)return;
  const evEl=document.getElementById('MANIERO_EVENTO_EV');
  function showMev(msg,cls){if(evEl)evEl.innerHTML=`<div class="evbox ${cls}">${msg}</div>`;}
  if(tipo==='aperti'){
    if(G.oro<200){showMev('Oro insufficiente (200 necessari).','red');return;}
    G.oro-=200;G.condManiero=clamp(G.condManiero-15,0,100);
    G.manieroOrganizzaEvento=true;G.manieroGiornataAperta=true;
    addLog('Giornata Manieri Aperti. −200 oro, −15 condizioni','inf');
  } else if(tipo==='sagra'){
    if(G.oro<300){showMev('Oro insufficiente (300 necessari).','red');return;}
    const fatt=rf(0.8,1.2);
    const guadMorale=Math.round(20*fatt);
    G.oro-=300;G.condManiero=clamp(G.condManiero-20,0,100);
    G.morale=clamp(G.morale+guadMorale,0,200);
    G.manieroOrganizzaEvento=true;
    addLog('Sagra Medioevale. −300 oro, −20 condizioni, +'+guadMorale+' morale','inf');
  } else if(tipo==='streetfood'){
    if(G.oro<500){showMev('Oro insufficiente (500 necessari).','red');return;}
    const fatt=rf(0.8,1.2);
    const guadMorale=Math.round(50*fatt);
    G.oro-=500;
    G.morale=clamp(G.morale+guadMorale,0,200);
    G.manieroOrganizzaEvento=true;
    addLog('Street Food. −500 oro, +'+guadMorale+' morale','inf');
  } else return;
  checkObiettivi('evento_maniero');
  if(G.morale>=200)checkObiettivi('morale_200');
  updHUD();salva();
  const subOv=document.getElementById('MANIERO_EVENTO_OVERLAY');
  if(subOv)subOv.remove();
  const manieroOv=document.getElementById('MANIERO_OVERLAY');
  if(manieroOv)manieroOv.remove();
  apriManiero();
}

function avanzaMese(){
  if(!G)return;
  if(G.mi===4){showSceltaCavallo();return;}
  if(G.difesa>0)G.difesa--;
  G.oro+=100;G.raccoltaUsata=false;G.cenaUsata=false;G.sicurezzaUsata=false;
  // Ricalcola il prezzo di vendita dei cavalli ogni mese
  if(G.stalla)G.stalla.forEach(c=>{c.valoreVendita=calcPrezzoVendita(c);});
  // Reset flag mensili maniero
  G.manieroOrganizzaCena=false;G.manieroVenditaGadget=false;G.manieroOrganizzaEvento=false;G.manieroManutenzione=false;G.manieroGiornataAperta=false;
  // Degrado mensile condizioni maniero
  if(G.condManiero===undefined)G.condManiero=60;
  G.condManiero=clamp(G.condManiero-5,0,100);
  const attaccato=Math.random()<.3&&G.difesa<3;
  let msg='Mese tranquillo. +100 oro.',tipo='inf';
  if(attaccato){
    if(Math.random()<.5){
      G.morale=clamp(G.morale-25,0,200);msg='Scherzo da parte di '+G.nemica+'! −25 morale';tipo='red';
      modPrestigio(-5,'Subìto scherzo nemico');
    } else if(G.stalla&&G.stalla.length){
      G.stalla[G.cavSelIdx||0].ner=clamp(G.stalla[G.cavSelIdx||0].ner+1,1,5);
      msg='Scherzo nemico! +1 nervosismo al cavallo';tipo='red';
      modPrestigio(-5,'Subìto scherzo nemico');
    }
  } else if(!G.eventoUsato){
    const r=Math.random();
    if(r<.15){G.oro+=800;msg='Un ex contradaiolo invia 800 oro!';tipo='grn';G.eventoUsato=true;}
    else if(r<.28&&G.fan){G.fan.bravura=clamp(G.fan.bravura-1,1,5);msg='Il fantino ha l\'influenza! −1 bravura';tipo='red';G.eventoUsato=true;}
    else if(r<.38){G.oro=Math.max(0,G.oro-600);msg='Multa per cena proibita! −600 oro';tipo='red';G.eventoUsato=true;}
    else if(r<.48){G.condManiero=0;msg='Il maniero è crollato! Condizioni maniero a 0!';tipo='red';G.eventoUsato=true;}
    else if(r<.58&&G.fan){const nomeFant=G.fan.nome;G.fan=null;msg='Il fantino '+nomeFant+' si è licenziato dalla stalla!';tipo='red';G.eventoUsato=true;G._fantinoLascia=nomeFant;}
  }
  addLog(msg,tipo);
  G._eventoMese = attaccato || (msg !== 'Mese tranquillo. +100 oro.') ? {msg, tipo} : null;
  G.mi++;MKT=genMkt();updHUD();salva();
  // Mostra Gazzetta all'inizio del nuovo mese
  mostraGazzetta(()=>{renderMtrack();renderMazioni();showEv(msg,tipo);});
}

// ── STALLA (multi cavallo) ──
function renderStalla(){
  if(!G)return;
  const cv=R('CARD_CAV'),cf=R('CARD_FAN');
  if(!G.stalla)G.stalla=G.cav?[G.cav]:[];
  if(G.stalla.length){
    let html='<div class="ct">I tuoi destrieri</div>';
    G.stalla.forEach((c,idx)=>{
      const accAtMax=c.acc>=c.maxAcc,resAtMax=c.res>=c.maxRes;
      const costoAll=G.bonus==='SCUDERIA_ELITE'?200:400;
      const eta=c.maxAcc<5||c.maxRes<5?`<div style="font-size:11px;color:#E05555;margin-bottom:6px">⚠ ${5-Math.min(c.maxAcc,c.maxRes)} anno/i — acc e res al massimo attuale.</div>`:'';
      const _dbCavS=getCavDB(c.nome);const _imgSrcS=_dbCavS&&_dbCavS.img?_dbCavS.img:'';const _imgHtmlS=_imgSrcS?`<img src="${_imgSrcS}" alt="${c.nome}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='🐎'">`:' 🐎';
      html+=`<div style="border:var(--bord);border-radius:10px;padding:12px;margin-bottom:10px;background:#1A0E08">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
          <div style="width:72px;height:72px;flex-shrink:0;border-radius:8px;overflow:hidden;border:var(--bord);background:#1A0E08;display:flex;align-items:center;justify-content:center;font-size:28px">${_imgHtmlS}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold)">${c.nome}</div>
              <button class="btn" style="font-size:11px;padding:5px 10px" onclick="vendiCav(${idx})">Vendi (${c.valoreVendita!==undefined?c.valoreVendita:(c.valoreVendita=calcPrezzoVendita(c))} oro)</button>
            </div>
            ${eta}
          </div>
        </div>
        ${sRow('Velocità',c.vel)}${sRowCapped('Accelerazione',c.acc,c.maxAcc)}
        ${sRow('Tenuta curva',c.ten)}${sRowCapped('Resistenza',c.res,c.maxRes)}
        ${sRow('Nervosismo',c.ner,5,true)}
        <div style="font-size:10px;color:rgba(201,168,76,.5);margin-top:8px;margin-bottom:4px;font-family:var(--fn);letter-spacing:1px;text-transform:uppercase">Allenamento · ${costoAll} oro</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button class="train-btn" onclick="allena('forza',${idx})"><div class="train-title">Forza pura</div><div class="train-desc">+1 Velocità, +1 Nervosismo</div></button>
          <button class="train-btn" ${accAtMax?'disabled':''} onclick="allena('controllo',${idx})"><div class="train-title">Controllo e ritmo</div><div class="train-desc ${accAtMax?'cap':''}">${accAtMax?'Accelerazione al massimo ('+c.maxAcc+')':'+1 Accelerazione, −1 Nervosismo'}</div></button>
          <button class="train-btn" ${resAtMax?'disabled':''} onclick="allena('fondo',${idx})"><div class="train-title">Fondo e curve</div><div class="train-desc ${resAtMax?'cap':''}">${resAtMax?'Resistenza al massimo ('+c.maxRes+')':'+1 Tenuta curva, +1 Resistenza'}</div></button>
        </div>
      </div>`;
    });
    cv.innerHTML=html;
  } else {
    cv.innerHTML='<div class="ct">I tuoi destrieri</div><div style="font-size:14px;color:rgba(201,168,76,.5)">Nessun cavallo in stalla. Vai al mercato.</div>';
  }
  if(G.fan){
    const f=G.fan;
    cf.innerHTML=`<div class="ct">Il tuo fantino</div>
      <div style="font-family:var(--fn);font-size:16px;font-weight:700;color:var(--gold);margin-bottom:10px">${f.nome}</div>
      ${sRow('Bravura',f.bravura)}${sRow('Esperienza',f.esp)}
      ${sRow('Gestione mossa',f.mossa)}${sRow('Empatia',f.emp)}
      <button class="btn w" onclick="licFan()">Licenzia fantino</button>`;
  } else {
    cf.innerHTML='<div class="ct">Il tuo fantino</div><div style="font-size:14px;color:rgba(201,168,76,.5)">Nessun fantino. Vai al menù Fantini.</div>';
  }
}

function allena(tipo,idx){
  if(!G.stalla||!G.stalla[idx])return;
  const costoAll=G.bonus==='SCUDERIA_ELITE'?200:400;
  if(G.oro<costoAll){showToast('Oro insufficiente!','red');return;}
  // Mostra minigioco allenamento prima di applicare effetti
  mostraMinigioco(tipo,idx,costoAll);
}

// ── MINIGIOCO ALLENAMENTO ──
function mostraMinigioco(tipo,idx,costoAll){
  const MOSSE=['🥕','⚡','🏇','🍏','🍎','🐎'];
  const NMOVES=6;
  const seqLen=5; // 5 pallini
  // Genera sequenza random di 6 mosse usando i 5 pallini come "colori" (3 colori ciascuno con un simbolo)
  const sequenza=[];
  for(let i=0;i<NMOVES;i++) sequenza.push(Math.floor(Math.random()*MOSSE.length));

  const titoliTipo={forza:'Forza Pura 💪',controllo:'Controllo e Ritmo 🎯',fondo:'Fondo e Curve 🏇'};
  const overlay=document.createElement('div');
  overlay.id='MINIGIOCO_OVL';
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px';

  overlay.innerHTML=`
    <div id="MG_BOX" style="background:linear-gradient(135deg,#261508,#3D1F0A);border:2px solid var(--gold);border-radius:18px;padding:20px;max-width:340px;width:100%;position:relative;box-shadow:0 0 50px rgba(201,168,76,.25);transition:border-color .5s,box-shadow .5s">
      <div style="text-align:center;margin-bottom:4px">
        <div style="font-size:26px">🏋️</div>
        <div style="font-family:var(--fn);font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.5px;margin-top:4px">Minigioco Allenamento</div>
        <div style="font-size:11px;color:rgba(201,168,76,.5);margin-top:2px;font-family:var(--fn)">${titoliTipo[tipo]||tipo} — Costo: ${costoAll} oro</div>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0"></div>

      <div id="MG_PHASE_SHOW" style="">
        <div style="font-family:var(--fn);font-size:12px;color:var(--gold-l);text-align:center;margin-bottom:10px">Osserva la combinazione!</div>
        <div style="display:flex;justify-content:center;gap:10px;margin-bottom:14px" id="MG_DOTS"></div>
        <div style="text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center">
          <div id="MG_CUR_MOVE" style="font-size:44px;opacity:0;transition:opacity .2s"></div>
        </div>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(201,168,76,.4);text-align:center;margin-top:8px" id="MG_SHOW_STATUS">Preparati…</div>
      </div>

      <div id="MG_PHASE_PLAY" style="display:none">
        <div style="font-family:var(--fn);font-size:12px;color:var(--gold-l);text-align:center;margin-bottom:10px">Replica la sequenza!</div>
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:12px" id="MG_REPLAY_DOTS"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px" id="MG_BTNS"></div>
        <div style="font-family:var(--fn);font-size:11px;color:rgba(201,168,76,.4);text-align:center" id="MG_PLAY_STATUS">Mossa 1 di ${NMOVES}</div>
      </div>

      <div id="MG_PHASE_RESULT" style="display:none;text-align:center">
        <div style="font-size:42px;margin-bottom:6px" id="MG_RES_ICON"></div>
        <div style="font-family:var(--fn);font-size:17px;font-weight:800;margin-bottom:8px" id="MG_RES_TITLE"></div>
        <div style="font-size:13px;color:var(--parch2);line-height:1.6;padding:10px;background:rgba(0,0,0,.2);border-radius:10px;border-left:3px solid #888;margin-bottom:14px" id="MG_RES_MSG" style="border-left-color:#888"></div>
        <button id="MG_CLOSE_BTN" class="btn gold w">Continua →</button>
      </div>
    </div>`;

  document.getElementById('APP').appendChild(overlay);

  // ─ Fase 1: mostra la sequenza ─
  const dotsEl=document.getElementById('MG_DOTS');
  const curMoveEl=document.getElementById('MG_CUR_MOVE');
  const showStatusEl=document.getElementById('MG_SHOW_STATUS');

  // Crea 5 pallini "indicatori" per la fase di show
  for(let i=0;i<seqLen;i++){
    const d=document.createElement('div');
    d.style.cssText='width:16px;height:16px;border-radius:50%;background:#1A0E08;border:1.5px solid #5C3D2E;transition:background .2s,border-color .2s';
    d.id='MG_DOT_'+i;
    dotsEl.appendChild(d);
  }

  let showIdx=0;
  function illuminaDot(i){
    // Accende un pallino alla volta (colore basato sull'indice move)
    const colors=['#C9A84C','#5DBB63','#378ADD','#E05555','#B07BD4','#FF9B30'];
    document.getElementById('MG_DOT_'+i).style.background=colors[sequenza[showIdx]];
    document.getElementById('MG_DOT_'+i).style.borderColor=colors[sequenza[showIdx]];
  }

  function mostraMossaIdx(moveIdx){
    if(moveIdx>=NMOVES){
      // Fine sequenza, mostra bottoni giocatore
      // Spegni tutti i dot dopo una pausa
      setTimeout(()=>{
        document.getElementById('MG_PHASE_SHOW').style.display='none';
        mostraFaseGioco();
      },500);
      return;
    }
    showStatusEl.textContent='Mossa '+(moveIdx+1)+' di '+NMOVES;
    const dotIdx=moveIdx%seqLen; // mapping 6 mosse → 5 pallini ciclicamente
    // Spegni il pallino precedente (se non è il primo)
    if(moveIdx>0){
      const prevDot=document.getElementById('MG_DOT_'+(((moveIdx-1)%seqLen)));
      // Non spegnere se stessa posizione (in caso di ciclo)
      if((moveIdx-1)%seqLen !== dotIdx || moveIdx<seqLen){
        // Lascia accesi per 6 mosse su 5 pallini: il 5° pallino flasherà due volte
      }
    }
    // Accendi il pallino corrente
    const colors=['#C9A84C','#5DBB63','#378ADD','#E05555','#B07BD4','#FF9B30'];
    // Prima spegni tutti i dot
    for(let i=0;i<seqLen;i++){
      const d=document.getElementById('MG_DOT_'+i);
      if(d){d.style.background='#1A0E08';d.style.borderColor='#5C3D2E';}
    }
    // Accendi quello corrente
    const d=document.getElementById('MG_DOT_'+dotIdx);
    if(d){d.style.background=colors[sequenza[moveIdx]];d.style.borderColor=colors[sequenza[moveIdx]];}
    // Mostra simbolo
    curMoveEl.style.opacity='0';
    setTimeout(()=>{
      curMoveEl.textContent=MOSSE[sequenza[moveIdx]];
      curMoveEl.style.opacity='1';
      setTimeout(()=>{
        curMoveEl.style.opacity='0';
        setTimeout(()=>mostraMossaIdx(moveIdx+1),200);
      },650);
    },100);
  }

  // Avvia sequenza dopo breve pausa
  setTimeout(()=>mostraMossaIdx(0),700);

  // ─ Fase 2: giocatore replica ─
  let playerSeq=[];
  function mostraFaseGioco(){
    document.getElementById('MG_PHASE_PLAY').style.display='';
    const replayDots=document.getElementById('MG_REPLAY_DOTS');
    const btnsEl=document.getElementById('MG_BTNS');
    const playStatus=document.getElementById('MG_PLAY_STATUS');

    // Crea dot di progresso giocatore
    replayDots.innerHTML='';
    for(let i=0;i<NMOVES;i++){
      const d=document.createElement('div');
      d.style.cssText='width:14px;height:14px;border-radius:50%;background:#1A0E08;border:1.5px solid #5C3D2E;transition:background .15s';
      d.id='MG_PDOT_'+i;
      replayDots.appendChild(d);
    }

    // Crea bottoni per le mosse
    btnsEl.innerHTML='';
    const colors=['#C9A84C','#5DBB63','#378ADD','#E05555','#B07BD4','#FF9B30'];
    MOSSE.forEach((m,i)=>{
      const b=document.createElement('button');
      b.style.cssText=`padding:12px 6px;border-radius:10px;border:1.5px solid ${colors[i]};background:rgba(0,0,0,.3);
        cursor:pointer;font-size:26px;font-family:var(--fn);text-align:center;min-height:54px;
        transition:transform .1s,background .1s;-webkit-appearance:none`;
      b.textContent=m;
      b.onclick=()=>registraMossa(i);
      btnsEl.appendChild(b);
    });

    function registraMossa(moveIdx){
      const step=playerSeq.length;
      playerSeq.push(moveIdx);
      // Feedback visivo dot
      const pd=document.getElementById('MG_PDOT_'+step);
      if(pd){pd.style.background=colors[moveIdx];pd.style.borderColor=colors[moveIdx];}
      if(playerSeq.length<NMOVES){
        playStatus.textContent='Mossa '+(playerSeq.length+1)+' di '+NMOVES;
      } else {
        // Valuta risultato
        btnsEl.querySelectorAll('button').forEach(b2=>b2.disabled=true);
        const vinto=playerSeq.every((v,i)=>v===sequenza[i]);
        setTimeout(()=>mostraRisultato(vinto),300);
      }
    }
  }

  // ─ Fase 3: risultato ─
  function mostraRisultato(vinto){
    document.getElementById('MG_PHASE_PLAY').style.display='none';
    document.getElementById('MG_PHASE_RESULT').style.display='';
    const mgBox=document.getElementById('MG_BOX');
    const resIcon=document.getElementById('MG_RES_ICON');
    const resTitle=document.getElementById('MG_RES_TITLE');
    const resMsg=document.getElementById('MG_RES_MSG');

    const c=G.stalla[idx];
    // Scala budget (costoAll è già 200 per San Domenico/SCUDERIA_ELITE, 400 per gli altri)
    const effCosto=costoAll;
    G.oro-=effCosto;

    if(vinto){
      mgBox.style.borderColor='#5DBB63';
      mgBox.style.boxShadow='0 0 50px rgba(93,187,99,.35)';
      resIcon.textContent='🏆';
      resTitle.style.color='#5DBB63';
      resTitle.textContent='Allenamento Riuscito!';
      let descMiglioramento='';
      if(tipo==='forza'){c.vel=clamp(c.vel+1,1,5);c.ner=clamp(c.ner+1,1,5);descMiglioramento='+1 Velocità, +1 Nervosismo';addLog('Allenamento Forza su '+c.nome+' (minigioco vinto)','grn');}
      else if(tipo==='controllo'){c.acc=clamp(c.acc+1,1,c.maxAcc);c.ner=clamp(c.ner-1,1,5);descMiglioramento='+1 Accelerazione, −1 Nervosismo';addLog('Allenamento Controllo su '+c.nome+' (minigioco vinto)','grn');}
      else if(tipo==='fondo'){c.ten=clamp(c.ten+1,1,5);c.res=clamp(c.res+1,1,c.maxRes);descMiglioramento='+1 Tenuta curva, +1 Resistenza';addLog('Allenamento Fondo su '+c.nome+' (minigioco vinto)','grn');}
      c.valoreVendita=calcPrezzoVendita(c);
      resMsg.style.borderLeftColor='#5DBB63';
      resMsg.innerHTML=`Il cavallo <strong>${c.nome}</strong> ha risposto magnificamente all'allenamento!<br><span style="color:#5DBB63;font-weight:700">${descMiglioramento}</span><br><span style="font-size:11px;color:rgba(201,168,76,.5)">−${effCosto} oro</span>`;
    } else {
      mgBox.style.borderColor='#E05555';
      mgBox.style.boxShadow='0 0 50px rgba(224,85,85,.3)';
      resIcon.textContent='😤';
      resTitle.style.color='#E05555';
      resTitle.textContent='Allenamento Fallito!';
      addLog('Allenamento '+tipo+' su '+c.nome+' fallito (minigioco perso) — budget scalato','red');
      resMsg.style.borderLeftColor='#E05555';
      resMsg.innerHTML=`<strong>${c.nome}</strong> non ha eseguito correttamente gli esercizi. Il cavallo non migliora.<br><span style="color:#E05555">Nessun miglioramento alle statistiche.</span><br><span style="font-size:11px;color:rgba(201,168,76,.5)">−${effCosto} oro sprecati</span>`;
    }

    updHUD();salva();

    document.getElementById('MG_CLOSE_BTN').onclick=()=>{
      overlay.remove();
      renderStalla();
    };
  }
}
function vendiCav(idx){
  if(!G.stalla||!G.stalla[idx])return;
  const c=G.stalla[idx];const v=c.valoreVendita!==undefined?c.valoreVendita:calcPrezzoVendita(c);
  G.oro+=v;addLog('Venduto '+c.nome+' per '+v+' oro — torna nel mercato con stat base','inf');
  // Restituisce il cavallo al pool svincolati (con stats base del DB)
  // Il mercato si rigenera automaticamente includendolo
  G.stalla.splice(idx,1);
  if(G.cavSelIdx>=G.stalla.length)G.cavSelIdx=Math.max(0,G.stalla.length-1);
  G.cav=G.stalla[G.cavSelIdx]||null;
  // Rigenera mercato per includere il cavallo appena venduto (con stat base)
  MKT=genMkt();
  updHUD();renderStalla();salva();
}
function licFan(){if(!G.fan)return;addLog(G.fan.nome+' licenziato','inf');G.fan=null;updHUD();renderStalla();salva();}

// ── SCELTA CAVALLO A MAGGIO ──
function sorteggiMeteo(){
  const metei=['pioggia','nuvoloso','sole cocente'];
  return metei[rnd(0,2)];
}
function applicaMeteoACav(cav,meteo){
  // effetti temporanei: salviamo in _meteoPen
  cav._meteoPen={ten:0,res:0};
  if(meteo==='pioggia') cav._meteoPen.ten=1;
  else if(meteo==='sole cocente') cav._meteoPen.res=1;
}
function ripristinaMeteo(cav){delete cav._meteoPen;}
function meteoHTML(meteo){
  const icon=meteo==='pioggia'?'🌧️':meteo==='nuvoloso'?'☁️':'☀️';
  const col=meteo==='pioggia'?'#378ADD':meteo==='nuvoloso'?'rgba(201,168,76,.7)':'#E05555';
  const eff=meteo==='pioggia'?'Tenuta curva −1 (solo per il Palio)':meteo==='nuvoloso'?'Nessun effetto sulle statistiche':'Resistenza −1 (solo per il Palio)';
  return `<div style="text-align:center;padding:10px;background:rgba(0,0,0,.2);border-radius:10px;border:var(--bord);margin-bottom:12px">
    <div style="font-size:28px">${icon}</div>
    <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:${col};margin-top:4px">${meteo.toUpperCase()}</div>
    <div style="font-size:12px;color:rgba(201,168,76,.5);margin-top:3px">${eff}</div>
  </div>`;
}
function showSceltaCavallo(){
  if(!G.cav&&(!G.stalla||!G.stalla.length)){alert('Serve almeno un cavallo per correre!');return;}
  if(!G.fan){alert('Per il Palio serve un fantino!');return;}
  G._meteo=sorteggiMeteo();
  if(!G.stalla||G.stalla.length<=1){G.cavSelIdx=0;G.cav=G.stalla[0];applicaMeteoACav(G.cav,G._meteo);showVigilia();return;}
  R('NAV').style.display='none';
  let html=`<div style="text-align:center;margin-bottom:14px">
    <div style="font-size:30px">🐎</div>
    <div style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--gold);margin-top:6px">Scegli il cavallo per il Palio</div>
  </div>
  ${meteoHTML(G._meteo)}`;
  G.stalla.forEach((cv,i)=>{
    const _scDb=getCavDB(cv.nome);const _scImg=_scDb&&_scDb.img?_scDb.img:'';
    const _scImgHtml=_scImg?`<div style="display:flex;justify-content:center;margin-bottom:10px"><img src="${_scImg}" alt="${cv.nome}" style="max-width:100%;max-height:140px;object-fit:contain;border-radius:8px;border:var(--bord)" onerror="this.style.display='none'"></div>`:'';
    html+=`<div class="card" style="cursor:pointer" onclick="scegliCavParlio(${i})">
      ${_scImgHtml}
      <div style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px">${cv.nome}</div>
      ${sRow('Velocità',cv.vel)}${sRowCapped('Accelerazione',cv.acc,cv.maxAcc)}${sRow('Tenuta curva',cv.ten)}${sRowCapped('Resistenza',cv.res,cv.maxRes)}${sRow('Nervosismo',cv.ner,5,true)}
    </div>`;
  });
  setMain('<div style="padding:12px">'+html+'</div>');
}
function scegliCavParlio(idx){G.cavSelIdx=idx;G.cav=G.stalla[idx];applicaMeteoACav(G.cav,G._meteo);showVigilia();}

// ── MERCATO (solo cavalli) ──
function mktItem(item,i){
  const dbCav=getCavDB(item.nome);
  const imgSrc=dbCav&&dbCav.img?dbCav.img:'';
  const imgHtml=imgSrc?`<div style="width:64px;height:64px;flex-shrink:0;border-radius:8px;overflow:hidden;border:var(--bord);background:#1A0E08;display:flex;align-items:center;justify-content:center">
    <img src="${imgSrc}" alt="${item.nome}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='🐎'">
  </div>`:`<div style="width:64px;height:64px;flex-shrink:0;border-radius:8px;border:var(--bord);background:#1A0E08;display:flex;align-items:center;justify-content:center;font-size:28px">🐎</div>`;
  const stats=sRow('Velocità',item.vel)+sRow('Accelerazione',item.acc)+sRow('Tenuta curva',item.ten)+sRow('Resistenza',item.res)+sRow('Nervosismo',item.ner,5,true);
  return `<div class="mi" style="align-items:flex-start">${imgHtml}<div style="flex:1"><div class="mi-name">${item.nome} <span class="mi-cost">${item.valore} oro</span></div>${stats}
    <button class="btn pr w" style="font-size:13px;padding:11px 13px;margin-top:8px" onclick="buyC(${i})">Acquista</button></div></div>`;
}
function renderMkt(){if(!MKT)MKT=genMkt();R('MKT_C').innerHTML=MKT.c.map((c,i)=>mktItem(c,i)).join('');}
function buyC(i){
  const c=MKT.c[i];if(G.oro<c.valore){showToast('Oro insufficiente!','red');return;}
  G.oro-=c.valore;
  if(!G.stalla)G.stalla=[];
  c.annoAcquisto=G.anno;
  c.valoreVendita=calcPrezzoVendita(c);
  G.stalla.push(c);
  if(!G.cav){G.cav=c;G.cavSelIdx=0;}
  MKT.c.splice(i,1);
  addLog('Acquistato '+c.nome+' per '+c.valore+' oro','inf');
  updHUD();renderMkt();salva();
}

// ── FANTINI MERCATO (sistema ingaggio) ──
// Genera fantini assegnati a contrade (7) e svincolati (resto) ogni anno
function genFantiniMercato(){
  const tuttiNomi=[...NF]; // array completo
  const shuffled=[...tuttiNomi].sort(()=>Math.random()-.5);
  const altreContrade=Object.keys(CDB).filter(k=>k!==G.nome);
  const shuffContrade=[...altreContrade].sort(()=>Math.random()-.5).slice(0,7);
  const fantiniContratti=shuffled.slice(0,7).map((nome,i)=>{
    const db=FANTINI_MAP[nome]||{bravura:rnd(1,5),esp:rnd(1,5),mossa:rnd(1,5),emp:rnd(1,5)};
    return {nome,bravura:db.bravura,esp:db.esp||db.esp,mossa:db.mossa,emp:db.emp,contrada:shuffContrade[i]};
  });
  const fantiniSvincolati=shuffled.slice(7).map(nome=>{
    const db=FANTINI_MAP[nome]||{bravura:rnd(1,5),esp:rnd(1,5),mossa:rnd(1,5),emp:rnd(1,5)};
    return {nome,bravura:db.bravura,esp:db.esp,mossa:db.mossa,emp:db.emp,contrada:null};
  });
  return {contratti:fantiniContratti,svincolati:fantiniSvincolati};
}

function inviaOffertaFnt(i){
  if(G.fan){showToast('Hai già un fantino in stalla! Licenzialo prima.','red');return;}
  const f=G.fantiniMercato.svincolati[i];
  if(!f)return;
  const slEl=R('FNT_SL_'+i);
  if(!slEl)return;
  const offerta=parseInt(slEl.value)||0;
  if(offerta>G.oro){showToast('Oro insufficiente!','red');return;}
  if(offerta===0){showToast('L\'offerta deve essere maggiore di 0!','red');return;}

  // Formula accettazione: ((media stats) - (prestigio/100)) * 500 * random(0.8-1.2) <= offerta
  const mediaStats=(f.bravura+f.esp+f.mossa+f.emp)/4;
  const prestigioMod=(G.prestigio||20)/100;
  const fattoreRandom=0.8+Math.random()*0.4;
  const soglia=(mediaStats-prestigioMod)*500*fattoreRandom;

  const accetta=offerta>=soglia;

  if(accetta){
    G.oro-=offerta;
    G.fan={nome:f.nome,bravura:f.bravura,esp:f.esp,mossa:f.mossa,emp:f.emp,costo:offerta};
    G.fantiniMercato.svincolati.splice(i,1);
    addLog(f.nome+' ingaggiato per '+offerta+' oro','grn');
    updHUD();salva();
    mostraEsitoOffertaFnt(f.nome,true,offerta,Math.round(soglia));
  } else {
    if(!G.fantiniRifiutati)G.fantiniRifiutati={};
    G.fantiniRifiutati[f.nome]=true;
    addLog(f.nome+' ha rifiutato l\'offerta di '+offerta+' oro e non vuole più essere contattato quest\'anno','red');
    salva();
    mostraEsitoOffertaFnt(f.nome,false,offerta,Math.round(soglia));
  }
}

function eseguiPol(){
  if(!PB){showToast('Seleziona un bersaglio!','red');return;}
  const isN=PB===G.nemica;
  if(PT==='ACCORDO'){
    if(isN){showToast('Non puoi fare accordi con la tua nemica!','red');return;}
    if(G.oro<300){showToast('Servono 300 oro per l\'accordo!','red');return;}
    G.oro-=300;modAmicizia(PB,25);
    addLog('Accordo con '+PB+'. Amicizia +25','inf');

    PB=null;updHUD();renderPol();salva();return;
  }
  // Per IMBOSCATA si apre sempre il minigioco: l'esito dipende dal giocatore
  if(PT==='IMBOSCATA'){
    apriMinigiocolmboscata(PB,isN);
    return;
  }

  const mod=G.bonus==='DIPLOMAZIA_ASTUTA'?.70:1;

  if(scoperto){
    G.oro=Math.max(0,G.oro-300);G.morale=clamp(G.morale-10,0,200);
    modAmicizia(PB,-10);
    addLog('SCOPERTO su '+PB+'! −300 oro, amicizia −10','red');
    showToast('✗ SCOPERTO! −300 oro, −10 amicizia con '+PB,'red');
    PB=null;updHUD();renderPol();salva();
  } else {
    if(PT==='SCHERZO'){
      // Trovare la nemica del bersaglio (colei che odia PB)
      const nemicaDelBersaglio=CDB[PB]?CDB[PB].nemica:null;
      if(isN){
        G.morale=clamp(G.morale+15,0,200);
        addLog('Scherzo su '+PB+' (nemica) riuscito! −15 morale a '+PB+', +15 morale contradaioli','grn');
        showToast('✦ Scherzo riuscito su '+PB+'! +15 morale tuoi contradaioli','grn');
      } else {
        if(nemicaDelBersaglio && nemicaDelBersaglio!==G.nome){
          modAmicizia(nemicaDelBersaglio,15);
          addLog('Scherzo su '+PB+' riuscito! −15 morale a '+PB+', +15 amicizia con '+nemicaDelBersaglio,'grn');
          showToast('✦ Scherzo riuscito su '+PB+'! +15 amicizia con '+nemicaDelBersaglio,'grn');
        } else {
          G.morale=clamp(G.morale+15,0,200);
          addLog('Scherzo su '+PB+' riuscito! −15 morale a '+PB+', +15 morale tuoi','grn');
          showToast('✦ Scherzo riuscito su '+PB+'! +15 morale','grn');
        }
      }
      modPrestigio(5,'Scherzo riuscito');
      PB=null;updHUD();renderPol();salva();
    }
  }
}

// ── MINIGIOCO IMBOSCATA ──
// CONTRADA_COLORS definita più avanti (riga ~3701) con i colori ufficiali del Palio

function apriMinigiocolmboscata(bersaglio, isNemica){
  const GRID=6;
  // Genera labirinto con algoritmo DFS
  const walls={h:[],v:[]};
  for(let r=0;r<GRID;r++){walls.h[r]=[];walls.v[r]=[];for(let c=0;c<GRID;c++){walls.h[r][c]=true;walls.v[r][c]=true;}}
  const visited=Array.from({length:GRID},()=>Array(GRID).fill(false));
  function dfs(r,c){
    visited[r][c]=true;
    const dirs=[[0,1,'v'],[1,0,'h'],[0,-1,'v'],[-1,0,'h']].sort(()=>Math.random()-.5);
    for(const[dr,dc,wType] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=GRID||nc<0||nc>=GRID||visited[nr][nc])continue;
      if(wType==='h')walls.h[Math.min(r,nr)][c]=false;
      else walls.v[r][Math.min(c,nc)]=false;
      dfs(nr,nc);
    }
  }
  dfs(0,0);

  // Genera 3 celle rosse casuali (escluse start 0,0 e end 5,5), non adiacenti tra loro
  function generateRedCells(){
    const s=[];
    let attempts=0;
    while(s.length<3&&attempts<200){
      attempts++;
      const r=rnd(0,GRID-1),c=rnd(0,GRID-1);
      const k=r+','+c;
      if((r===0&&c===0)||(r===GRID-1&&c===GRID-1))continue;
      // Controlla che non sia adiacente a nessuna cella già scelta
      const adiacenteAllaEsistente=s.some(([er,ec])=>Math.abs(er-r)<=1&&Math.abs(ec-c)<=1);
      if(adiacenteAllaEsistente)continue;
      s.push([r,c]);
    }
    return new Set(s.map(([r,c])=>r+','+c));
  }
  let redCells=generateRedCells();

  // Timer per muovere le celle rosse ogni 1 secondo
  let redMoveInterval=null;
  function moveRedCells(){
    const newRed=new Set();
    const redArr=[...redCells].map(k=>k.split(',').map(Number));
    redArr.forEach(([rr,cc])=>{
      // Trova celle NON adiacenti (distanza > 1 in entrambe le direzioni) escludendo start/end
      const candidates=[];
      for(let nr=0;nr<GRID;nr++){
        for(let nc=0;nc<GRID;nc++){
          if((nr===0&&nc===0)||(nr===GRID-1&&nc===GRID-1))continue;
          if(Math.abs(nr-rr)<=1&&Math.abs(nc-cc)<=1)continue; // escludi adiacenti e sé stessa
          const nk=nr+','+nc;
          if(newRed.has(nk))continue;
          // Non adiacente ad altre celle rosse già posizionate
          const adjAltra=[...newRed].some(k=>{const[er,ec]=k.split(',').map(Number);return Math.abs(er-nr)<=1&&Math.abs(ec-nc)<=1;});
          if(!adjAltra)candidates.push(nk);
        }
      }
      if(candidates.length>0){
        newRed.add(candidates[Math.floor(Math.random()*candidates.length)]);
      } else {
        // fallback: sposta in cella libera qualsiasi (non start/end, non già occupata)
        const fb=[];
        for(let nr=0;nr<GRID;nr++)for(let nc=0;nc<GRID;nc++){
          if((nr===0&&nc===0)||(nr===GRID-1&&nc===GRID-1))continue;
          const nk=nr+','+nc;if(!newRed.has(nk))fb.push(nk);
        }
        if(fb.length>0)newRed.add(fb[Math.floor(Math.random()*fb.length)]);
      }
    });
    // Assicura esattamente 3 celle rosse
    while(newRed.size<3){
      const fb=[];
      for(let nr=0;nr<GRID;nr++)for(let nc=0;nc<GRID;nc++){
        if((nr===0&&nc===0)||(nr===GRID-1&&nc===GRID-1))continue;
        const nk=nr+','+nc;if(!newRed.has(nk))fb.push(nk);
      }
      if(fb.length===0)break;
      newRed.add(fb[Math.floor(Math.random()*fb.length)]);
    }
    redCells=newRed;
    // Controlla se il giocatore è finito su una cella rossa dopo il movimento
    if(!gameOver&&!gameWon&&redCells.has(px+','+py)){
      gameOver=true;render('lose');return;
    }
    if(!gameOver&&!gameWon)render('play');
  }

  let px=0,py=0;
  let gameOver=false,gameWon=false;
  const CELL=Math.min(46,Math.floor((Math.min(320,window.innerWidth-40)-12)/(GRID+0.5)));
  const TOTAL=CELL*GRID;
  const colors=CONTRADA_COLORS[G.nome]||{c1:'#8B1A1A',c2:'#C9A84C'};

  // Costruisce SVG defs per il pallino contrada con divisione obliqua o strisce verticali
  function buildPlayerDefs(r){
    const pid='pcd_'+r;
    const c1=colors.c1,c2=colors.c2;
    const isSanMartino=(G.nome==='SanMartino'||G.nome==='San Martino');
    if(isSanMartino){
      // Pallino blu pieno con croce bianca — polygon unico per evitare artefatti
      const t=r*0.38;
      const pts=`${-t/2},${-r} ${t/2},${-r} ${t/2},${-t/2} ${r},${-t/2} ${r},${t/2} ${t/2},${t/2} ${t/2},${r} ${-t/2},${r} ${-t/2},${t/2} ${-r},${t/2} ${-r},${-t/2} ${-t/2},${-t/2}`;
      return `<defs>
        <clipPath id="cp_${pid}"><circle cx="0" cy="0" r="${r}"/></clipPath>
        <g id="${pid}">
          <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="#1A3A8C"/>
          <polygon points="${pts}" fill="#FFFFFF"/>
        </g>
      </defs>`;
    } else if(colors.stripes){
      // 3 strisce verticali: c1 | c2 | c1  (rosso/bianco/rosso per SanMagno)
      return `<defs>
        <clipPath id="cp_${pid}"><circle cx="0" cy="0" r="${r}"/></clipPath>
        <g id="${pid}">
          <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="${c1}"/>
          <rect x="${-r/3}" y="${-r}" width="${r*2/3}" height="${r*2}" fill="${c2}"/>
        </g>
      </defs>`;
    } else {
      // Divisione obliqua /: triangolo in basso a destra = c2, resto = c1
      return `<defs>
        <clipPath id="cp_${pid}"><circle cx="0" cy="0" r="${r}"/></clipPath>
        <g id="${pid}">
          <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="${c1}"/>
          <polygon points="${-r},${r} ${r},${-r} ${r},${r}" fill="${c2}"/>
        </g>
      </defs>`;
    }
  }

  function buildPlayerSVG(cx2,cy2,r){
    const pid='pcd_'+r;
    const isSanMartino=(G.nome==='SanMartino'||G.nome==='San Martino');
    if(isSanMartino){
      const t=r*0.38;
      const pts=`${-t/2},${-r} ${t/2},${-r} ${t/2},${-t/2} ${r},${-t/2} ${r},${t/2} ${t/2},${t/2} ${t/2},${r} ${-t/2},${r} ${-t/2},${t/2} ${-r},${t/2} ${-r},${-t/2} ${-t/2},${-t/2}`;
      return `<g transform="translate(${cx2},${cy2})" clip-path="url(#cp_${pid})">
        <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="#1A3A8C"/>
        <polygon points="${pts}" fill="#FFFFFF"/>
      </g>
      <circle cx="${cx2}" cy="${cy2}" r="${r}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>`;
    } else if(colors.stripes){
      return `<g transform="translate(${cx2},${cy2})" clip-path="url(#cp_${pid})">
        <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="${colors.c1}"/>
        <rect x="${-r/3}" y="${-r}" width="${r*2/3}" height="${r*2}" fill="${colors.c2}"/>
      </g>
      <circle cx="${cx2}" cy="${cy2}" r="${r}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>`;
    } else {
      return `<g transform="translate(${cx2},${cy2})" clip-path="url(#cp_${pid})">
        <rect x="${-r}" y="${-r}" width="${r*2}" height="${r*2}" fill="${colors.c1}"/>
        <polygon points="${-r},${r} ${r},${-r} ${r},${r}" fill="${colors.c2}"/>
      </g>
      <circle cx="${cx2}" cy="${cy2}" r="${r}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>`;
    }
  }

  const overlay=document.createElement('div');
  overlay.id='IMBOSCATA_OVERLAY';
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px';

  function buildHTML(state){
    const bgColor=state==='win'?'rgba(26,74,26,.97)':state==='lose'?'rgba(139,26,26,.97)':'linear-gradient(135deg,#261508,#3D1F0A)';
    const borderCol=state==='win'?'#5DBB63':state==='lose'?'#E05555':'var(--gold)';
    let resultHTML='';
    if(state==='win'){
      const cavIA=CAVALLI_IA[bersaglio]||null;
      if(cavIA){
        resultHTML=`<div style="margin-top:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:10px;border-left:3px solid #5DBB63">
          <div style="font-family:var(--fn);font-size:12px;color:#5DBB63;font-weight:700;margin-bottom:6px">📋 Cavallo di ${bersaglio}: ${cavIA.nome}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:rgba(201,168,76,.8);font-family:var(--fn)">
            <div>⚡ Velocità: ${cavIA.vel}/5</div>
            <div>🚀 Accelerazione: ${cavIA.acc}/5</div>
            <div>🔄 Tenuta: ${cavIA.ten}/5</div>
            <div>💪 Resistenza: ${cavIA.res}/5</div>
            <div>😤 Nervosismo: ${cavIA.ner}/5</div>
          </div>
        </div>`;
      } else {
        resultHTML=`<div style="margin-top:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:10px;border-left:3px solid #5DBB63">
          <div style="font-family:var(--fn);font-size:12px;color:#5DBB63;font-weight:700">${bersaglio} non ha ancora un cavallo assegnato.</div>
        </div>`;
      }
    }
    if(state==='lose'){
      resultHTML=`<div style="margin-top:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:10px;border-left:3px solid #E05555">
        <div style="font-family:var(--fn);font-size:12px;color:#E05555;font-weight:700">Penalità: −300 oro · Amicizia con ${bersaglio} −10</div>
      </div>`;
    }
    const strokeW=2,wallW=3;
    let svgPaths='';
    svgPaths+=`<rect x="0" y="0" width="${TOTAL}" height="${TOTAL}" fill="none" stroke="rgba(201,168,76,0.5)" stroke-width="${strokeW}"/>`;
    for(let r=0;r<GRID-1;r++){
      for(let c=0;c<GRID;c++){
        if(walls.h[r][c])svgPaths+=`<line x1="${c*CELL}" y1="${(r+1)*CELL}" x2="${(c+1)*CELL}" y2="${(r+1)*CELL}" stroke="rgba(201,168,76,0.7)" stroke-width="${wallW}"/>`;
      }
    }
    for(let r=0;r<GRID;r++){
      for(let c=0;c<GRID-1;c++){
        if(walls.v[r][c])svgPaths+=`<line x1="${(c+1)*CELL}" y1="${r*CELL}" x2="${(c+1)*CELL}" y2="${(r+1)*CELL}" stroke="rgba(201,168,76,0.7)" stroke-width="${wallW}"/>`;
      }
    }
    // Celle rosse (animate con leggero pulse se in gioco)
    let redRects='';
    redCells.forEach(key=>{
      const[rr,cc]=key.split(',').map(Number);
      redRects+=`<rect x="${cc*CELL+2}" y="${rr*CELL+2}" width="${CELL-4}" height="${CELL-4}" fill="rgba(180,20,20,0.75)" rx="4">
        ${state==='play'?`<animate attributeName="opacity" values="0.75;1;0.75" dur="1.4s" repeatCount="indefinite"/>`:''}
      </rect>`;
    });
    const gx=(GRID-1)*CELL,gy=(GRID-1)*CELL;
    const endMark=`<rect x="${gx+3}" y="${gy+3}" width="${CELL-6}" height="${CELL-6}" fill="rgba(30,120,30,0.5)" rx="3"/><text x="${gx+CELL/2}" y="${gy+CELL/2+5}" text-anchor="middle" font-size="14" fill="#5DBB63">✓</text>`;
    // Pallino giocatore con colori contrada (divisione obliqua o strisce verticali)
    const pr=CELL/2-4;
    const pcx=py*CELL+CELL/2,pcy=px*CELL+CELL/2;
    const playerDefs=buildPlayerDefs(pr);
    const playerShape=buildPlayerSVG(pcx,pcy,pr);
    const svgContent=`<svg width="${TOTAL}" height="${TOTAL}" viewBox="0 0 ${TOTAL} ${TOTAL}" style="display:block;border-radius:4px;background:#0D0806">
      ${playerDefs}
      ${svgPaths}${redRects}${endMark}
      ${playerShape}
    </svg>`;

    let btnHTML='';
    if(state==='play'){
      btnHTML=`<div style="display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin-top:10px">
        <div></div>
        <button onclick="mgMove(-1,0)" style="width:44px;height:44px;border-radius:8px;border:1px solid rgba(201,168,76,.4);background:rgba(61,31,10,.9);color:var(--gold);font-size:20px;cursor:pointer;-webkit-appearance:none">↑</button>
        <div></div>
        <button onclick="mgMove(0,-1)" style="width:44px;height:44px;border-radius:8px;border:1px solid rgba(201,168,76,.4);background:rgba(61,31,10,.9);color:var(--gold);font-size:20px;cursor:pointer;-webkit-appearance:none">←</button>
        <button onclick="mgMove(1,0)" style="width:44px;height:44px;border-radius:8px;border:1px solid rgba(201,168,76,.4);background:rgba(61,31,10,.9);color:var(--gold);font-size:20px;cursor:pointer;-webkit-appearance:none">↓</button>
        <button onclick="mgMove(0,1)" style="width:44px;height:44px;border-radius:8px;border:1px solid rgba(201,168,76,.4);background:rgba(61,31,10,.9);color:var(--gold);font-size:20px;cursor:pointer;-webkit-appearance:none">→</button>
      </div>`;
    } else {
      const onClose=state==='win'?'onImWin()':'onImLose()';
      btnHTML=`<button onclick="${onClose}" class="btn gold w" style="margin-top:12px">${state==='win'?'⚜ Ottimo lavoro! Chiudi':'✗ Chiudi'}</button>`;
    }
    const titleText=state==='win'?'🥷 Imboscata Riuscita!':state==='lose'?'💥 Imboscata Fallita!':'🥷 Minigioco Imboscata';
    const subtitleText=state==='win'?'Hai scoperto i segreti di '+bersaglio+'!':state==='lose'?'Sei stato scoperto! Paghi il prezzo.':'Guida il pallino fino al ✓ senza toccare il rosso (le guardie si muovono!)';
    return `<div style="background:${bgColor};border:2px solid ${borderCol};border-radius:16px;padding:16px;max-width:360px;width:100%;box-shadow:0 0 40px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto">
      <div style="text-align:center;margin-bottom:10px">
        <div style="font-family:var(--fn);font-size:17px;font-weight:800;color:${borderCol};letter-spacing:.5px">${titleText}</div>
        <div style="font-size:11px;color:rgba(201,168,76,.6);margin-top:3px;font-family:var(--fn)">${subtitleText}</div>
      </div>
      <div style="display:flex;justify-content:center;margin-bottom:4px">${svgContent}</div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(201,168,76,.4);font-family:var(--fn);margin-bottom:2px"><span>▲ START</span><span>Bersaglio: ${bersaglio}</span><span>FINE ▼</span></div>
      ${btnHTML}
      ${resultHTML}
    </div>`;
  }

  function render(state){overlay.innerHTML=buildHTML(state);}

  window.mgMove=function(dr,dc){
    if(gameOver||gameWon)return;
    const nr=px+dr,nc=py+dc;
    if(nr<0||nr>=GRID||nc<0||nc>=GRID)return;
    if(dr===1&&walls.h[px][py])return;
    if(dr===-1&&walls.h[nr][py])return;
    if(dc===1&&walls.v[px][py])return;
    if(dc===-1&&walls.v[nr][nc])return;
    px=nr;py=nc;
    if(redCells.has(px+','+py)){gameOver=true;if(redMoveInterval){clearInterval(redMoveInterval);redMoveInterval=null;}render('lose');return;}
    if(px===GRID-1&&py===GRID-1){gameWon=true;if(redMoveInterval){clearInterval(redMoveInterval);redMoveInterval=null;}render('win');return;}
    render('play');
  };

  // Avvia timer movimento celle rosse (ogni 1 secondo)
  redMoveInterval=setInterval(()=>{
    if(gameOver||gameWon){clearInterval(redMoveInterval);redMoveInterval=null;return;}
    moveRedCells();
  },1000);

  function keyHandler(e){
    if(!document.getElementById('IMBOSCATA_OVERLAY'))return;
    if(e.key==='ArrowUp')window.mgMove(-1,0);
    else if(e.key==='ArrowDown')window.mgMove(1,0);
    else if(e.key==='ArrowLeft')window.mgMove(0,-1);
    else if(e.key==='ArrowRight')window.mgMove(0,1);
    e.preventDefault();
  }
  document.addEventListener('keydown',keyHandler);

  function cleanup(){
    document.removeEventListener('keydown',keyHandler);
    if(redMoveInterval){clearInterval(redMoveInterval);redMoveInterval=null;}
  }

  window.onImWin=function(){
    cleanup();
    overlay.remove();
    modAmicizia(PB,10);
    const cav=G.stalla&&G.stalla.length?G.stalla[0]:null;
    if(cav&&isNemica)cav.ner=clamp(cav.ner-0.5,1,5);
    if(!G.imboscateVinte)G.imboscateVinte={};
    G.imboscateVinte[bersaglio]=true;
    addLog('Imboscata su '+bersaglio+(isNemica?' (nemica)':'')+' riuscita! Statistiche cavallo scoperte.','grn');
    modPrestigio(5,'Imboscata riuscita');
    PB=null;updHUD();renderPol();salva();
  };

  window.onImLose=function(){
    cleanup();
    overlay.remove();
    G.oro=Math.max(0,G.oro-300);
    modAmicizia(bersaglio,-10);
    addLog('Imboscata su '+bersaglio+' fallita! −300 oro, amicizia −10','red');
    showToast('✗ Imboscata fallita! −300 oro, −10 amicizia','red');
    PB=null;updHUD();renderPol();salva();
  };

  document.getElementById('APP').appendChild(overlay);
  render('play');
}

        </div>

function renderLog(){
  const el=R('LOGL');if(!el)return;
  if(!G){el.innerHTML='<div class="le">Nessun dato.</div>';return;}
  // Albo d'Oro: mostra anno per anno chi ha vinto il Palio
  const storico=G.albumStorico||[];
  if(!storico.length){el.innerHTML='<div class="le">Nessun Palio ancora disputato.</div>';return;}
  let html='';
  // Raggruppa per anno — in grassetto SOLO le vittorie fatte dal giocatore (isPlayerVictory)
  storico.forEach(entry=>{
    const isPlayer=entry.isPlayerVictory===true;
    html+=`<div class="le ${isPlayer?'grn':''}">
      <strong style="color:var(--gold)">${entry.anno}</strong> — 
      ${isPlayer
        ?`<strong style="color:#5DBB63">🏆 ${entry.vincitore} (TU)</strong>`
        :`${entry.vincitore}${entry.vincitore===G.nemica?' <span class="bdg r">nemica</span>':''}`
      }
    </div>`;
  });
  el.innerHTML=html;
}

  addLog('Cena propiziatoria! Raccolta '+guad+' oro, morale +15','grn');
  updHUD();salva();

// ── CORSA ──
function scoreGiro(isPlayer,giro,mult,nomeContrada){
  let cOrig;
  if(isPlayer){
    cOrig=G.cav;
  } else {
    // Usa il cavallo assegnato a questa contrada dal DB, altrimenti random
    const dbCav=CAVALLI_IA[nomeContrada]||null;
    cOrig=dbCav?{vel:dbCav.vel,acc:dbCav.acc,ten:dbCav.ten,res:dbCav.res,ner:dbCav.ner}:newIACav();
  }
  const f=isPlayer?G.fan:newIAFan();
  const pen=isPlayer&&cOrig&&cOrig._meteoPen?cOrig._meteoPen:{ten:0,res:0};
  let velEff=cOrig.vel, resEff=Math.max(1,cOrig.res-(pen.res||0));
  // Applica effetti temporanei strategia solo per il calcolo (non modifica le stat permanenti)
  if(isPlayer&&G._strategia){
    if(G._strategia.tipo==='tenuta'){velEff=Math.max(1,velEff-1);resEff=Math.min(5,resEff+2);}
    else if(G._strategia.tipo==='morte'){velEff=Math.min(5,velEff+2);resEff=Math.max(1,resEff-1);}
  }
  const tenEff=Math.max(1,cOrig.ten-(pen.ten||0));
  const fatica=Math.max(0,(giro-1)*(6-resEff)*.2);
  const base=(velEff+cOrig.acc+tenEff)-fatica+(f.bravura*.5+f.emp*.2);
  return base*((giro===1&&isPlayer)?mult:1)+rf(0,3);
}
function simBatteria(nomi,giri,isPlayerBatt){
  const sc={};nomi.forEach(n=>sc[n]=0);const gpg=[];
  const strat=G&&G._strategia;
  for(let g=1;g<=giri;g++){
    nomi.forEach(n=>{
      let base=scoreGiro(isPlayerBatt&&n===G.nome,g,Mos.mult,n);
      // Strategia "contro_nemica": penalizza sia il player che la nemica nell'ultimo giro
      if(strat&&strat.tipo==='contro_nemica'&&g===giri){
        if(n===G.nome||n===strat.bersaglio)base*=0.1;
      }
      // Strategia "patti": la contrada bersaglio rallenta nell'ultimo giro per far passare il player
      if(strat&&strat.tipo==='patti'&&g===giri&&n===strat.bersaglio)base*=0.5;
      sc[n]+=base;
    });
    gpg.push([...Object.entries(sc)].sort((a,b)=>b[1]-a[1]).map(x=>x[0]));
  }
  return gpg;
}
function avviaCorsa(){
  const bP=G._bP,bIA=G._bIA;
  // Applica eventuali modifiche da strategia al cavallo prima di simulare
  // (già applicate in scegliStrategiaCap; la strategia 'contro_nemica' e 'patti' agiscono in simBatteria)
  const gpgP=simBatteria(bP,4,true);const gpgIA=simBatteria(bIA,4,false);
  const qP=gpgP[gpgP.length-1].slice(0,2);const qIA=gpgIA[gpgIA.length-1].slice(0,2);
  G._qP=qP;G._qIA=qIA;
  // Aggiorna prestigio in base alla qualificazione
  if(qP.includes(G.nome))modPrestigio(10,'Qualificato in finale');
  else modPrestigio(-5,'Eliminato in batteria');
  salva();
  // Mostra animazione grafica batteria A (quella del giocatore)
  showRaceAnimation(bP, gpgP, 4, G.nome,
    ()=>showRaceAnimation(bIA, gpgIA, 4, null,

function fineAnno(vinta,cambiaContrada,nuovaContrada){

  G.manieroOrganizzaCena=false;G.manieroVenditaGadget=false;G.manieroOrganizzaEvento=false;G.manieroManutenzione=false;G.manieroGiornataAperta=false;
  // Reset imboscate vinte: a fine anno il giocatore deve rifare le imboscate per scoprire i cavalli
  G.imboscateVinte={};
  addLog('Fine anno: le imboscate riuscite sono azzerate. Dovrai scoprire di nuovo i cavalli avversari.','inf');
  G.puntSfilata=0;G._bP=null;G._bIA=null;G._qP=null;G._qIA=null;G._vinta=null;
  // Budget fine anno — solo se si resta nella stessa contrada
  if(!cambiaContrada){
    if(G.bonus==='VOLANO_POPOLARE'){G.oro+=vinta?3000:Math.floor(G.morale*30*rf(.8,1.2));}
    else{G.oro+=(vinta?3000:2000);}
  }
  // Invecchiamento cavalli: solo dal 3° anno in stalla
  // (non invecchia nell'anno dell'acquisto né in quello successivo, inizia dal 3°)
  if(G.stalla){G.stalla.forEach(c=>{
    if(!c.annoAcquisto)c.annoAcquisto=G.anno-1; // retrocompatibilità: assume acquistato l'anno scorso
    const anniInStalla=G.anno-c.annoAcquisto;
    if(anniInStalla>=2){c.maxAcc=Math.max(1,c.maxAcc-1);c.maxRes=Math.max(1,c.maxRes-1);c.acc=Math.min(c.acc,c.maxAcc);c.res=Math.min(c.res,c.maxRes);}
    c.valoreVendita=calcPrezzoVendita(c);
  });}
  G.anno++;
  if(cambiaContrada&&nuovaContrada){
    const db=CDB[nuovaContrada];
    G.nome=nuovaContrada;G.nemica=db.nemica;G.bonus=db.bonus;
    G.morale=db.morale;
    G.oro=db.budget;
    G.stalla=[];G.cav=null;G.cavSelIdx=0;
    inizAmicizia();
    // Reset condizioni maniero al cambio di contrada
    G.condManiero=60;
    // Reset obiettivi al cambio di contrada (tranne il prestigio che si conserva)
    G.obiettivi={ceneAnno:0,eventiAnno:0,consecutivi:0,completati:{}};
    addLog('Nuova contrada: '+nuovaContrada+'. Stalla azzerata, budget di partenza. Condizioni maniero: 60.','inf');
  } else {
    G.cav=G.stalla&&G.stalla.length?G.stalla[0]:null;G.cavSelIdx=0;
    // Le condizioni del maniero si conservano rimanendo nella stessa contrada
  }
  assegnaCavalliIAAnno();
  MKT=genMkt();G.fantiniMercato=null;G.fantiniRifiutati={};salva();
  R('HUD').style.display='grid';R('NAV').style.display='flex';
  R('MAIN').innerHTML='';avviaUI();
}

// "assemblea" (meccanica da programmare in seguito), rispettando l'età minima e, per

const N_STATUS_INFO={
  cucciolo:      {label:'Cucciolo di contrada', etaMin:0,  viaAssemblea:false, richiede:[]},
  contradaiolo:  {label:'Contradaiolo',         etaMin:15, viaAssemblea:false, richiede:[]},

};
// Status "speciali" (assegnati da assemblea): finché il giocatore li detiene non tornano
// automaticamente a "contradaiolo" al cambio anno.
const N_STATUS_SPECIALI=['gonfaloniere','capitano','granPriore','addettoStalla','addettoCorse'];

// Permessi di accesso per ciascuno status.
// stalla:  'none' (nav bloccata) | 'view' (solo visione cavallo/fantino) |
//          'train' (visione + allenamenti/minigioco, no vendi/licenzia) | 'full'
// cavalli: 'none' (nav bloccata) | 'proponi' (solo "Proponi al capitano", no acquisto) | 'full'
// fantini: 'none' (nav bloccata) | 'full'
const N_STATUS_PERMESSI={
  cucciolo:      {nav:['mese','albo'],
                   mese:['rapportoContradaioli'], maniero:['serata'],
                   stalla:'none', cavalli:'none', fantini:'none'},
  contradaiolo:  {nav:['mese','stalla','contrade','albo'],
                   mese:['rapportoContradaioli'], maniero:['serata','daiMano'],
                   stalla:'view', cavalli:'none', fantini:'none'},
  gonfaloniere:  {nav:['mese','stalla','contrade','albo'],
                   mese:['rapportoContradaioli'], maniero:['serata','daiMano'],
                   stalla:'view', cavalli:'none', fantini:'none'},
  capitano:      {nav:['mese','stalla','cavalli','fantini','contrade','albo'],
                   mese:['rapportoContradaioli','corseAddestramento'], maniero:['serata','daiMano','organizza','consiglio'],
                   stalla:'full', cavalli:'full', fantini:'full', vet:true},
  granPriore:    {nav:['mese','stalla','contrade','albo'],
                   mese:['rapportoContradaioli'], maniero:['serata','daiMano','organizza'],
                   stalla:'view', cavalli:'none', fantini:'none'},
  addettoStalla: {nav:['mese','stalla','contrade','albo'],
                   mese:['rapportoContradaioli'], maniero:['serata','daiMano'],
                   stalla:'train', cavalli:'none', fantini:'none', vet:true},
  addettoCorse:  {nav:['mese','stalla','cavalli','fantini','contrade','albo'],
                   mese:['rapportoContradaioli','corseAddestramento'], maniero:['serata','daiMano'],
                   stalla:'full', cavalli:'proponi', fantini:'full', vet:true}
};

// Chiave di status corrente del giocatore (fallback 'contradaiolo'); ricostruita dall'etichetta
// testuale N.status per compatibilità con i salvataggi precedenti a questa funzionalità.
function nStatusKey(){
  if(!N)return'contradaiolo';
  if(N.statusKey&&N_STATUS_INFO[N.statusKey])return N.statusKey;
  const trovata=Object.entries(N_STATUS_INFO).find(([,inf])=>inf.label===N.status);
  return trovata?trovata[0]:'contradaiolo';
}
function nPermessiStatus(){return N_STATUS_PERMESSI[nStatusKey()]||N_STATUS_PERMESSI.contradaiolo;}
function nNavConsentito(id){return nPermessiStatus().nav.includes(id);}
function nMeseConsentito(az){return nPermessiStatus().mese.includes(az);}
function nManieroConsentito(az){return nPermessiStatus().maniero.includes(az);}
function nStatusLabel(){return N_STATUS_INFO[nStatusKey()].label;}

// Breve descrizione (mostrata nella schermata Mese) di ciò che lo status attuale permette
function nStatusDescrizioneAccesso(){
  const perm=nPermessiStatus();
  const noteExtra={
    view:'Stalla in sola visione',
    train:'Stalla: solo allenamenti',
    proponi:'Cavalli: solo proponi al capitano'
  };
  const note=[];
  if(noteExtra[perm.stalla])note.push(noteExtra[perm.stalla]);
  if(noteExtra[perm.cavalli])note.push(noteExtra[perm.cavalli]);
  const labels=N_NAV_ITEMS.filter(it=>perm.nav.includes(it.id)).map(it=>it.label);
  return '🔓 Accesso: '+labels.join(', ')+(note.length?' — '+note.join(', '):'');
}

// Aggiorna lo status in base all'età: sotto i 15 anni "Cucciolo di contrada", dai 15 anni
// in su "Contradaiolo" — a meno che il giocatore detenga già uno status speciale ottenuto
// tramite assemblea (Gonfaloniere, Capitano, Gran Priore, Addetto Stalla, Addetto Corse),
// nel qual caso resta invariato finché non viene revocato altrove.
function nAggiornaStatus(){
  if(!N)return;
  const attuale=nStatusKey();
  if(N_STATUS_SPECIALI.includes(attuale))return;
  const nuova=N.eta<=14?'cucciolo':'contradaiolo';
  N.statusKey=nuova;
  N.status=N_STATUS_INFO[nuova].label;
}
